# =============================================================================
# article-api application.yml —— 对应 Go 端 service/article/api/etc/article-api.yaml
# =============================================================================
# 1:1 迁移原则：Go yaml 的每个字段都在这里有对应；Spring / devh starter 用自己的
# 字段名表达同一语义。不新增 Go 侧不存在的开关。
# =============================================================================

spring:
  application:
    name: article-api

  # ============== multipart 上限（Go 侧由 MaxBytes + ParseMultipartForm 承担）==============
  # ⚠️ 必须与下面 rag.protection.max-bytes **同为 10485760**。
  #    两条是不同的闸门，缺一不可：
  #      · rag.protection.max-bytes → 看 **Content-Length 头**，超了裸 413
  #        （对应 Go rest/handler/maxbyteshandler.go:19 `if r.ContentLength > n`）
  #      · 这里的 max-file-size → **没有 Content-Length**（chunked）时由容器兜底
  #        （Go 侧这种情况会一路走到 r.FormFile 失败 ⇒ 400 text/plain）
  #    写死 10MB 而不写 1MB：Go 的 RestConf.MaxBytes 就是 10485760。
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ============== Nacos 服务发现（用于解析 discovery:///article-rpc 与 /user-rpc）==============
  # Go 端是 etcd flat key "article.rpc" / "user.rpc"（无 namespace / group 分层）。
  # Java 端用 Nacos。namespace / group 必须与被调方保持一致，否则解析不到实例，
  # 所有 RPC 都会塌成 1015（CodeServerBusy）。
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}

# =============================================================================
# HTTP server
# =============================================================================
# Go: article-api.yaml 的 Host=0.0.0.0 / Port=8889
server:
  port: ${ARTICLE_API_PORT:8889}
  address: 0.0.0.0
  servlet:
    context-path: /
  # ⚠️ 容器三旋钮：与 Go 对齐（Go 出处 + 实测 ⇒ docs/DRIFT/hot/api.md 的 DRIFT-HOTAPI-021/022/023；
  #    守门 ⇒ tools/difftest/check-tomcat-limits.py）
  #    ① relaxed-query-chars：Go 的 net/http 不校验 query 里的 [ ]，且 go-zero httpx.GetFormValues
  #       明确支持方括号数组记法；Tomcat 默认拒绝 ⇒ 400 + HTML 错误页（不是业务信封）
  #    ② max-parameter-count：Go = go-zero httpx/util.go:15 maxFormParamCount=2048（应用层判）；
  #       Boot 4 默认 1000 ⇒ Tomcat 先拒，RAG 自己实现的 2048 判据在 GET query 上不可达
  #    ③ max-http-request-header-size：Go 的**真实**上限 = DefaultMaxHeaderBytes(1<<20)
  #       + 4096（net/http/server.go:941 `return int64(s.maxHeaderBytes()) + 4096 // bufio slop`）
  #       ⇒ 1 MiB + 4 KiB = **1028KB**；Boot 4 默认 8KB
  tomcat:
    relaxed-query-chars: ["[", "]"]
    max-parameter-count: 2048
  max-http-request-header-size: 1028KB

# =============================================================================
# gRPC client（连 article-rpc / user-rpc）
# =============================================================================
# Go: ArticleRpcConf / UserRpcConf 的 Etcd{ Hosts: [etcd:2379], Key: … }
# Java: devh grpc-client-spring-boot-starter + Nacos name resolver。
# ⚠️ negotiation-type 不能省（DRIFT-NEW-014）：devh 的默认值是 TLS，
#   不写会静默发 TLS ClientHello，而 article-rpc / user-rpc 都是明文 gRPC
#   （Go 侧 zrpc.MustNewServer 全仓无 TLS 配置）。
grpc:
  client:
    article-rpc:
      address: discovery:///article-rpc
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      permit-keep-alive-without-calls: true
    user-rpc:
      address: discovery:///user-rpc
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      permit-keep-alive-without-calls: true

# =============================================================================
# 业务配置（对齐 Go 端 Auth.*）
# =============================================================================
# Go: article-api.yaml
#   Auth.AccessSecret = <36 字节 UUID 字面量>（⚠️ **值不贴在本仓**：它就是那把公开密钥）
#   Auth.AccessExpire = 31536000（365 天）
#
# ⚠️ access-secret 必须与**签发方**（user-api）一致：
#   article-api 只验签、不签发 —— Go 侧本服务没有 login / register 端点。
#   验签失败表现为 **HTTP 401 + 空 body**（不是业务码），排查时先看这里。
# ⚠️ access-expire 在本模块**不被读取**：Go 侧同样如此（签发在 user-api）。
#   保留是为了让两边 yaml 可逐行对照。
#
# ⚠️ 36 字节 ≥ 32，jjwt 不需要补齐；JwtUtil.padToHmacKeySize 对它其实是 no-op。
#   统一调用是为了与其它域共用同一份逻辑。
article-api:
  # 🔴 2026-10-29 · G3 阶段 1（P0 #8）：**明文默认值已去掉**
  #    ⇒ 不再有「悄悄用仓里的公开 UUID 起来 ⇒ token 可伪造」这条路径。
  # 🔴 2026-10-29（本轮补）：**「yaml 不给默认值」只挡得住一半** ⇒ 另一半必须由**代码守卫**挡
  #    ⇒ 守卫 = `ArticleApiProperties#verifyAccessSecret()`（@PostConstruct）
  #      ⇒ 下面的 `access-secret: ${USER_JWT_SECRET}` **没有默认值**
  #      ⇒ ⚠️ **单靠 yaml，缺变量时并不会炸**：Spring 的 `@ConfigurationProperties` 绑定器
  #        遇到**解析不出来**的占位符**不报错**，而是把**占位符原文**当成值绑上去
  #        ⇒ ⇒ 应用**照常启动** ⇒ ⇒ 而那是**仓里公开可知的一串字符**
  #        ⇒ ⇒ 🔴 **比空密钥更危险**（HMAC 密钥公开 ⇒ 谁都能伪造 token）。
  #      ⇒ ⚠️ 同理，**变量存在但值为空串**时，Spring 的 PropertyPlaceholderHelper
  #        把**空串当合法值**（不走默认值、也不报错）⇒ 属性绑成 "" ⇒ 空签名密钥 ⇒ token 可伪造。
  #      ⇒ ⇒ 「未解析占位符」与「空串」**两条都**由 `verifyAccessSecret()` 显式拒
  #        ⇒ ⇒ **缺变量 / 空串 / 占位符原文 三条路都 fail-closed**。
  #    ⇒ 回归网：`ArticleApiPropertiesSecretGuardTest#prodLikeStartupWithoutEnvVarFails`
  #      （真 SpringApplication + 真 ConfigData + 只有 application.yml ⇒ 生产等价路径）。
  #    ⚠️ Go 侧写的是**字面量**（article-api.yaml:27）⇒ 本条属「RAG 更严」的一侧 ⇒ 登记为有意偏离。
  #    ⚠️ 根级 compose 需注入 USER_JWT_SECRET（共享面 ⇒ 已登记反馈单 ⇒ 应改 `${USER_JWT_SECRET:?...}`）。
  # 🔴 2026-10-29 · G3 阶段 1（A-1 双侧活体实测）：**`auth:` 这一层不能少** ——
  #    `ArticleApiProperties` 的字段是**嵌套的 `Auth auth`**（`@NestedConfigurationProperty`）
  #    ⇒ 绑定路径必须是 `article-api.auth.access-secret`
  #    ⇒ ⚠️ 上一版（P0 #8 的 commit `45e0af4`）在改 `access-secret` 那一行时**把 `auth:` 整行删掉了**
  #    ⇒ ⇒ yaml 变成 `article-api.access-secret` ⇒ ⇒ **绑定落空** ⇒ `auth.accessSecret` 恒为 null
  #    ⇒ ⇒ `verifyAccessSecret()` **无论环境变量设没设都会抛** ⇒ ⇒ **article-api 永远起不来**。
  #    ⇒ 而当时的 `ArticleApiPropertiesSecretGuardTest` 用的是 `withPropertyValues("article-api.auth.access-secret=…")`
  #    ⇒ ⇒ **它从不读这份 yaml** ⇒ ⇒ 测试全绿而组件起不来（跑绿 ≠ 对）。
  #    ⇒ 回归网：`ArticleApiPropertiesSecretGuardTest#realYamlBindsSecretIntoNestedAuth`（**读真 yaml**）。
  auth:
    access-secret: ${USER_JWT_SECRET}
    access-expire: ${USER_JWT_EXPIRE:31536000}

# =============================================================================
# rag.protection —— Go「请求保护层」四道中间件
# =============================================================================
# ⚠️⚠️ 下面四项在 Go 的 etc/article-api.yaml 里**只出现了 MaxBytes**，
#    另外三项一个字都没写，但它们**是开启的**。照 yaml 逐字段对，永远看不见。
#
# 证据（go-zero v1.10.2）：
#   rest/config.go:52      MaxConns     int   `json:",default=10000"`
#   rest/config.go:53      MaxBytes     int64 `json:",default=1048576"`
#   rest/config.go:56      CpuThreshold int64 `json:",default=900,range=[0:1000)"`
#   rest/config.go:12-22   MiddlewaresConf 九个开关**全部** `json:",default=true"`
#                          （含 MaxConns / Breaker / Shedding / MaxBytes）
#
# ⚠️ **max-bytes 必须显式写成 10485760（10 MiB），不能沿用共享默认值 1048576（1 MiB）**：
#   Go 侧 article-api.yaml 显式写了 `MaxBytes: 10485760`，
#   且 routes.go 第三段又用 `rest.WithMaxBytes(10 * 1024 * 1024)` 声明了一次。
#   go-zero 的 `engine.go:165-171 checkedMaxBytes` 取「route 级 > 0 则用之，否则用 conf 级」，
#   两者同值 ⇒ **全部 7 个端点的 body 上限都是 10 MiB**，不只是 /upload。
#   若这里漏配成 1 MiB，所有写接口会突然开始返回裸 413 —— 一个只在传大正文时才显形的漂移。
#
# ⚠️ 四层的拒绝响应都是**裸状态码 + 空 body + 无 Content-Type**，不走 envelope
#    （Go 侧是裸 w.WriteHeader）。这与本模块「业务错误恒 200 + 信封」的约定**刻意不同**：
#    保护层在到达业务逻辑之前就拒绝了，没有信封可包。
rag:
  http:
    # =============================================================================
    # 🔴 Go 风格 form 值上限闸门（2026-10-25 第十四轮 · global 收口域 · X-6 / DRIFT-HOTAPI-030）
    # =============================================================================
    # Go 出处：go-zero rest/httpx/util.go:15  maxFormParamCount = 2048
    #          （数的是**非空值**；util.go:44-45 空值 continue 不计数）
    #          Go 1.25 net/url/url.go:1001  defaultMaxParams = 10000（数的是**段数**）
    #
    # mode = 本域的 form 超限时应该输出什么形状 —— 依据是「Go 侧该 api 有没有注册
    #        httpx.SetErrorHandler」（逐域取证）：
    #   · raw      ⇒ Go 未注册 SetErrorHandler ⇒ http.Error(w, err.Error(), 400)
    #                ⇒ **400 + text/plain; charset=utf-8 + nosniff + Go 原文**
    #   · envelope ⇒ Go 注册了 SetErrorHandler ⇒ 走业务信封
    #                ⇒ **200 + {"code":5001,"msg":"<该域自己的错误码表文案>","data":null}**
    #
    # ⚠️ 本属性**同时**决定两件事（缺一不可）：
    #   ① service/common 的 GoStyleTomcatParameterLimitCustomizer 把 Tomcat 的
    #      maxParameterCount 抬到 10001（= Go 段数上限 +1）⇒ 否则 Tomcat 会先于应用层拒绝，
    #      且拒绝形状是 400 + HTML 错误页（与 Go 不同）；
    #   ② service/common 的 GoStyleFormValueLimitInterceptor 按 Go 的语义判定。
    #
    # ⚠️ 各域 5001 的文案**不一样**（like/comment =「系统内部错误」，
    #    hot/follow/message = "internal server error"）⇒ 共享层**不硬编码文案**：
    #    envelope 模式下共享层只抛异常，由**本域自己的**兜底 handler 查本域的错误码表渲染。
    #
    # 🔴 favorite 域**故意没有这一项**（= off）⇒ global 对该域零影响：
    #    既不改它的容器上限、也不装闸门 ⇒ 行为逐字节不变。
    #    （favorite 不在 global 的写权范围内，AGENTS.md §5.3c）
    go-form-limit:
      # Go 侧 article/api **没有** httpx.SetErrorHandler ⇒ httpx.Parse 失败走 http.Error(w, err.Error(), 400)
     #    ⇒ **400 + text/plain + nosniff + Go 原文** ⇒ mode: raw
      mode: raw
  protection:
    # Go rest/config.go:52（article-api.yaml 未配 ⇒ 走 default）
    max-conns: 10000
    # ⚠️ Go article-api.yaml: MaxBytes=10485760（10 MiB），**覆盖** tag 默认的 1 MiB
    max-bytes: 10485760
    cpu-shedding:
      # Go rest/config.go:22 Middlewares.Shedding
      enabled: true
      # Go rest/config.go:56（千分比，900 = 90% CPU）
      cpu-threshold: 900
      # Go 读整机 CPU（Linux /proc/stat）⇒ SYSTEM 对齐
      cpu-source: SYSTEM
    breaker:
      # Go rest/config.go:15 Middlewares.Breaker
      enabled: true
    # ⚠️⚠️ **本组件刻意【不配】 `outbound-deadline.cap-millis`**（2026-10-31 · G3 lane 第十三轮）
    #   ⇒ 理由 = **组件级上界表达不了本组件的两个出向方向**（Go 真值不同）：
    #     · article-rpc 方向：Go `service/article/api/etc/article-api.yaml:12`
    #       `ArticleRpcConf.Timeout: 70000`（**显式**）⇒ 70s
    #     · user-rpc   方向：Go 同文件 `:20-24` 的 `UserRpcConf` 段**没有** Timeout
    #       ⇒ 走 zrpc 的 struct tag 默认 `json:",default=2000"` ⇒ 2s
    #   ⇒ ⇒ 共享层的 `cap-millis` 是**组件级一个值**（`@GrpcGlobalClientInterceptor`
    #     ⇒ 装在**每个**出向调用上）⇒ ⇒ 配 2000 会把 article-rpc 方向从 70s **改严 35 倍**；
    #     配 70000 会把 user-rpc 方向从 2s **放宽 35 倍** ⇒ ⇒ **两个值都不对**。
    #   ⇒ ⇒ **2026-10-31 · 合并收口执行者（代 G4 落 per-client 上界 · Jason 授权）**：
    #     共享层已加 `cap-millis-by-service`（**按下游 gRPC 服务全名**覆盖组件级）
    #     ⇒ ⇒ 本组件**改用它**分档（下面那段）⇒ ⇒ **组件级 `cap-millis` 仍然不配**。
    #   ⇒ ⇒ ⚠️ **别在这里补一行 cap-millis: 2000**（那是把一条真漂移"配"进产品）。
    outbound-deadline:
      # ⚠️ **组件级仍然不配**（理由见上）⇒ ⇒ 下面这张表是本组件**唯一**的上界来源。
      cap-millis-by-service:
        # article-rpc 方向 = 70s（Go `ArticleRpcConf.Timeout: 70000`）
        # ⚠️ 键 = **下游 gRPC 服务全名**（proto 的 package.Service）⇒ ⇒ 全局拦截器
        #   在拦截时唯一拿得到的出向标识（`MethodDescriptor#getServiceName()`）
        #   ⇒ ⇒ **域侧零代码改动**（只配参数）⇒ ⇒ 与「域侧只配参数」原则同形。
        article.ArticleService: 70000
        # user-rpc 方向 = 2s（Go `UserRpcConf` 段无 Timeout ⇒ zrpc struct tag 默认 2000）
        # ⚠️ 语义 = **覆盖**组件级（不是 min）⇒ ⇒ 可放宽也可收紧。
        user.UserService: 2000

# =============================================================================
# Metrics / Observability 端点
# =============================================================================
# Go 侧 article/api **没有** metrics 包（实测：全目录无 metrics.go）；
# 其 HTTP 指标由 service/common/observability 的中间件产出（OTel span/metric），
# Java 侧对应 HttpMiddlewareFilter → Micrometer。
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    enabled-by-default: false
  endpoint:
    health:
      enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    enable:
      prometheus: true
    tags:
      application: article-api

# =============================================================================
# OpenTelemetry OTLP exporter（对齐 Go 端 Telemetry.*）
# =============================================================================
# Go: Telemetry.Name=article-api / Endpoint=jaeger:4317 / Batcher=otlpgrpc / Sampler=1.0
otel:
  exporter:
    otlp:
      endpoint: http://${OTEL_ADDR:jaeger}:${OTLP_PORT:4317}
      protocol: grpc
  resource:
    attributes:
      service.name: article-api
  traces:
    sampler: always_on

logging:
  level:
    root: INFO
    com.rag.article.article.api: INFO
    com.rag.common: INFO

# =============================================================================
# observability
# =============================================================================
# ⚠️ 取值 **70s**，不是 go-zero tag 里的 3000ms 默认值：
#   Go article-api.yaml 显式写了 `Timeout: 70000`，而 message-api 侧那条
#   「未配置 ⇒ 回落 3s」的注释**不适用于本模块**。照抄 3s 会让所有 RPC 在
#   70s 预算被砍到 3s —— 一个只在慢下游才显形的漂移。
#   （这正是 AGENTS.md §3.1「不要拿另一个域的实测结论当对照基准」的又一次发作。）
#
# Go: observability.DisableNativeRestTimeout(&c.RestConf) 把 conf.Middlewares.Timeout 置 false，
#     于是超时只有 observability 一个执行者 → http.Error(w, "Request Timeout", 503)。
observability:
  http-timeout: 70s