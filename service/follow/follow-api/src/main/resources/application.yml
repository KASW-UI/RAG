# =============================================================================
# follow-api application.yml —— 对应 Go 端 service/follow/api/etc/followcenter.yaml
# =============================================================================
# 1:1 迁移原则：Go yaml 的每个字段都在这里有对应；Spring / devh starter 用自己的
# 字段名表达同一语义。不新增 Go 侧不存在的开关。
# =============================================================================

spring:
  application:
    # 对应 Go Name: followcenter。⚠️ 与 message-api 不同，Go 侧这里的 Name 是
    # "followcenter"（不是 "follow-api"）；但 Telemetry.Name 是 "follow-api"。
    # 本文件取 Telemetry 的名字作 application.name，与同域其它 api 保持一致。
    name: follow-api

  # ============== 1. Redis（JWT 黑名单）==============
  # Go: BizRedis { Host: redis:6379, Type: node, Pass: "" }
  # ⚠️ 这是 follow-api **唯一**的 Redis 用途（Go 侧 api 层没有缓存，
  #    svc/servicecontext.go:23 建连接只是为了 middleware/checkblacklistmiddleware.go:40 的 ExistsCtx）。
  #    所以这里只配连接串，不配任何 RedisTemplate 定制 —— StringRedisTemplate 默认行为
  #    就是「按 key 查存在性」，与 go-zero 的 ExistsCtx 语义一致。
  # ⚠️ Redis 不可用时**必须 fail-open**（放行），见 FollowBlacklistInterceptor。
  #    Spring Data Redis 默认是懒连接，构造期不会因为 Redis 不在就启动失败 ——
  #    这与 Go 的 redis.MustNewRedis（构造期就 ping）在行为上不同，
  #    但差异只在「Redis 启动即不可达」这一形态下可见（Go 起不来，RAG 起得来但每次查询放行）。
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # ⚠️ 取值出处（2026-10-27 复核补记，此前只有数值没有出处）：
      #   Go 的 followcenter.yaml 完全没配 BizRedis 超时
      #     → go-zero v1.10.2 redisclientmanager.go:32-39 建 red.Options 时不传任何 timeout
      #     → go-redis/v9 options.go init() 默认：ReadTimeout = 3s、DialTimeout = 5s
      #   ⇒ 读命令超时 3s、连接超时 5s，与 go-redis 默认逐字相同。
      #   🔴 go-zero redis.go:27 的 `readWriteTimeout = 2s` 是**死常量**（全文件只在 :293/:315 的
      #      BLPop 用到，ExistsCtx 不用它）⇒ 别被它误导。
      # ⚠️ **本行原为 2s**（无出处、无人审过）⇒ 与 Go 的 3s 不一致 ⇒ 2026-10-27 对齐成 3s。
      #   可观察后果：Redis「连上但挂住」时，黑名单 EXISTS 会挂到 3s ⇒ 与 HTTP 预算(3s) 同刻耗尽
      #   ⇒ **503**，与 Go / user-api 同形（Go 的 CLIENT PAUSE 实测 3.003s）。
      timeout: 3s
      # 连接超时：Go 的 go-redis DialTimeout 默认 **5s**。
      # 🔴 2026-10-27 订正：此处原写「Lettuce 在 connect-timeout 未设时回落到 timeout ⇒ 跟着变成 3s」
      #    ——**那是错的**：Boot 4.0.8 createClientOptions 的字节码是 `if (connectTimeout != null) { … }`
      #    ⇒ null ⇒ 整段跳过 ⇒ 用 Lettuce 自己的默认 **10s**（SocketOptions.DEFAULT_CONNECT_TIMEOUT_DURATION）
      #    ⇒ 不配这行 = 10s（≠ Go 的 5s）；修法与结论不变。详见 DRIFT-FOLLOW-011 订正块。
      # Boot 4 里这是独立属性（DataRedisProperties.connectTimeout，模块 spring-boot-data-redis）。
      connect-timeout: 5s

  # ============== 2. Nacos 服务发现（用于解析 discovery:///follow-rpc）==============
  # Go 端是 etcd flat key "follow.rpc"（无 namespace / group 分层）。
  # Java 端用 Nacos，namespace / group 必须与 follow-rpc 自身一致
  # （follow-rpc/src/main/resources/application.yml:66-67：public / DEFAULT_GROUP），
  # 两端不一致 ⇒ 解析不到 follow-rpc ⇒ 所有业务码塌成 1015（service busy）。
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}

# =============================================================================
# HTTP server
# =============================================================================
# Go: etc/followcenter.yaml 的 Host=0.0.0.0 / Port=8891。
# 这里保持 Go 的 8891（与 message-api 保留 Go 的 8892 是同一条策略）。
server:
  port: ${FOLLOW_API_PORT:8891}
  address: 0.0.0.0
  servlet:
    context-path: /
  # ⚠️ 容器三旋钮：与 Go 对齐（Go 出处 + 实测 ⇒ docs/DRIFT/hot/api.md 的 DRIFT-HOTAPI-021/022/023；
  #    守门 ⇒ tools/difftest/check-tomcat-limits.py）
  #    ① relaxed-query-chars：Go 的 net/http 不校验 query 里的 [ ]，且 go-zero httpx.GetFormValues
  #       明确支持方括号数组记法；Tomcat 默认拒绝 ⇒ 400 + HTML 错误页（不是业务信封）
  #    ② max-parameter-count：Go = go-zero httpx/util.go:15 maxFormParamCount=2048（应用层判）；
  #       Boot 4 默认 1000 ⇒ Tomcat 先拒，RAG 自己实现的 2048 判据在 GET query 上不可达
  #    ③ max-http-request-header-size：Go 的**真实**上限 = DefaultMaxHeaderBytes(1<<20)
  #       + 4096（net/http/server.go:941 `return int64(s.maxHeaderBytes()) + 4096 // bufio slop`）
  #       ⇒ 1 MiB + 4 KiB = **1028KB**；Boot 4 默认 8KB
  tomcat:
    relaxed-query-chars: ["[", "]"]
    max-parameter-count: 2048
  max-http-request-header-size: 1028KB

# =============================================================================
# gRPC client（连 follow-rpc）
# =============================================================================
# Go: FollowRpc.Etcd{ Hosts: [etcd:2379], Key: "follow.rpc" }。
# Java: devh grpc-client-spring-boot-starter + Nacos name resolver。
# ⚠️ negotiation-type 不能省（DRIFT-NEW-014）：devh 的默认值是 TLS，
#   不写会静默发 TLS ClientHello，而 follow-rpc 是明文 gRPC
#   （Go service/follow/rpc/follow.go zrpc.MustNewServer 全仓无 TLS 配置）。
grpc:
  client:
    follow-rpc:
      address: discovery:///follow-rpc
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      permit-keep-alive-without-calls: true
      # 🔴 DRIFT-G1-002（2026-10-27 · G1 lane · 真启动实测）：**启动期拨号检查必须武装**
      #
      # Go 出处（逐层到消费点）：
      #   service/follow/api/internal/svc/servicecontext.go:27
      #       FollowRpc: followservice.NewFollowService(zrpc.MustNewClient(c.FollowRpc)),
      #   go-zero v1.10.2 zrpc/client.go:50-54   logx.Must(err)  ← 失败即 panic ⇒ 进程起不来
      #   go-zero v1.10.2 zrpc/internal/client.go:18 / :122-142
      #       dialTimeout = time.Second * 3
      #       conn, err := grpc.DialContext(timeCtx, server, options...)  // options 含 WithBlock()
      # ⇒ Go 侧启动时**阻塞拨号 3s**，连不上就 panic ⇒ **进程根本起不来**。
      #
      # 本属性对应 devh grpc-client-spring-boot-starter 3.1.0 的
      # AbstractChannelFactory.newManagedChannel → connectOnStartup：
      #   channel.getState(true) → 等 READY → 超时则 throw IllegalStateException(
      #       "Can't connect to channel follow-rpc") ⇒ stub 创建失败 ⇒ 上下文启动失败。
      # ⇒ 与 Go 的 zrpc.MustNewClient 同型：「连不上 ⇒ 起不来」，不是「起来但请求全失败」。
      #
      # ⚠️ **只对 follow-rpc 这一个 channel 开**（不要提到 grpc.client 顶层当全局）：
      #   Go 侧 follow-api 的 ServiceContext 里**只有** FollowRpc 一个下游依赖
      #   （service/follow/api/internal/svc/servicecontext.go:16-30）
      #   ⇒ 设成全局会凭空多出一条 Go 侧不存在的启动期硬依赖。
      #
      # ⚠️ devh 的默认值是 0（= 关闭）⇒ 「yml 里没写」就等于「机制没武装」。
      #   FollowRpcClient.afterPropertiesSet() 会断言本项已武装，删掉这行会让 follow-api
      #   起不来（宁可起不来，也不要静默退化成「Pod Ready 但 100% 请求失败」）。
      immediate-connect-timeout: 3s

# =============================================================================
# 业务配置（对齐 Go 端 UserAuth.*）
# =============================================================================
# Go: etc/followcenter.yaml
#   UserAuth.AccessSecret / AccessExpire = ae0536f9-… / 31536000（365 天）
#
# ⚠️ 密钥必须与<b>签发方</b>一致：followcenter.yaml 与 user-api 的 user 段用的是
#   **同一个** secret（ae0536f9-6450-4606-8e13-5a19ed505da0），
#   所以用户拿 user-api 签发的 token 直接能访问 follow 域。
# ⚠️ follow-api 只验签、不签发：Go 侧本服务没有 login / register 端点。
#   AccessExpire 在本模块不被读取（Go 侧同样没有 logic 读它，签发在别的服务），
#   保留字段是为了让 yaml 与 Go 端 1:1 可对照。
follow-api:
  user-auth:
    access-secret: ${USER_JWT_SECRET:ae0536f9-6450-4606-8e13-5a19ed505da0}
    access-expire: ${USER_JWT_EXPIRE:31536000}

# =============================================================================
# rag.protection —— Go「请求保护层」四道中间件
# =============================================================================
# ⚠️ 下面四项在 Go 的 etc/followcenter.yaml 里 **一个字都没写**，
#    但在 Go 侧 **是开启的**。照 yaml 逐字段对，永远看不见这四层。
#
# 证据（go-zero v1.10.2）：
#   rest/config.go:52      MaxConns     int   `json:",default=10000"`
#   rest/config.go:53      MaxBytes     int64 `json:",default=1048576"`
#   rest/config.go:56      CpuThreshold int64 `json:",default=900,range=[0:1000)"`
#   rest/config.go:12-22   MiddlewaresConf 九个开关 **全部** `json:",default=true"`
#                          （含 MaxConns / Breaker / Shedding / MaxBytes）
#
# ⇒ 「Go yaml 里没写」≠「Go 没开」。这是 AGENTS.md §3.1 的一条延伸：
#   对照基准不能只看数据文件，**框架 tag 里的默认值同样是行为定义**。
#
# ⚠️ 四层的拒绝响应都是 **裸状态码 + 空 body + 无 Content-Type**，不走 envelope
#    （Go 侧是裸 w.WriteHeader，没有 httpx.Error）。这与本模块
#    「所有业务错误恒 200 + envelope」的约定刻意不同：保护层在到达
#    业务逻辑之前就拒绝了，没有 envelope 可包。
#
# ⚠️ 与 Go 的一处表达层差异（已在 GoStyleMaxConnsFilter javadoc 留痕）：
#    Go 的 MaxConns 闸门是 **每路由一个**（engine.go:146 对每条路由各建一次），
#    共享实现取 **全局一个**。
rag:
  http:
    # =============================================================================
    # 🔴 Go 风格 form 值上限闸门（2026-10-25 第十四轮 · global 收口域 · X-6 / DRIFT-HOTAPI-030）
    # =============================================================================
    # Go 出处：go-zero rest/httpx/util.go:15  maxFormParamCount = 2048
    #          （数的是**非空值**；util.go:44-45 空值 continue 不计数）
    #          Go 1.25 net/url/url.go:1001  defaultMaxParams = 10000（数的是**段数**）
    #
    # mode = 本域的 form 超限时应该输出什么形状 —— 依据是「Go 侧该 api 有没有注册
    #        httpx.SetErrorHandler」（逐域取证）：
    #   · raw      ⇒ Go 未注册 SetErrorHandler ⇒ http.Error(w, err.Error(), 400)
    #                ⇒ **400 + text/plain; charset=utf-8 + nosniff + Go 原文**
    #   · envelope ⇒ Go 注册了 SetErrorHandler ⇒ 走业务信封
    #                ⇒ **200 + {"code":5001,"msg":"<该域自己的错误码表文案>","data":null}**
    #
    # ⚠️ 本属性**同时**决定两件事（缺一不可）：
    #   ① service/common 的 GoStyleTomcatParameterLimitCustomizer 把 Tomcat 的
    #      maxParameterCount 抬到 10001（= Go 段数上限 +1）⇒ 否则 Tomcat 会先于应用层拒绝，
    #      且拒绝形状是 400 + HTML 错误页（与 Go 不同）；
    #   ② service/common 的 GoStyleFormValueLimitInterceptor 按 Go 的语义判定。
    #
    # ⚠️ 各域 5001 的文案**不一样**（like/comment =「系统内部错误」，
    #    hot/follow/message = "internal server error"）⇒ 共享层**不硬编码文案**：
    #    envelope 模式下共享层只抛异常，由**本域自己的**兜底 handler 查本域的错误码表渲染。
    #
    # 🔴 favorite 域**故意没有这一项**（= off）⇒ global 对该域零影响：
    #    既不改它的容器上限、也不装闸门 ⇒ 行为逐字节不变。
    #    （favorite 不在 global 的写权范围内，AGENTS.md §5.3c）
    go-form-limit:
      # Go 侧 follow/api/followcenter.go:53 **注册了** httpx.SetErrorHandler ⇒ **200 + 业务信封** ⇒ mode: envelope
      mode: envelope
  protection:
    # Go rest/config.go:52
    max-conns: 10000
    # Go rest/config.go:53（1 MiB）。注意 Go 只看 Content-Length 头，
    # chunked 请求（无 Content-Length）会绕过这层 —— 刻意保留该行为。
    max-bytes: 1048576
    cpu-shedding:
      # Go rest/config.go:22 Middlewares.Shedding
      enabled: true
      # Go rest/config.go:56（千分比，900 = 90% CPU）
      cpu-threshold: 900
      # Go 读整机 CPU（Linux /proc/stat）⇒ SYSTEM 对齐；
      # PROCESS 只看本 JVM，偏离 Go，仅在多副本各自限流时才用。
      cpu-source: SYSTEM
    breaker:
      # Go rest/config.go:15 Middlewares.Breaker
      # ⚠️ 这条同时管住 **HTTP 层**熔断与 **gRPC client** 熔断：
      #    后者由 com.rag.common.protection.GoStyleGrpcClientBreakerInterceptor
      #    承担，它带 @GrpcGlobalClientInterceptor，被扫到即自动注册
      #    （对应 Go zrpc/internal/config.go:14 的 `Breaker bool json:",default=true"`）。
      enabled: true

# =============================================================================
# Metrics
# =============================================================================
# Go 端 internal/metrics/metrics.go 的三个 metric，prometheus 子系统名 = follow_api：
#   follow_api_request_total{route,result}          success / fail
#   follow_api_reject_total{route,reason}           user_id_missing / forbidden_scope
#   follow_api_request_duration_seconds{route}      Histogram(DefBuckets)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    enabled-by-default: false
  endpoint:
    health:
      enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    enable:
      prometheus: true
    # ⚠️ **刻意不加 `tags.application`**（2026-10-24 双侧活体对拍实测修正）。
    #
    # Go 侧是 prometheus.NewCounterVec(CounterOpts{Subsystem: "follow_api"})，
    # 而 Prometheus 导出时 **Subsystem 会直接变成指标名的前缀**
    # ⇒ Go 的指标名本身就是 `follow_api_request_total`。
    # ⇒ RAG 侧的 Micrometer meter 名**也已经带了同一个前缀**
    #   （`follow_api_request_total`），**再挂一个 application="follow-api" tag
    #   就是把名字里已有的信息重复一遍**。
    #
    # ⚠️ 这个 tag 的代价是**实打实的**：多出来的 label 会改变时间序列的身份
    #   ⇒ 抓取侧的 `sum by (le)` / `sum by (route)` 必须写成 `sum by (le, application)`
    #   才能得到与 Go 侧相同的聚合结果 ⇒ 同一份 PromQL 在两侧**结果不同**。
    #   去掉它之后，RAG 侧的 series 与 Go 侧**逐条同名同标签**。
    #
    # ⚠️ 之前那段注释写的是「子系统在 Micrometer 侧对应这个 tag」—— 那是**搞错了**：
    #   Micrometer 没有 subsystem 概念，但本项目**已经用名字前缀**（follow_api_ / follow_rpc_）
    #   承载了子系统语义 ⇒ 不需要也不应该再叠一个 tag。

# =============================================================================
# OpenTelemetry OTLP exporter（对齐 Go 端 Telemetry.*）
# =============================================================================
# Go: Telemetry.Name=follow-api / Endpoint=jaeger:4317 / Batcher=otlpgrpc / Sampler=1.0
otel:
  exporter:
    otlp:
      endpoint: http://${OTEL_ADDR:jaeger}:${OTLP_PORT:4317}
      protocol: grpc
  resource:
    attributes:
      service.name: follow-api
  traces:
    sampler: always_on

logging:
  level:
    root: INFO
    com.rag.follow.follow.api: INFO
    com.rag.common: INFO

# =============================================================================
# observability
# =============================================================================
# 取值依据：Go 侧 etc/followcenter.yaml <b>未配置</b> Timeout，
# 实际生效值来自 go-zero v1.10.2 rest/config.go:55 的 `Timeout int64 json:",default=3000"`。
# DisableNativeRestTimeout 已把 go-zero 原生超时中间件关掉，超时只有 observability 一个执行者。
observability:
  http-timeout: 3s