# =============================================================================
# like-rpc application.yml —— 对应 Go 端两个进程的配置合并
#   P1  service/like/rpc/etc/like.yaml
#   P2  service/like/rpc/internal/mq/etc/mq.yaml
#
# 本服务是**单 JVM**，承载 Go 侧 4 个 main（gRPC / mq / fact-dispatch / fact-authority）。
# 配置项按来源分段标注，1:1 保留 Go 同名字段。
# =============================================================================

spring:
  application:
    # 对应 Go Name: like.rpc（服务发现用）；Telemetry.Name 亦为 like-rpc
    name: like-rpc

  # ============== Postgres ==============
  # 对应 Go Storage.Postgres.DataSource
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:first_db}
    username: ${POSTGRES_USER:admin}
    # 🔴 口令**不加默认值**（2026-10-30 · 与 Go 逐字同形）
    #
    # Go 出处：service/like/rpc/etc/like.yaml:56
    #     DataSource: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@…"
    #   ⇒ 口令是**裸**占位符 `${POSTGRES_PASSWORD}`，**无默认值**。
    # Go 侧加载语义：go-zero@v1.10.2/core/conf/config.go:63
    #     return loader([]byte(os.ExpandEnv(string(content))), v)
    #   ⇒ os.ExpandEnv **不认** `${VAR:default}` ⇒ 缺变量 ⇒ 落成**空串** ⇒ Go = 空口令 = 连库失败。
    #
    # 为什么取消兜底：Spring 的 `${VAR:default}` 会让**缺变量时用默认口令连上去**
    #   ⇒ RAG 比 Go **松** ⇒ 真漂移（不是「更严的有意偏离」）⇒ 不需要为「保留兜底」签字。
    #
    # ⚠️ 残余差异（**失败时刻**不同，由合并收口执行者统一登记为有意偏离候选）：
    #   Go = 启动成功、**连库时**失败；RAG = **启动即失败**（占位符解析不到 ⇒ DataSource bean 创建失败）
    #   ⇒ 属「RAG 更严的一侧」⇒ 按 P0 #8 同款口径登记。
    #
    # ⚠️ 装置侧**不需要**改：tools/difftest/run.sh:196 显式 export POSTGRES_PASSWORD
    #   ＋ 根级 docker-compose.yaml:15 强制要求该变量 ＋ manage.sh 硬校验 .env
    #   ⇒ ⇒ 取消兜底不影响任何对拍装置。
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 对应 Go servicecontext.go:34-35
      #   sqlDB.SetMaxIdleConns(10) / sqlDB.SetMaxOpenConns(100)
      maximum-pool-size: 100
      minimum-idle: 10

  # ============== MyBatis-Plus ==============
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
      default-fetch-size: 100
    global-config:
      db-config:
        # 像 message-rpc 一样：表名 / 主键策略在 Entity 注解上显式钉死
        id-type: ASSIGN_ID
      banner: false

  jpa:
    hibernate:
      ddl-auto: none

  # ============== Flyway ==============
  # ⚠️ **独立账本表名**（2026-10-23，AGENTS.md §6.3 问题 4）。
  #    `flyway_schema_history` 是 **schema 级**账本，一个 schema 只能有一本账。
  #    like-rpc / message-rpc / article-rpc 连同一个 first_db、同一个 public schema，
  #    共用默认账本时后启动者会把自己的迁移判为「已应用」而静默跳过 ——
  #    like 与 message 的 V1-V3 版本号直接撞车且内容不同（like_record vs
  #    message_conversation 等），而 like 自己还有 V4/V5。
  #    改账本表名即可消除病根，**迁移文件名一个字都不用动**。
  #    ⛔ 不要用 validate-on-migrate=false / out-of-order=true 绕道：
  #       已用真 jar + 真 PG 16 实测证伪（会让账本更脏），
  #       见 tools/difftest/exp-drift015-flyway-flags.sh。
  # ⚠️ 上面的声明只保证**配置层**不撞；「Flyway 运行时真的按它建表」
  #    尚未在真 PG 上双模块对启动验证过，按 §3.3 记为 UNKNOWN。
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 🔴 **baseline-version 必须显式钉 0**（2026-10-25 实测修掉的真缺陷 · global 收口域 X-1）
    #
    # 【现象】本模块与其它 rpc 模块**连同一个库**（first_db / rag_db），
    #         各自用**独立的账本表**（flyway_schema_history_like）⇒ **先启动的模块已经把 public schema 弄非空**
    #         ⇒ 本模块启动时 Flyway 看到「非空 schema + 没有自己的账本」
    #         ⇒ 因 baseline-on-migrate=true ⇒ **在 V1 处打 baseline 标记**（默认 baseline-version=1）
    #         ⇒ **V1 的 SQL 从未执行** ⇒ `like_record` 表永远建不出来
    #         ⇒ 后续依赖它的迁移报 `relation "like_record" does not exist` ⇒ **服务起不来**。
    #
    # 【为什么 0 而不是关掉 baseline-on-migrate】
    #         baseline-on-migrate=false 时，非空 schema 且无账本 ⇒ Flyway **直接抛异常退出**
    #         （"Found non-empty schema(s) … but no schema history table"）⇒ 更糟（起不来且无修复路径）。
    #         baseline-version=0 ⇒ baseline 标记打在 version 0 ⇒ **V1 之后全部迁移照常执行**
    #         ⇒ 既能在共享库里安全启动，又不丢任何迁移。
    #
    # 【为什么「全新空库」的测试测不出来】
    #         多数单测用**全新空库** + 只有本模块一个进程 ⇒ schema 是空的 ⇒ baseline 根本不触发
    #         ⇒ V1 正常执行 ⇒ 「测试全绿」与「生产拓扑下起不来」同时成立（§3.3 的经典形态）。
    #         ⇒ 必须显式把 schema 弄成非空 ⇒ 守门见 LikeFlywaySharedSchemaGateTest（真 PG 16 + 真 Flyway 引擎）。
    baseline-version: 0
    locations: classpath:db/migration
    schemas: public
    table: flyway_schema_history_like

  # ============== Redis ==============
  # 对应 Go Storage.Redis（go-zero rest.RedisConf：Host/Type/Pass）
  # ⚠️ Type: node 表示单节点直连，不是集群。Go 侧 go-zero 收到 Type=node 时
  #    走 NewRedis → redis.NewClient（单节点）。Java 端 Lettuce 默认即单节点，
  #    不要配 cluster 相关项，否则会变成 CLUSTER 拓扑解析。
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
      # ⚠️ 连接超时 = 5s，对齐 Go 的 go-redis v9.20.0 默认 `DialTimeout`：
      #    `options.go:338-340` `if opt.DialTimeout == 0 { opt.DialTimeout = 5 * time.Second }`
      #    （真源 go.mod:15 锁的就是 v9.20.0）。
      #    ⚠️ 真源 like-rpc 走 `redis.MustNewRedis(c.Storage.Redis.RedisConf)`，而 go-zero 的
      #    `RedisConf`（`core/stores/redis/conf.go:19-28`）**没有 timeout 字段**
      #    ⇒ 不设 DialTimeout ⇒ 走 go-redis 库默认 5s。
      #    ⚠️ 不配会落 Lettuce 的默认 **10s**（`SocketOptions.DEFAULT_CONNECT_TIMEOUT = 10` 秒）
      #    ⇒ 与 Go 差 2 倍。属性名 = `spring.data.redis.connect-timeout`
      #    （Boot 4 `DataRedisProperties#getConnectTimeout` ⇒
      #    `LettuceConnectionConfiguration:212-215` 写进 `SocketOptions.connectTimeout`）。
      connect-timeout: 5s
      # ⚠️ 连接池 = 与 Go 侧**逐轴**对齐（2026-10-27 G2 · `DRIFT-LIKE-RPC-REDIS-POOL` 数值轴已修）：
      #    Go 侧（真源）走 **go-zero 的 redis** ⇒ `service/like/rpc/internal/svc/servicecontext.go:27`
      #    `redis.MustNewRedis(c.Storage.Redis.RedisConf)` ⇒ go-zero 构造 `red.Options` 时
      #    （`go-zero@v1.10.2/core/stores/redis/redisclientmanager.go:32-40`）只传
      #    `MaxRetries: maxRetries` ＋ **`MinIdleConns: idleConns`** ⇒ 常量 `:14-15`
      #    `maxRetries = 3` · **`idleConns = 8`** ⇒ ⇒ **`MinIdleConns = 8`**（**Go 侧有确切值**）
      #    ⇒ ⇒ `min-idle: 8` = **精确对齐**（🆕 原为 `4` ⇒ 那是**偏离 Go**）
      #    ⇒ `PoolSize` **未设** ⇒ 落 go-redis v9.20.0 库默认 `10 × GOMAXPROCS`
      #      （`go-redis@v9.20.0/options.go:350-351`；本机 10 核 ⇒ 100）⇒ **机器相关、无法逐值对齐**
      #      ⇒ `max-active: 64` 按**数量级**对齐（数值差异属**性能面**，已登记）
      #    ⇒ 「最大空闲连接数」↔ Go 的 `MaxIdleConns`（`go-redis@v9.20.0/options.go:224-228`
      #      **有对应项**、注释写明 `default: 0` ⇒ 消费点 `internal/pool/pool.go:1257`
      #      `if p.cfg.MaxIdleConns == 0 || p.idleConnsLen.Load() < p.cfg.MaxIdleConns`
      #      ⇒ ⇒ **Go 取值 = 0 = 无上限**）⇒ ⇒ 本项 16 ⇒ **比 Go 更严**
      #      （只影响空闲连接的回收时机，**不影响命令结果**）⇒ 属**可登记残留**
      #      ⇒ ⚠️ 原写「Go 侧**无对应项** ⇒ 纯表达层取值」**不准确** ⇒ 2026-10-27 第十八轮订正
      #    ⇒ 「等连接的最长等待」↔ Go 的 `PoolTimeout`（`go-redis@v9.20.0/options.go:380-386`
      #      `if opt.PoolTimeout == 0 { if opt.ReadTimeout > 0 { opt.PoolTimeout = opt.ReadTimeout + time.Second } else { opt.PoolTimeout = 30 * time.Second } }`
      #      ⇒ **本域的 go-zero 不设 `PoolTimeout`、也不设 `ReadTimeout`**
      #      （`go-zero@v1.10.2/core/stores/redis/redisclientmanager.go:32-40` 的 `red.Options` 只有
      #      `Addr/Username/Password/DB/MaxRetries/MinIdleConns/TLSConfig`）⇒ ⇒ 落 go-redis 库默认
      #      `ReadTimeout = 3s` ⇒ ⇒ **Go 侧池耗尽 ⇒ 4s 后失败**
      #      （消费点 `internal/pool/pool.go:1113` `p.semaphore.Acquire(ctx, p.cfg.PoolTimeout, ErrPoolTimeout)`）
      #      ⇒ ⚠️ **不配的后果**：commons-pool2 2.12.1 `BaseObjectPoolConfig:DEFAULT_MAX_WAIT_MILLIS = -1`
      #      ⇒ 消费点 `GenericObjectPool.borrowObject` 的**负值分支走 `takeFirst()`（无参 = 永久阻塞）**
      #      ⇒ ⇒ **无限等** ⇒ 且 Lettuce 的 3s 命令超时**救不了场**（计时器在 `CommandExpiryWriter.write` 才起算，
      #      而**借连接发生在写命令之前**）⇒ ⇒ **比 Go 更糟**（Go 4s 失败 / RAG 无限挂起）
      #      ⇒ 2026-10-27 第十八轮修（守门 = `LikeRpcRedisTimeoutsGateTest` 断言 ⑦）
      #    ⚠️ 池形态的判据**不能只读 yml**：Boot 4 `DataRedisConnectionConfiguration#isPoolEnabled`（`:195-198`）
      #      `enabled != null ? enabled : COMMONS_POOL2_AVAILABLE` ⇒ **classpath 里没有 commons-pool2 ⇒ 池不启用**
      #      ⇒ 本模块 pom **必须显式声明** commons-pool2（Boot 4 的 starter 不再传递它）
      #      ⇒ 缺它 + `enabled: true` ⇒ **启动期 NoClassDefFoundError**（2026-10-23 本域实证）
      lettuce:
        pool:
          enabled: true
          max-active: 64
          max-idle: 16
          min-idle: 8
          max-wait: 4s

  # ============== Kafka ==============
  # 对应 Go KafkaConf（producer）/ mq.yaml 的 Kafka（consumer）
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:kafka:9092}

    # ---------- 消费者 ----------
    consumer:
      # 对应 Go mq.yaml Kafka.Group: like-update-group
      group-id: like-update-group
      # 对应 Go Offset: first —— 从最早开始消费。
      # ⚠️ 2026-10-24 修正错误断言（台账 DRIFT 表的「错误断言 M」，此前声称已清理但**实际漏改**）：
      #    原文写「位点只在处理成功后提交，持久层失败则**不提交**（retry）」—— **与 Go 相反**。
      #    Go 真源：go-queue@v1.2.2/kq/config.go:24 `ForceCommit bool `json:",default=true"``
      #           + service/like/rpc/internal/mq/etc/mq.yaml **未覆盖该字段** ⇒ 生效值 true
      #           ⇒ kq/queue.go:230-242：消费失败后 `if !q.c.ForceCommit { continue }` **不成立**
      #           ⇒ 落到 `CommitMessages` ⇒ **失败也提交位点 ⇒ 该消息永久丢弃、不重投**。
      #    Java 侧等价：`DefaultErrorHandler(recoverer, new FixedBackOff(0, 0))`
      #           ⇒ 第一次失败即 STOP ⇒ `FailedRecordTracker.recovered` 返回 true
      #           ⇒ `SeekUtils.doSeeks` **不 seek** ⇒ 跳过这条、继续处理后续消息 ⇒ 同样丢弃。
      #    ⇒ 两侧语义一致：**失败即丢弃，不重投**（不是「不提交位点 → 重投」）。
      #    ⚠️ 「enable-auto-commit: false」仍要保留：它关的是**容器自动提交**，
      #    位点由 RECORD ack mode 在**成功处理后**提交 —— 失败那条被 ErrorHandler 跳过，
      #    位点在**下一条成功时跨过它**提交 ⇒ 效果同样是「丢弃」，且**不重投**。
      auto-offset-reset: earliest
      # ⚠️ 关掉自动提交，改由容器在 listener 正常返回后提交。
      #    若保留 true，则「容器自动提交位点」这条路径会**绕过** RECORD ack mode 的
      #    「成功后才提交」契约 —— 那才是真的会让「失败 → 重投」成立。
      #    （原文写「kq 的语义是 Consume 返回 error ⇒ 不确认」，**方向写反**：
      #      Go 的 ForceCommit=true 恰恰是「Consume 返回 error **也**确认」。）
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # ⚠️ 2026-10-23 修正：原注释写「Go 的 Push 是同步阻塞写」「选 acks=1 + 异步 + 失败回调日志」，
      #    其中**两点都不成立**：
      #    ① Go 的 kq.NewPusher 默认挂 ChunkExecutor（pusher.go:66-89）⇒ Push 只入队即返回，
      #       写失败发生在 executor 里、走 logx.Error，**不是同步阻塞、也不会回传调用方**；
      #    ② 「失败回调日志」此前在本模块**并不存在**（全模块零 whenComplete/exceptionally），
      #       异步失败连日志都没有。已在 KafkaLikeMsgPublisher / LikeHotEventOutboxRelay 补上 whenComplete。
      #    acks=1 本身保留：它与 Go kafka.Writer 的默认 RequiredAcks(1) 一致。
      acks: 1
      # ⚠️ 未对齐项（有意留档）：Go writer 固定 Balancer=&kafka.LeastBytes{} + Compression=Snappy
      #    （pusher.go:44-49）。Java 侧未配自定义 Partitioner（默认按 key 哈希），
      #    也未配 Snappy 压缩。二者**不改变消息内容与业务结果**（消费端按 group 均衡），
      #    仅影响「消息落在哪个分区 / 网络占用」⇒ 记为 OBSERVABLE，不在本轮对齐。
    listener:
      # RECORD = listener 正常返回后提交位点。这是 drop/retry 契约的实现载体。
      ack-mode: record

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # 🔴 **必须显式关掉自动注册**（2026-10-30 · 补指标抓取载体时落地）。
        #
        # 【为什么】`spring-cloud-starter-alibaba-nacos-discovery` 的**自动注册**
        # （`NacosAutoServiceRegistration`）继承自
        # `org.springframework.cloud.client.serviceregistry.AbstractAutoServiceRegistration`
        # —— 它 `implements ApplicationListener<WebServerInitializedEvent>`
        # ⇒ **注册的是 web 容器端口**（实测 class 字节码：`onApplicationEvent(WebServerInitializedEvent)`）。
        # ⇒ 而本模块的 web 容器（2026-10-30 起为了给 Actuator 载体才引入）
        # 监听的是 **观测端口 9098**，**不是 gRPC 业务端口 8082**。
        # ⇒ 自动注册一旦生效 ⇒ Nacos 里会出现「like-rpc → 9098」这条**错端口**实例
        # ⇒ 调用方按 Nacos 给出的地址连过来 ⇒ 连到一个**只提供 /actuator/** 的 HTTP 端口
        # ⇒ **gRPC 链路直接断**（业务码塌成 1015）。
        #
        # 【本模块的注册是手写的】`bootstrap/NacosRegistration.java` 用
        # `GrpcServerProperties.getPort()`（= gRPC 端口）注册 ⇒ 与 Go 侧
        # `zrpc.MustNewServer` 注册 `ListenOn` 的语义一致。
        # ⇒ 自动注册必须关掉，否则**同一个服务名下会有两个端口的实例**。
        #
        # 同款见 service/follow/follow-rpc/src/main/resources/application.yml:112。
        register-enabled: false

# =============================================================================
# HTTP 观测端口（Actuator 载体）
# =============================================================================
# 🔴 **这是本模块唯一的 HTTP 监听**（2026-10-30 · 指标抓取载体落地）。
#
# 【Go 出处（真源 · 消费点）】
#   service/like/rpc/etc/like.yaml:19-26  DevServer.Port: 9098
#   ⇒ go-zero@v1.10.2/zrpc/config.go:39  `RpcServerConf struct { service.ServiceConf ... }`
#   ⇒ ⇒ go-zero@v1.10.2/zrpc/server.go:63  `if err = c.SetUp(); err != nil {`
#   ⇒ ⇒ go-zero@v1.10.2/core/service/serviceconf.go:77  `devserver.StartAgent(sc.DevServer)`
#   ⇒ ⇒ go-zero@v1.10.2/internal/devserver/server.go:73  **独立端口** `http.ListenAndServe`
# ⇒ ⇒ **Go 的观测端口就是 9098** ⇒ RAG 侧取同一个端口（默认 9098），
#      抓取配置只需改**路径**（Go `/metrics` → RAG `/actuator/prometheus`），
#      **端口一字不差**。
#
# ⚠️ **与 gRPC 业务端口严格分离**：本端口只承载 Actuator（**无任何业务路由**），
#    gRPC 仍是 `grpc.server.port`（8082）。
#    ⇒ 探针/部署可用 LIKE_RPC_MANAGEMENT_PORT 覆盖（并行起时换口）。
#
# ⚠️ **端口冲突登记**：Go 侧 `like-rpc` 的 9098 与 `favorite-rpc` 的 9098 段位相邻、
#    且本仓多个 rpc 的 `grpc.server.port` 都写着 8082 ⇒ 同机部署靠 env 覆盖
#    ⇒ 与 follow-rpc 同款做法。
server:
  port: ${LIKE_RPC_MANAGEMENT_PORT:9098}

# ============== 进程形态标记：rpc 侧（2026-10-30 · 合并收口执行者派工）==============
# 🔴 **本模块是 rpc 形态** ⇒ 观测口上**不许挂 api 侧那套 rest 中间件**
#
# Go 出处（逐字对照）：Go 的 rpc 侧**一个 rest 中间件都没挂** ——
#   service/like/rpc/like.go:41 走 zrpc.MustNewServer(...) ⇒ 全程 **zrpc** 栈
#   ⇒ zrpc 的服务端拦截器链（trace / recover / stat / prometheus / breaker / shedding）
#   是 **gRPC interceptor**，**不是** net/http 的 rest middleware
#   ⇒ Go 的 rpc 进程上**不存在** maxConns / maxBytes / cpuShedding / breaker 这四层 HTTP 保护。
#
# 为什么需要这一行（本模块补 servlet 容器 ⇒ 共享层的 web 侧自动配置会在 rpc 进程**首次激活**）：
#   共享层 service/common/src/main/java/com/rag/common/http/GoStylePathNormalizingAutoConfiguration.java:52
#     与 GoStyleJsonContentTypeAdvice.java:95 都带
#     @ConditionalOnWebApplication(type = SERVLET) ⇒ **只要有 servlet 容器就会注册**。
#   共享层用 `rag.side` 区分形态（见 G4 的共享层落码）：
#     @ConditionalOnProperty(name = "rag.side", havingValue = "api", matchIfMissing = true)
#   ⇒ 默认（matchIfMissing=true）= **api 形态** ⇒ ⇒ **rpc 模块必须显式写 `rag.side: rpc`**，
#     否则观测口上会挂着 Go 侧根本不存在的 rest 中间件。
#
# ⚠️ 本行**不是**「配置里写了就算」：运行期绑定 + 「请求路径上的 api 侧中间件不在容器里」
#   由本模块的 LikeRpcMetricsCarrierGateTest 断言（真 fat jar + 真 /actuator/beans 清单）。
rag:
  side: rpc
  protection:
    outbound-deadline:
      # ==========================================================================
      # 🔴 出向 gRPC 客户端硬上界（P2-T04 · G2 lane · 2026-10-31）
      # Go 出处：go-zero@v1.10.2/zrpc/config.go:31 `Timeout int64 json:",default=2000"`
      #   ⇒ 默认 2000ms；本域 Go 侧 service/like/rpc/etc/like.yaml 的
      #     `MessageRpc:` 段**无显式 Timeout** ⇒ ⇒ 恒 2000ms。
      # ⚠️ 本域**只配参数**：封顶逻辑由共享层 `GoStyleOutboundDeadlineInterceptor`
      #   （`@GrpcGlobalClientInterceptor` ⇒ 装在**每个**出向 devh 调用上）**唯一**承担
      #   ⇒ 域侧不得再造私有副本。**不要**改用空配的 `grpc.client.*.deadline`。
      # env 覆盖：LIKE_RPC_OUTBOUND_DEADLINE_CAP_MILLIS（Go 的 Timeout 也是域级字段）
      cap-millis: ${LIKE_RPC_OUTBOUND_DEADLINE_CAP_MILLIS:2000}

# ============== gRPC server（devh）==============
# 对应 Go ListenOn: 0.0.0.0:8082
grpc:
  server:
    port: ${LIKE_RPC_PORT:8085}
    address: 0.0.0.0
    # Go 侧 reflection 仅在 DevMode/TestMode 注册（like.go:37-39）；
    # Java 侧 devh starter 默认即开启 reflection，此处不额外配置。
  client:
    # 对应 Go MessageRpc.Etcd.Key: message.rpc → 服务发现名 message-rpc
    # ⚠️ **地址必须是三斜杠 `discovery:///message-rpc`**（2026-10-26 真启动实测修正）。
    #    devh 的 `net.devh.boot.grpc.client.nameresolver.DiscoveryClientResolverFactory#newNameResolver`
    #    判定的是 `uri.getPath()`：**必须非空、长度 > 1、且以 "/" 开头**。
    #      discovery:///message-rpc → authority="" 、path="/message-rpc"  ✅
    #      discovery://message-rpc  → authority="message-rpc"、path=""     ❌ 长度 0，直接抛
    #        IllegalArgumentException: Incorrectly formatted target uri;
    #        expected: 'discovery:[//]/<service-name>'; but was 'discovery://message-rpc'
    #    ⇒ 校验发生在任何网络调用之前 ⇒ **与 Nacos 在不在线无关**
    #    ⇒ `grpcClientBeanPostProcessor` 先炸 ⇒ **连 Flyway 都跑不到** ⇒ 真 fat jar 起不来。
    #    ⚠️ 之所以没人发现：**测试把地址覆盖成了 static://127.0.0.1:1**，
    #    生产地址从未被任何测试跑过 ⇒「跑绿」与「能启动」无关。
    #    守门：LikeRpcProductionAddressTest（直接调 devh 真正的消费点）。
    message-rpc:
      address: discovery:///message-rpc
      enable-keep-alive: true
      keep-alive-time: 30s
      negotiation-type: plaintext

# ============== like 服务专属配置 ==============
# 对应 Go Storage.Redis 的三个自定义字段（非 go-zero 原生，Go 侧靠 json:"CacheTTL" 等 tag 读取）
like:
  redis:
    # Go: CacheTTL int `default=3600`（yaml 显式写 3600）
    #     —— GetUserTotalLike 的 SETEX / 命中后的 EXPIRE 用它
    cache-ttl: 3600s
    # Go: HotspotTTL int `default=1800`
    # ⚠️ Go 代码里**没有任何地方读 HotspotTTL**（全量 grep 确认）。
    #    这里保留只为配置面完整，Java 侧同样不读 —— 见 LikeRpcProperties.Redis#hotspotTtl 的注释。
    hotspot-ttl: 1800s
    # 列表类 ZSet 的 TTL —— ⚠️ Go 侧是**硬编码常量**，不在 yaml 里：
    #   getuserlikelistlogic.go:120   Expire(redisKey, 3600*24*7)   // 7 天
    #   gettargetlikerlistlogic.go:128 Expire(redisKey, 86400*7)     // 7 天
    # 两处数值相同。提到 yaml 是为了让「改这个值」必须显式可见，而不是藏在代码魔数里。
    list-ttl: 7d
    # ⚠️ Go 的 RedisExtConf.BatchSize（yaml 写 1000）**无任何读取点**，
    #    因此 Java 侧刻意不映射这个属性 —— 映射了会让人误以为批量上限已生效。

  # ---------- Kafka 主题（对应 Go 各 PusherConf 的 Topic）----------
  kafka:
    # ---------- 主题（对应 Go 各 PusherConf 的 Topic）----------
    # ---------- 消费并发度：Go mq.yaml `Kafka.Consumers: 8` ----------
    # ⚠️ 这条键在本模块**不会**被 `spring.kafka.listener.concurrency` 读取 ——
    #    LikeRpcApplication 自己 new 了 factory 并显式 `setConcurrency(此值)`。
    #    写成 `spring.kafka.listener.concurrency` 会成为无消费点的死配置（§3.3）。
    consumers: 8
    # Go KafkaConf.Topic: like_promotion_topic
    # ★ 同时也是 Go mq.yaml 的消费 Topic（生产与消费同一个 topic）
    like-topic: like_promotion_topic
    # Go KafkaPusher.Topic: like_update_topic —— ⚠️ Go 侧 Config 里虽有 KafkaPusher 字段，
    #    但 servicecontext.go 建的是 c.KafkaConf 的 pusher，**KafkaPusher 这份配置从未被读取**。
    #    Java 侧不实现它，并在 LikeKafkaTopics 里留注释说明。
    # Go TaskUserPusherConf.Topic: task.logs.filtered.User
    task-user-topic: task.logs.filtered.User
    # Go TaskArticlePusherConf.Topic: task.logs.filtered.Article
    task-article-topic: task.logs.filtered.Article
    # Go mq.yaml HotEventPusherConf.Topic: article-hot-events
    hot-event-topic: article-hot-events

    # ---------- 可选 producer 的启用开关 ----------
    # ⚠️ 2026-10-23 拆分：此前是**一个** task-pushers-enabled 管两路（DRIFT-LIKE-012）。
    # Go 侧是两路**各自独立**判空：servicecontext.go:43-44 分别 newOptionalPusher(c.TaskUserPusherConf)
    # / newOptionalPusher(c.TaskArticlePusherConf)，判空条件是 Brokers 或 Topic 任一为空。
    # ⇒ 配置面随之拆成两个键，与两个 KqConf 一一对应。
    task-user-pusher-enabled: true
    task-article-pusher-enabled: true

  # ---------- 事实流派发（P3 fact-dispatch）----------
  # Go cmd/fact-dispatch/main.go 要求同时具备：
  #   LIKE_DATABASE_URL 非空 / DC_PLATFORM_EVENT_URL 非空 / DC_PLATFORM_SERVICE_TOKEN ≥32 字节
  # 任一不满足即 return error → 进程退出。
  # Java 侧是单 JVM 合并进程，不能因为缺 DC 配置就让整个 like-rpc 起不来，
  # 因此改为「默认关闭 + 启动时显式告警」，关闭时该功能完全不参与运行。
  fact:
    dispatch-enabled: false
    # Go: communityfact.NewDCEventSender(endpoint, token, &http.Client{Timeout: 8s})
    dc-endpoint: ${DC_PLATFORM_EVENT_URL:}
    dc-token: ${DC_PLATFORM_SERVICE_TOKEN:}
    dc-timeout: 8s
    # Go cmd/fact-dispatch/main.go:24 的 -once flag（默认 false）：只投递至多一条待发事实
    once: false

  # ---------- 权威读（P4 fact-authority）----------
  # Go cmd/fact-authority/main.go 要求 LIKE_FACT_AUTHORITY_LISTEN / _TOKEN（≥32 字节）。
  # 默认关闭；关闭时不注册任何额外 HTTP 端口。
  authority:
    enabled: false
    token: ${LIKE_FACT_AUTHORITY_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        # ⚠️ **这一族配置在 2026-10-30 之前是死配置**：
        #    `spring-boot-starter-actuator` 只给 endpoint + 自动配置、**不给 servlet 容器**
        #    ⇒ `WebApplicationType=NONE` ⇒ 下面这一族**根本不加载**（**静默无效**）
        #    ⇒ **指标注册了、抓不到**。
        #    ⇒ 2026-10-30 补 `spring-boot-starter-web`（pom 第 7 段）后才真正有载体。
        #
        # ⚠️ **与 Go 的暴露面差异**（twoStage.md §10 定级 · 已登记为残余差异，不修）：
        #    Go  : DevServer 的 `MetricsPath: /metrics` + `HealthPath: /healthz`
        #          （service/like/rpc/etc/like.yaml:23-24）
        #    RAG : `/actuator/prometheus` + `/actuator/health`（Actuator 的固定前缀）
        #    ⇒ **路径不同、端口相同（都是 9098）** ⇒ 抓取配置**改路径不改端口**。
        #    ⇒ 照 follow-rpc 已登记的口径（docs/DRIFT/follow/rpc.md 的「残余差异登记」第 2 条）
        #       ⇒ **不新造一条偏离登记**。
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  # ⚠️ **刻意不加 `tags.application`**（2026-10-30 · 与 Go 对照后移除）。
  #
  # 【为什么原来的 `application: like-rpc` 是错的】
  #   原注释写「与 Go prometheus 子系统名对齐」—— **这句推理不成立**：
  #   指标名的前缀来自 **meter 名**，不是来自这个 tag。
  #   Go 侧 `service/like/rpc/internal/metrics/metrics.go:9-22`
  #     `LikeActionCount` 的 Subsystem 是 **"like-rpc"**（带连字符）、
  #     `LikeQueryCacheCount` 的 Subsystem 是 **"like_rpc"**（下划线）—— **两处拼写不一致**，
  #     是 Go 源码的事实。
  #   ⇒ 且 Go 侧 `service/like/rpc/internal/metrics/metrics.go:24` 的 `InitMetrics()`
  #     **在本仓 Go 侧没有任何调用点**（实测 grep：`service/like/**` 内零命中）
  #     ⇒ Go 的 like-rpc **从不注册**这两个指标 ⇒ Go 的观测口 `/metrics` 上**看不到**它们。
  #   RAG 侧 meter 名已带前缀
  #   （`service/like/like-rpc/src/main/java/com/rag/like/like/rpc/metrics/LikeRpcMetrics.java:53`
  #     = `"like_rpc_action_total"`）
  #   ⇒ 再挂 `application="like-rpc"` ⇒ **多一个 Go 没有的标签**
  #     ⇒ 同一份 PromQL 在两侧**聚合结果不同**。
  #
  # 【先例】follow 域同款已修（`DRIFT-FOLLOW-007`，用户 2026-10-27 拍板）
  #   ⇒ service/follow/follow-rpc/src/main/resources/application.yml:213-224 同款说明。
  #
  # 【本仓无任何消费方】`prometheus/settings.yml` 现有 job 只有 `user-api` / `prometheus`
  #   ⇒ 全仓零处引用 `application="like-rpc"` ⇒ 移除**不影响任何现有抓取配置**。
  prometheus:
    metrics:
      export:
        enabled: true

otel:
  service:
    name: like-rpc
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:jaeger:4317}
  traces:
    exporter: otlp
    sampler: parentbased_always_on

logging:
  level:
    root: INFO
    com.rag: INFO
    io.grpc: WARN

# ===== observability（对齐 Go service/common/observability）=====
# Go like.go:30 observability.DisableNativeRpcTimeout(&c.RpcServerConf)
#            + like.go:41 s.AddUnaryInterceptors(observability.NewUnaryServerInterceptor(...))
# Go yaml 未配 Timeout ⇒ go-zero zrpc/config.go 的 default=2000ms。
observability:
  rpc-timeout: 2s