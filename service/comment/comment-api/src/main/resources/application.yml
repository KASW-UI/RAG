# =============================================================================
# comment-api application.yml —— 对应 Go 端 service/comment/api/etc/commentservice.yaml
# =============================================================================
# 1:1 迁移原则：Go yaml 的每个字段在这里都有对应；Spring / devh starter 用自己的
# 字段名表达同一语义。不新增 Go 侧不存在的开关。
# =============================================================================

spring:
  application:
    name: comment-api

  # ============== Nacos 服务发现（用于解析 discovery:///comment-rpc）==============
  # Go 端是 **直连** zrpc（CommentRpc.Target: 127.0.0.1:9001），无注册中心。
  # Java 端用 Nacos，与 RAG 其余 api 域一致；namespace / group 与 comment-rpc 自身保持一致。
  # ⚠️ 若要退回 Go 的直连形态，把下面 grpc.client.comment-rpc.address 覆盖成
  #   ${COMMENT_RPC_TARGET} 即可，无需改代码（表达层差异，非行为差异）。
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}

# =============================================================================
# HTTP server
# =============================================================================
# Go: etc/commentservice.yaml 的 Host=0.0.0.0 / Port=8888。
server:
  port: ${COMMENT_API_PORT:8888}
  address: 0.0.0.0
  servlet:
    context-path: /
  # ⚠️ 容器三旋钮：与 Go 对齐（Go 出处 + 实测 ⇒ docs/DRIFT/hot/api.md 的 DRIFT-HOTAPI-021/022/023；
  #    守门 ⇒ tools/difftest/check-tomcat-limits.py）
  #    ① relaxed-query-chars：Go 的 net/http 不校验 query 里的 [ ]，且 go-zero httpx.GetFormValues
  #       明确支持方括号数组记法；Tomcat 默认拒绝 ⇒ 400 + HTML 错误页（不是业务信封）
  #    ② max-parameter-count：Go = go-zero httpx/util.go:15 maxFormParamCount=2048（应用层判）；
  #       Boot 4 默认 1000 ⇒ Tomcat 先拒，RAG 自己实现的 2048 判据在 GET query 上不可达
  #    ③ max-http-request-header-size：Go 的**真实**上限 = DefaultMaxHeaderBytes(1<<20)
  #       + 4096（net/http/server.go:941 `return int64(s.maxHeaderBytes()) + 4096 // bufio slop`）
  #       ⇒ 1 MiB + 4 KiB = **1028KB**；Boot 4 默认 8KB
  tomcat:
    relaxed-query-chars: ["[", "]"]
    max-parameter-count: 2048
  max-http-request-header-size: 1028KB

# =============================================================================
# gRPC client（连 comment-rpc）
# =============================================================================
# Go: CommentRpc{ Target: 127.0.0.1:9001, NonBlock: true } —— 直连。
# Java: devh grpc-client-spring-boot-starter + Nacos name resolver。
# ⚠️ negotiation-type 不能省：devh 的默认值是 TLS，不写会静默发 TLS ClientHello，
#   而 comment-rpc 是明文 gRPC（Go zrpc.MustNewServer 全仓无 TLS 配置）。
grpc:
  client:
    comment-rpc:
      address: ${COMMENT_RPC_ADDRESS:discovery:///comment-rpc}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      permit-keep-alive-without-calls: true

# =============================================================================
# 业务配置（对齐 Go 端 UserAuth.*）
# =============================================================================
# Go: etc/commentservice.yaml:5-7
#   UserAuth.AccessSecret = <36 字节 UUID 字面量>（⚠️ **值不贴在本仓**：它就是那把公开密钥）
#   UserAuth.AccessExpire = 31536000（365 天）
#
# ⚠️ 密钥必须与**签发方** user-api 一致，否则验签必失败，
#   失败表现为 HTTP 401 + **空 body**（不是业务码信封），排查时先看这里。
# ⚠️ comment-api 只验签、不签发：Go 侧本服务没有 login / register 端点。
comment-api:
  user-auth:
    # 🔴 2026-10-29 · G3 阶段 1（P0 #8）：**明文默认值已去掉**
    #    ⇒ 不再有「悄悄用仓里的公开 UUID 起来 ⇒ token 可伪造」这条路径。
    # 🔴 2026-10-29（本轮补）：**「yaml 不给默认值」只挡得住一半** ⇒ 另一半必须由**代码守卫**挡
    #    ⇒ 守卫 = `CommentApiProperties#verifyAccessSecret()`（@PostConstruct）
    #      ⇒ 下面的 `access-secret: ${USER_JWT_SECRET}` **没有默认值**
    #      ⇒ ⚠️ **单靠 yaml，缺变量时并不会炸**：Spring 的 `@ConfigurationProperties` 绑定器
    #        遇到**解析不出来**的占位符**不报错**，而是把**占位符原文**当成值绑上去
    #        ⇒ ⇒ 应用**照常启动** ⇒ ⇒ 而那是**仓里公开可知的一串字符**
    #        ⇒ ⇒ 🔴 **比空密钥更危险**（HMAC 密钥公开 ⇒ 谁都能伪造 token）。
    #      ⇒ ⚠️ 同理，**变量存在但值为空串**时，Spring 的 PropertyPlaceholderHelper
    #        把**空串当合法值**（不走默认值、也不报错）⇒ 属性绑成 "" ⇒ 空签名密钥 ⇒ token 可伪造。
    #      ⇒ ⇒ 「未解析占位符」与「空串」**两条都**由 `verifyAccessSecret()` 显式拒
    #        ⇒ ⇒ **缺变量 / 空串 / 占位符原文 三条路都 fail-closed**。
    #    ⇒ 回归网：`CommentApiPropertiesSecretGuardTest#prodLikeStartupWithoutEnvVarFails`
    #      （真 SpringApplication + 真 ConfigData + 只有 application.yml ⇒ 生产等价路径）。
    #    ⚠️ Go 侧写的是**字面量**（commentservice.yaml:6）⇒ 本条属「RAG 更严」的一侧。
    #    ⚠️ 根级 compose 需注入 USER_JWT_SECRET（共享面 ⇒ 已登记反馈单）。
    access-secret: ${USER_JWT_SECRET}
    access-expire: ${USER_JWT_EXPIRE:31536000}
  comment-rpc:
    target: ${COMMENT_RPC_TARGET:127.0.0.1:9001}

# =============================================================================
# rag.protection —— Go「请求保护层」四道中间件
# =============================================================================
# ⚠️ 下面四项在 Go 的 etc/commentservice.yaml 里**一个字都没写**，
#    但在 Go 侧**是开启的**（go-zero v1.10.2 rest/config.go 的 tag 默认值）：
#   MaxConns `json:",default=10000"` / MaxBytes `json:",default=1048576"` /
#   CpuThreshold `json:",default=900,range=[0:1000)"` /
#   MiddlewaresConf 九个开关**全部** `json:",default=true"`（含 Breaker / Shedding）
# ⇒ 「Go yaml 里没写」≠「Go 没开」。这是 AGENTS.md §3.1 的一条延伸：
#   对照基准不能只看数据文件，**框架 tag 里的默认值同样是行为定义**。
# ⚠️ 四层的拒绝响应是裸状态码 + 空 body + 无 Content-Type，不走 envelope。
rag:
  http:
    # =============================================================================
    # 🔴 Go 风格 form 值上限闸门（2026-10-25 第十四轮 · global 收口域 · X-6 / DRIFT-HOTAPI-030）
    # =============================================================================
    # Go 出处：go-zero rest/httpx/util.go:15  maxFormParamCount = 2048
    #          （数的是**非空值**；util.go:44-45 空值 continue 不计数）
    #          Go 1.25 net/url/url.go:1001  defaultMaxParams = 10000（数的是**段数**）
    #
    # mode = 本域的 form 超限时应该输出什么形状 —— 依据是「Go 侧该 api 有没有注册
    #        httpx.SetErrorHandler」（逐域取证）：
    #   · raw      ⇒ Go 未注册 SetErrorHandler ⇒ http.Error(w, err.Error(), 400)
    #                ⇒ **400 + text/plain; charset=utf-8 + nosniff + Go 原文**
    #   · envelope ⇒ Go 注册了 SetErrorHandler ⇒ 走业务信封
    #                ⇒ **200 + {"code":5001,"msg":"<该域自己的错误码表文案>","data":null}**
    #
    # ⚠️ 本属性**同时**决定两件事（缺一不可）：
    #   ① service/common 的 GoStyleTomcatParameterLimitCustomizer 把 Tomcat 的
    #      maxParameterCount 抬到 10001（= Go 段数上限 +1）⇒ 否则 Tomcat 会先于应用层拒绝，
    #      且拒绝形状是 400 + HTML 错误页（与 Go 不同）；
    #   ② service/common 的 GoStyleFormValueLimitInterceptor 按 Go 的语义判定。
    #
    # ⚠️ 各域 5001 的文案**不一样**（like/comment =「系统内部错误」，
    #    hot/follow/message = "internal server error"）⇒ 共享层**不硬编码文案**：
    #    envelope 模式下共享层只抛异常，由**本域自己的**兜底 handler 查本域的错误码表渲染。
    #
    # 🔴 favorite 域**故意没有这一项**（= off）⇒ global 对该域零影响：
    #    既不改它的容器上限、也不装闸门 ⇒ 行为逐字节不变。
    #    （favorite 不在 global 的写权范围内，AGENTS.md §5.3c）
    go-form-limit:
      # Go 侧 comment/api/commentservice.go:47 **注册了** httpx.SetErrorHandler ⇒ **200 + 业务信封**
     #    ⇒ 该域 5001 的文案是「系统内部错误」⇒ mode: envelope
      mode: envelope
  protection:
    max-conns: 10000
    max-bytes: 1048576
    cpu-shedding:
      enabled: true
      cpu-threshold: 900
      cpu-source: SYSTEM
    breaker:
      enabled: true

# =============================================================================
# Metrics
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      enabled-by-default: false
  endpoint:
    health:
      enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    enable:
      prometheus: true
    tags:
      application: comment-api

# =============================================================================
# OpenTelemetry OTLP exporter（对齐 Go 端 Telemetry.*）
# =============================================================================
# Go: Telemetry.Name=comment-api / Endpoint=jaeger:4317 / Sampler=1.0 / Batcher=otlpgrpc
otel:
  exporter:
    otlp:
      endpoint: http://${OTEL_ADDR:jaeger}:${OTLP_PORT:4317}
      protocol: grpc
  resource:
    attributes:
      service.name: comment-api
  traces:
    sampler: always_on

logging:
  level:
    root: INFO
    com.rag.comment.comment.api: INFO
    com.rag.common: INFO

# =============================================================================
# observability
# =============================================================================
# 取值依据：Go 侧 etc/commentservice.yaml **未配置** Timeout，
# 实际生效值来自 go-zero v1.10.2 rest/config.go 的 `Timeout int64 json:",default=3000"`。
observability:
  http-timeout: 3s