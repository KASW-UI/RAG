---
# =============================================================================
# ci/pipelines/rag-contract-schema.yml —— R6 数据库 Schema 契约一致性（Flyway 迁移 vs 语义基准）
#
# 【职责】R6 数据库 Schema 契约一致性（Flyway 迁移 vs 语义基准）。
#
# 【与 11 条日常流水线的关系】
#   日常流水线负责「Java 能不能构建、测试、产出可执行 jar、静态规则过不过」；
#   本条负责「Java 的**契约**有没有漂移」—— 两者判的是不同的事，**不合并**。
#   ⚠️ 独立成一条而不是塞进 11 条：R5/R6 是分钟级 × 多域 ⇒
#     无条件放进日常流水线会把日常 CI 拖到不可接受。
#
# 【不需要 Go】
#   Go 真源是**只读语义参考基准，不是 CI 的执行对象**：
#   契约已一次性离线提取，固化在 ci/contracts/ 下 ⇒
#   本流水线**不拉 Go 仓、不装 Go 工具链、不跑任何 go 命令**。
#
# 【触发面】
#   · service/article/article-rpc/src/main/resources/db/migration/**
#   · service/comment/comment-rpc/src/main/resources/db/migration/**
#   · service/favorite/favorite-rpc/src/main/resources/db/migration/**
#   · service/follow/follow-rpc/src/main/resources/db/migration/**
#   · service/like/like-rpc/src/main/resources/db/migration/**
#   · service/message/message-rpc/src/main/resources/db/migration/**
#   · service/task/task-rpc/src/main/resources/db/migration/**
#   · service/users/users-common/src/main/resources/db/**
#   · ci/contracts/schema/**
#   · pom.xml
#   · service/pom.xml
#   · mvnw
#   · .mvn/**
#   · ci/**
#
# 【生成说明】本文件由 ci/generate-pipelines.py 生成，
#   task 配置内联自 ci/tasks/*.yml（唯一真源）。
# =============================================================================

resources:
- name: repo
  type: git
  source:
    uri: ((git_uri))
    branch: ((git_branch))
    paths:
    - service/article/article-rpc/src/main/resources/db/migration/**
    - service/comment/comment-rpc/src/main/resources/db/migration/**
    - service/favorite/favorite-rpc/src/main/resources/db/migration/**
    - service/follow/follow-rpc/src/main/resources/db/migration/**
    - service/like/like-rpc/src/main/resources/db/migration/**
    - service/message/message-rpc/src/main/resources/db/migration/**
    - service/task/task-rpc/src/main/resources/db/migration/**
    - service/users/users-common/src/main/resources/db/**
    - ci/contracts/schema/**
    - pom.xml
    - service/pom.xml
    - mvnw
    - .mvn/**
    - ci/**

jobs:
- name: contract-check
  plan:
  - get: repo
    trigger: true
  - task: contract-schema
    privileged: true
    config:
      # =============================================================================
      # ci/tasks/contract-schema.yml —— R6 数据库 Schema 契约一致性
      #
      # 【形态】与 maven-test 同形态（DinD：起内层 dockerd → 在内层容器里跑）
      #   ⚠️ 内层镜像用 `python:3.12-bookworm`（**不是** maven 镜像）：
      #     R6 只需要 python3 + Docker API（over unix socket）+ PG 镜像
      #     ⇒ **不需要 Maven / JDK** ⇒ 镜像更小、起步更快。
      #
      # 【为什么独立成一条流水线，而不是塞进 11 条日常流水线】
      #   R6 每个域要起一个 PG 容器 + 重放 Flyway 迁移 + 逐列/索引/约束对拍
      #   ⇒ 分钟级 × 9 域 ⇒ 无条件塞进日常流水线不可接受（任务书 §九.11）。
      #
      # 【不需要什么】
      #   ❌ Go 工具链　❌ Go 仓在线可访问　❌ go 命令　❌ Maven
      #
      # 【退出码】0=PASS / 1=FAIL(契约漂移) / 2=BLOCKED(环境不满足) / 3=NOT_RUN(本域 N/A)
      #   ⚠️ BLOCKED / NOT_RUN 一律不得计入 PASS（ci/contracts/README.md 第四节）。
      platform: linux

      image_resource:
        type: registry-image
        source:
          repository: ((registry))/library/docker
          tag: 27-dind

      inputs:
      - name: repo

      outputs:
      - name: repo
        path: repo


      run:
        path: sh
        args:
        - repo/ci/scripts/dind-run.sh
    params:
      IMAGE: ((registry))/library/python:3.12-bookworm
      REGISTRY: ((registry))
      MAVEN_MIRROR_URL: ((maven_mirror))
      STAGE: contract-schema
