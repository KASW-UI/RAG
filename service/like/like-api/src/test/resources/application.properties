# ─────────────────────────────────────────────────────────────────────────────
# 测试作用域配置（like-api）
# ─────────────────────────────────────────────────────────────────────────────
# 🔴 为什么需要这个文件（2026-10-29 · R1·T-1.3 · P0 #8）：
#   主配置 `src/main/resources/application.yml` 的
#     like-api.user-auth.access-secret: ${USER_JWT_SECRET}
#   **已去掉明文默认值**（原为裸字面量）⇒ ⇒ 变量没设时启动即失败（fail-closed）
#   ⇒ ⇒ 测试必须**自带**密钥，否则整个测试上下文起不来。
#
# ⚠️ 本文件是 **test scope**（只进 target/test-classes）⇒ **不进产物 jar** ⇒
#    生产环境**拿不到**这里的默认值 ⇒ ⇒ 「生产有默认值」这条路被物理堵死。
#
# ⚠️ 为什么这里可以写明文：测试作用域的密钥**不是**生产密钥，
#    且真源 Go 侧本来就是字面量 ⇒ 对拍/单测需要**同一把钥匙**才能验签。
#    （生产密钥的守门是 `tools/difftest/check-no-prod-secrets.py` ⇒ 本文件在豁免清单里。）
#
# ⚠️ 键名写的是**完整属性路径**（不是环境变量名）⇒ 它**直接覆盖**主 yaml 那一行
#    ⇒ 主 yaml 的 `${USER_JWT_SECRET}` 占位符在测试里根本不会被解析
#    ⇒ ⇒ 测试不依赖任何环境变量。
#    （同款写法见 favorite-api / comment-api / article-api 的同名文件。）

