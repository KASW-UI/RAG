# =============================================================================
# like-rpc application.yml —— 对应 Go 端两个进程的配置合并
#   P1  service/like/rpc/etc/like.yaml
#   P2  service/like/rpc/internal/mq/etc/mq.yaml
#
# 本服务是**单 JVM**，承载 Go 侧 4 个 main（gRPC / mq / fact-dispatch / fact-authority）。
# 配置项按来源分段标注，1:1 保留 Go 同名字段。
# =============================================================================

spring:
  application:
    # 对应 Go Name: like.rpc（服务发现用）；Telemetry.Name 亦为 like-rpc
    name: like-rpc

  # ============== Postgres ==============
  # 对应 Go Storage.Postgres.DataSource
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:first_db}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 对应 Go servicecontext.go:34-35
      #   sqlDB.SetMaxIdleConns(10) / sqlDB.SetMaxOpenConns(100)
      maximum-pool-size: 100
      minimum-idle: 10

  # ============== MyBatis-Plus ==============
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
      default-fetch-size: 100
    global-config:
      db-config:
        # 像 message-rpc 一样：表名 / 主键策略在 Entity 注解上显式钉死
        id-type: ASSIGN_ID
      banner: false

  jpa:
    hibernate:
      ddl-auto: none

  # ============== Flyway ==============
  # ⚠️ **独立账本表名**（2026-10-23，AGENTS.md §6.3 问题 4）。
  #    `flyway_schema_history` 是 **schema 级**账本，一个 schema 只能有一本账。
  #    like-rpc / message-rpc / article-rpc 连同一个 first_db、同一个 public schema，
  #    共用默认账本时后启动者会把自己的迁移判为「已应用」而静默跳过 ——
  #    like 与 message 的 V1-V3 版本号直接撞车且内容不同（like_record vs
  #    message_conversation 等），而 like 自己还有 V4/V5。
  #    改账本表名即可消除病根，**迁移文件名一个字都不用动**。
  #    ⛔ 不要用 validate-on-migrate=false / out-of-order=true 绕道：
  #       已用真 jar + 真 PG 16 实测证伪（会让账本更脏），
  #       见 tools/difftest/exp-drift015-flyway-flags.sh。
  # ⚠️ 上面的声明只保证**配置层**不撞；「Flyway 运行时真的按它建表」
  #    尚未在真 PG 上双模块对启动验证过，按 §3.3 记为 UNKNOWN。
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 🔴 **baseline-version 必须显式钉 0**（2026-10-25 实测修掉的真缺陷 · global 收口域 X-1）
    #
    # 【现象】本模块与其它 rpc 模块**连同一个库**（first_db / rag_db），
    #         各自用**独立的账本表**（flyway_schema_history_like）⇒ **先启动的模块已经把 public schema 弄非空**
    #         ⇒ 本模块启动时 Flyway 看到「非空 schema + 没有自己的账本」
    #         ⇒ 因 baseline-on-migrate=true ⇒ **在 V1 处打 baseline 标记**（默认 baseline-version=1）
    #         ⇒ **V1 的 SQL 从未执行** ⇒ `like_record` 表永远建不出来
    #         ⇒ 后续依赖它的迁移报 `relation "like_record" does not exist` ⇒ **服务起不来**。
    #
    # 【为什么 0 而不是关掉 baseline-on-migrate】
    #         baseline-on-migrate=false 时，非空 schema 且无账本 ⇒ Flyway **直接抛异常退出**
    #         （"Found non-empty schema(s) … but no schema history table"）⇒ 更糟（起不来且无修复路径）。
    #         baseline-version=0 ⇒ baseline 标记打在 version 0 ⇒ **V1 之后全部迁移照常执行**
    #         ⇒ 既能在共享库里安全启动，又不丢任何迁移。
    #
    # 【为什么「全新空库」的测试测不出来】
    #         多数单测用**全新空库** + 只有本模块一个进程 ⇒ schema 是空的 ⇒ baseline 根本不触发
    #         ⇒ V1 正常执行 ⇒ 「测试全绿」与「生产拓扑下起不来」同时成立（§3.3 的经典形态）。
    #         ⇒ 必须显式把 schema 弄成非空 ⇒ 守门见 LikeFlywaySharedSchemaGateTest（真 PG 16 + 真 Flyway 引擎）。
    baseline-version: 0
    locations: classpath:db/migration
    schemas: public
    table: flyway_schema_history_like

  # ============== Redis ==============
  # 对应 Go Storage.Redis（go-zero rest.RedisConf：Host/Type/Pass）
  # ⚠️ Type: node 表示单节点直连，不是集群。Go 侧 go-zero 收到 Type=node 时
  #    走 NewRedis → redis.NewClient（单节点）。Java 端 Lettuce 默认即单节点，
  #    不要配 cluster 相关项，否则会变成 CLUSTER 拓扑解析。
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          enabled: true
          max-active: 64
          max-idle: 16
          min-idle: 4

  # ============== Kafka ==============
  # 对应 Go KafkaConf（producer）/ mq.yaml 的 Kafka（consumer）
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:kafka:9092}

    # ---------- 消费者 ----------
    consumer:
      # 对应 Go mq.yaml Kafka.Group: like-update-group
      group-id: like-update-group
      # 对应 Go Offset: first —— 从最早开始消费。
      # ⚠️ 2026-10-24 修正错误断言（台账 DRIFT 表的「错误断言 M」，此前声称已清理但**实际漏改**）：
      #    原文写「位点只在处理成功后提交，持久层失败则**不提交**（retry）」—— **与 Go 相反**。
      #    Go 真源：go-queue@v1.2.2/kq/config.go:24 `ForceCommit bool `json:",default=true"``
      #           + service/like/rpc/internal/mq/etc/mq.yaml **未覆盖该字段** ⇒ 生效值 true
      #           ⇒ kq/queue.go:230-242：消费失败后 `if !q.c.ForceCommit { continue }` **不成立**
      #           ⇒ 落到 `CommitMessages` ⇒ **失败也提交位点 ⇒ 该消息永久丢弃、不重投**。
      #    Java 侧等价：`DefaultErrorHandler(recoverer, new FixedBackOff(0, 0))`
      #           ⇒ 第一次失败即 STOP ⇒ `FailedRecordTracker.recovered` 返回 true
      #           ⇒ `SeekUtils.doSeeks` **不 seek** ⇒ 跳过这条、继续处理后续消息 ⇒ 同样丢弃。
      #    ⇒ 两侧语义一致：**失败即丢弃，不重投**（不是「不提交位点 → 重投」）。
      #    ⚠️ 「enable-auto-commit: false」仍要保留：它关的是**容器自动提交**，
      #    位点由 RECORD ack mode 在**成功处理后**提交 —— 失败那条被 ErrorHandler 跳过，
      #    位点在**下一条成功时跨过它**提交 ⇒ 效果同样是「丢弃」，且**不重投**。
      auto-offset-reset: earliest
      # ⚠️ 关掉自动提交，改由容器在 listener 正常返回后提交。
      #    若保留 true，则「容器自动提交位点」这条路径会**绕过** RECORD ack mode 的
      #    「成功后才提交」契约 —— 那才是真的会让「失败 → 重投」成立。
      #    （原文写「kq 的语义是 Consume 返回 error ⇒ 不确认」，**方向写反**：
      #      Go 的 ForceCommit=true 恰恰是「Consume 返回 error **也**确认」。）
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # ⚠️ 2026-10-23 修正：原注释写「Go 的 Push 是同步阻塞写」「选 acks=1 + 异步 + 失败回调日志」，
      #    其中**两点都不成立**：
      #    ① Go 的 kq.NewPusher 默认挂 ChunkExecutor（pusher.go:66-89）⇒ Push 只入队即返回，
      #       写失败发生在 executor 里、走 logx.Error，**不是同步阻塞、也不会回传调用方**；
      #    ② 「失败回调日志」此前在本模块**并不存在**（全模块零 whenComplete/exceptionally），
      #       异步失败连日志都没有。已在 KafkaLikeMsgPublisher / LikeHotEventOutboxRelay 补上 whenComplete。
      #    acks=1 本身保留：它与 Go kafka.Writer 的默认 RequiredAcks(1) 一致。
      acks: 1
      # ⚠️ 未对齐项（有意留档）：Go writer 固定 Balancer=&kafka.LeastBytes{} + Compression=Snappy
      #    （pusher.go:44-49）。Java 侧未配自定义 Partitioner（默认按 key 哈希），
      #    也未配 Snappy 压缩。二者**不改变消息内容与业务结果**（消费端按 group 均衡），
      #    仅影响「消息落在哪个分区 / 网络占用」⇒ 记为 OBSERVABLE，不在本轮对齐。
    listener:
      # RECORD = listener 正常返回后提交位点。这是 drop/retry 契约的实现载体。
      ack-mode: record

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

# ============== gRPC server（devh）==============
# 对应 Go ListenOn: 0.0.0.0:8082
grpc:
  server:
    port: 8082
    address: 0.0.0.0
    # Go 侧 reflection 仅在 DevMode/TestMode 注册（like.go:37-39）；
    # Java 侧 devh starter 默认即开启 reflection，此处不额外配置。
  client:
    # 对应 Go MessageRpc.Etcd.Key: message.rpc → 服务发现名 message-rpc
    message-rpc:
      address: discovery://message-rpc
      enable-keep-alive: true
      keep-alive-time: 30s
      negotiation-type: plaintext

# ============== like 服务专属配置 ==============
# 对应 Go Storage.Redis 的三个自定义字段（非 go-zero 原生，Go 侧靠 json:"CacheTTL" 等 tag 读取）
like:
  redis:
    # Go: CacheTTL int `default=3600`（yaml 显式写 3600）
    #     —— GetUserTotalLike 的 SETEX / 命中后的 EXPIRE 用它
    cache-ttl: 3600s
    # Go: HotspotTTL int `default=1800`
    # ⚠️ Go 代码里**没有任何地方读 HotspotTTL**（全量 grep 确认）。
    #    这里保留只为配置面完整，Java 侧同样不读 —— 见 LikeRpcProperties.Redis#hotspotTtl 的注释。
    hotspot-ttl: 1800s
    # 列表类 ZSet 的 TTL —— ⚠️ Go 侧是**硬编码常量**，不在 yaml 里：
    #   getuserlikelistlogic.go:120   Expire(redisKey, 3600*24*7)   // 7 天
    #   gettargetlikerlistlogic.go:128 Expire(redisKey, 86400*7)     // 7 天
    # 两处数值相同。提到 yaml 是为了让「改这个值」必须显式可见，而不是藏在代码魔数里。
    list-ttl: 7d
    # ⚠️ Go 的 RedisExtConf.BatchSize（yaml 写 1000）**无任何读取点**，
    #    因此 Java 侧刻意不映射这个属性 —— 映射了会让人误以为批量上限已生效。

  # ---------- Kafka 主题（对应 Go 各 PusherConf 的 Topic）----------
  kafka:
    # ---------- 主题（对应 Go 各 PusherConf 的 Topic）----------
    # ---------- 消费并发度：Go mq.yaml `Kafka.Consumers: 8` ----------
    # ⚠️ 这条键在本模块**不会**被 `spring.kafka.listener.concurrency` 读取 ——
    #    LikeRpcApplication 自己 new 了 factory 并显式 `setConcurrency(此值)`。
    #    写成 `spring.kafka.listener.concurrency` 会成为无消费点的死配置（§3.3）。
    consumers: 8
    # Go KafkaConf.Topic: like_promotion_topic
    # ★ 同时也是 Go mq.yaml 的消费 Topic（生产与消费同一个 topic）
    like-topic: like_promotion_topic
    # Go KafkaPusher.Topic: like_update_topic —— ⚠️ Go 侧 Config 里虽有 KafkaPusher 字段，
    #    但 servicecontext.go 建的是 c.KafkaConf 的 pusher，**KafkaPusher 这份配置从未被读取**。
    #    Java 侧不实现它，并在 LikeKafkaTopics 里留注释说明。
    # Go TaskUserPusherConf.Topic: task.logs.filtered.User
    task-user-topic: task.logs.filtered.User
    # Go TaskArticlePusherConf.Topic: task.logs.filtered.Article
    task-article-topic: task.logs.filtered.Article
    # Go mq.yaml HotEventPusherConf.Topic: article-hot-events
    hot-event-topic: article-hot-events

    # ---------- 可选 producer 的启用开关 ----------
    # ⚠️ 2026-10-23 拆分：此前是**一个** task-pushers-enabled 管两路（DRIFT-LIKE-012）。
    # Go 侧是两路**各自独立**判空：servicecontext.go:43-44 分别 newOptionalPusher(c.TaskUserPusherConf)
    # / newOptionalPusher(c.TaskArticlePusherConf)，判空条件是 Brokers 或 Topic 任一为空。
    # ⇒ 配置面随之拆成两个键，与两个 KqConf 一一对应。
    task-user-pusher-enabled: true
    task-article-pusher-enabled: true

  # ---------- 事实流派发（P3 fact-dispatch）----------
  # Go cmd/fact-dispatch/main.go 要求同时具备：
  #   LIKE_DATABASE_URL 非空 / DC_PLATFORM_EVENT_URL 非空 / DC_PLATFORM_SERVICE_TOKEN ≥32 字节
  # 任一不满足即 return error → 进程退出。
  # Java 侧是单 JVM 合并进程，不能因为缺 DC 配置就让整个 like-rpc 起不来，
  # 因此改为「默认关闭 + 启动时显式告警」，关闭时该功能完全不参与运行。
  fact:
    dispatch-enabled: false
    # Go: communityfact.NewDCEventSender(endpoint, token, &http.Client{Timeout: 8s})
    dc-endpoint: ${DC_PLATFORM_EVENT_URL:}
    dc-token: ${DC_PLATFORM_SERVICE_TOKEN:}
    dc-timeout: 8s

  # ---------- 权威读（P4 fact-authority）----------
  # Go cmd/fact-authority/main.go 要求 LIKE_FACT_AUTHORITY_LISTEN / _TOKEN（≥32 字节）。
  # 默认关闭；关闭时不注册任何额外 HTTP 端口。
  authority:
    enabled: false
    token: ${LIKE_FACT_AUTHORITY_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      # 与 Go prometheus 子系统名对齐（Go 侧 LikeActionCount 的 Subsystem 是 "like-rpc"，
      # LikeQueryCacheCount 的是 "like_rpc" —— 两处拼写不一致，是 Go 源码的事实，此处保留）
      application: like-rpc
  prometheus:
    metrics:
      export:
        enabled: true

otel:
  service:
    name: like-rpc
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:jaeger:4317}
  traces:
    exporter: otlp
    sampler: parentbased_always_on

logging:
  level:
    root: INFO
    com.rag: INFO
    io.grpc: WARN

# ===== observability（对齐 Go service/common/observability）=====
# Go like.go:30 observability.DisableNativeRpcTimeout(&c.RpcServerConf)
#            + like.go:41 s.AddUnaryInterceptors(observability.NewUnaryServerInterceptor(...))
# Go yaml 未配 Timeout ⇒ go-zero zrpc/config.go 的 default=2000ms。
observability:
  rpc-timeout: 2s