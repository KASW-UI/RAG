# =============================================================================
# favorite-rpc application.yml —— 对应 Go 端两个配置源的合并：
#   P1  service/favorite/rpc/etc/favorite.yaml      （gRPC server + Postgres + Etcd + UserRpc/ArticleRpc）
#   P2/P3/P4  service/favorite/rpc/cmd/*/main.go    （三个独立进程的环境变量）
#
# 本服务是**单 JVM**，承载 Go 侧 4 个 main（gRPC / fact-dispatch / fact-authority /
# legacy-preflight）。合并依据见 docs/FileTree/favorite/rpc.md §12.1「四个 Go main → 1 个 Spring Boot JVM」。
#
# ★ favorite 域**零 Kafka、零 Redis**（Go 侧 rpc/internal/ 下没有 mq/ 目录，
#   ServiceContext 也没有任何 Redis 字段）⇒ pom 不引 spring-kafka / spring-boot-kafka /
#   spring-boot-starter-data-redis，也不配相关连接。
# =============================================================================

spring:
  application:
    # 对应 Go Name: favorite.rpc（服务发现用）；Telemetry.Name 亦为 favorite-rpc
    name: favorite-rpc

  # ============== main ==============
  # ⚠️ **2026-10-30：原先这里的 `web-application-type: none` 已被删除**（本轮补 Actuator 载体）。
  #
  # 【为什么原先要写它】—— 2026-10-26 第十七轮实测：真 fat jar 用**生产 yaml 原样**起 ⇒ 直接死：
  #   APPLICATION FAILED TO START
  #   Description: Web application could not be started as there was no
  #     org.springframework.boot.web.server.servlet.ServletWebServerFactory bean defined
  #     in the context.
  #   根因：classpath 上有 jakarta.servlet（pom 里为编译期引用
  #   `jakarta.servlet.http.HttpServlet/Request/Response` 而显式声明了
  #   `jakarta.servlet:jakarta.servlet-api`）⇒ Spring Boot 的
  #   `WebApplicationType.deduceFromClasspath()` 判定为 **SERVLET**
  #   ⇒ 而本服务**没有** servlet 容器（没有 tomcat）⇒ 找不到 ServletWebServerFactory。
  #   ⇒ 「把 web 类型钉成 NONE」是当时的**缓解手段**（不是修复）。
  #
  # 【为什么现在可以删】—— 2026-10-30 本轮：pom 补了 `spring-boot-starter-web`
  #   ⇒ **容器有了** ⇒ 启动期不再缺 `ServletWebServerFactory`
  #   ⇒ 而 `web-application-type: none` 会**把刚补上的载体再关掉**
  #   ⇒ ⇒ 删掉它，载体才真正有出口（这是本轮「补指标抓取载体」的前提）。
  #
  # 【Go 侧的对应面（不要误读成「多了一个业务功能」）】
  #   Go 侧 favorite-rpc 的 gRPC 端口是 8082（etc/favorite.yaml:2 ListenOn: 0.0.0.0:8082），
  #   另有 go-zero 内置的 DevServer（etc/favorite.yaml:23-30 → 0.0.0.0:16062 的
  #   /metrics / /healthz / /debug/pprof/*）—— 那是 **go-zero 自带的 HTTP server，
  #   不依赖 servlet 容器**。
  #   ⇒ RAG 侧本轮补上载体 ⇒ **16062 那个面对上了**（原先缺它 = 域内未决项 U9）
  #   ⇒ 但**载体不同**（Tomcat vs go-zero devserver）⇒ 属「暴露形态差异」，按 twoStage.md §10 登记
  #   ⇒ 且**路径不同**：Go `/metrics` ↔ RAG `/actuator/prometheus`（Actuator 的固定前缀）。

  # ============== Postgres ==============
  # 对应 Go internal/config/config.go:7-14 的 Postgres{Host,Port,User,Password,DBName,Mode}
  #   etc/favorite.yaml:9-15 → postgres:5432 / admin / first_db / sslmode=disable
  datasource:
    # ⚠️ 参数里必须带 TimeZone=Asia/Shanghai：Go 侧 db.go:21-28 的 DSN 显式写了它。
    #   这不是随手加的—— favorite_item.create_time / favorite_folder.create_time|update_time
    #   都是 timestamptz，Go 写、两侧按 UnixMilli() 读出（helper.go:69,83）。
    #   时区配错会让 create_time / updated_at 整体平移 ⇒ **直接改变 L1 返回值**。
    #   与 users 域「TIMESTAMP⇒TIMESTAMPTZ」（AGENTS.md §0 users 行）是同一时区风险面。
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:first_db}?TimeZone=Asia/Shanghai
    username: ${POSTGRES_USER:admin}
    # 🔴 **口令占位符必须是「裸」写法**（2026-10-30 · 合并收口执行者派工 · 与 Go **逐字同形**）
    #   【Go 出处】service/favorite/rpc/etc/favorite.yaml:13
    #   【Go 的展开语义】go-zero 的加载 = `core/conf/config.go:63`
    #       `loader([]byte(os.ExpandEnv(string(content))), v)` ⇒ ⇒ **`os.ExpandEnv` 不认
    #       `${VAR:default}` 语法** ⇒ 缺变量时它把**整串当变量名**去查 ⇒ ⇒ **空串**
    #       ⇒ ⇒ Go 侧缺 `POSTGRES_PASSWORD` = **空口令** ⇒ 连库失败 = fail-fast
    #   【为什么取消原先的兜底】原先这里是 `${POSTGRES_PASSWORD:password}` ⇒ 走 **Spring 的
    #       `:default` 语义** ⇒ **缺变量时会用那个默认值连上去** ⇒ ⇒ **RAG 比 Go 松**
    #       （Go 必然失败、RAG 照样起）⇒ ⇒ 属**真漂移**，**不是**「更严的有意偏离」
    #       ⇒ ⇒ 不需要为「保留兜底」签字 ⇒ ⇒ 本轮取消。
    #   ⚠️ **残余差异（失败时刻不同）**：Go = **启动成功、连库时**失败；
    #      RAG = **启动即失败**（Spring 解析不到占位符 ⇒ DataSource bean 创建失败）
    #      ⇒ ⇒ 属「**RAG 更严**的一侧」⇒ ⇒ 由**合并收口执行者**在合并窗口统一登记
    #      ⇒ ⇒ **不是**「保留兜底」的理由。
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 对应 Go：sqlDB 未显式设置 ⇒ 用 database/sql 默认值（MaxIdleConns=2, MaxOpenConns=0=无上限）。
      # 这里给显式上限，避免 N 副本下把 PG 连接打满；属容量参数，非行为契约。
      maximum-pool-size: 100
      minimum-idle: 10

  # ============== MyBatis-Plus ==============
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
    global-config:
      db-config:
        # 表名 / 主键策略在 Entity 注解上显式钉死（favorite 的代理键 id 是 GORM 自增，
        # 业务 ID 是 folder_id / favorite_id / event_id，三者不能混）
        id-type: ASSIGN_ID
      banner: false

  jpa:
    hibernate:
      ddl-auto: none

  # ============== Flyway ==============
  # ⚠️ **独立账本表名**（AGENTS.md §6.3 问题 4，2026-10-23 用户拍板）。
  #   `flyway_schema_history` 是 **schema 级**账本，一个 schema 只能有一本账。
  #   favorite-rpc / message-rpc / like-rpc / article-rpc 连同一个 first_db、同一个 public schema，
  #   共用默认账本时后启动者会把自己的迁移判为「已应用」而静默跳过 ——
  #   favorite 的 V1-V3 与 message / like / article 的 V1-V3 版本号直接撞车且内容不同。
  #   改账本表名即可消除病根，**迁移文件名一个字都不用动**。
  # ⛔ 不要用 validate-on-migrate=false / out-of-order=true 绕道（已用真 jar + 真 PG 实测证伪）。
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 🔴 **baseline-version 必须显式钉 0**（2026-10-27 G3 域侧自修 · 与 comment/like/task/follow/message 同款）
    #
    # 【现象】本模块与其它 rpc 模块**连同一个库**（first_db / rag_db），
    #         各自用**独立的账本表**（本模块 = flyway_schema_history_favorite）
    #         ⇒ **先启动的模块已经把 public schema 弄非空**
    #         ⇒ 本模块启动时 Flyway 看到「非空 schema + 没有自己的账本」
    #         ⇒ 因 baseline-on-migrate=true ⇒ **在 V1 处打 baseline 标记**（默认 baseline-version=1）
    #         ⇒ **V1 的 SQL 从未执行** ⇒ `favorite_folder` 表永远建不出来
    #         ⇒ 后续依赖它的迁移报 `relation "favorite_folder" does not exist` ⇒ **服务起不来**。
    #
    # 【为什么 0 而不是关掉 baseline-on-migrate】
    #         baseline-on-migrate=false 时，非空 schema 且无账本 ⇒ Flyway **直接抛异常退出**
    #         （"Found non-empty schema(s) … but no schema history table"）⇒ 更糟（起不来且无修复路径）。
    #         baseline-version=0 ⇒ baseline 标记打在 version 0 ⇒ **V1 之后全部迁移照常执行**
    #         ⇒ 既能在共享库里安全启动，又不丢任何迁移。
    #
    # 【为什么「全新空库」的测试测不出来】
    #         多数单测用**全新空库** + 只有本模块一个进程 ⇒ schema 是空的 ⇒ baseline 根本不触发
    #         ⇒ V1 正常执行 ⇒ 「测试全绿」与「生产拓扑下起不来」同时成立（§3.3 的经典形态）。
    baseline-version: 0
    locations: classpath:db/migration
    schemas: public
    table: flyway_schema_history_favorite

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # 🔴 **必须显式关掉自动注册**（2026-10-30 · 补 Actuator 载体时**实测**补上）。
        #
        # 【为什么】`spring-cloud-starter-alibaba-nacos-discovery` 的**自动注册**
        # （NacosAutoServiceRegistration）注册的是 **web 容器端口** ——
        # 而本模块的 web 容器（2026-10-30 起为了给 Actuator 载体才引入）
        # 监听的是 **观测端口 16062**，**不是 gRPC 业务端口 8082**。
        # ⇒ 自动注册一旦生效 ⇒ Nacos 里会出现「favorite-rpc → 16062」这条**错端口**实例
        # ⇒ favorite-api 按 Nacos 给出的地址连过来 ⇒ 连到一个**只提供 /actuator/** 的 HTTP 端口
        # ⇒ **gRPC 链路直接断**（业务码塌成 1015）。
        # ⇒ 而且实测更狠：Nacos 不可达时自动注册**抛异常**（`failFast=true`）
        #   ⇒ 直接把**启动**打断（`Failed to start bean 'webServerStartStop'`）⇒ **进程起不来**。
        #
        # 【本模块的注册是手写的】`bootstrap/FavoriteNacosRegistration.java` 用
        # `GrpcServerProperties.getPort()`（= gRPC 端口 8082）注册 ⇒ 与 Go 侧
        # `zrpc.MustNewServer` 注册 `ListenOn` 的语义一致。
        # ⇒ 自动注册必须关掉，否则**同一个服务名下会有两个端口的实例**。
        register-enabled: false

# =============================================================================
# 观测端口（Actuator 的 servlet 载体）
# =============================================================================
# 对应 Go service/favorite/rpc/etc/favorite.yaml:23-30
#     DevServer: {Enabled: true, Host: 0.0.0.0, Port: 16062,
#                 MetricsPath: /metrics, HealthPath: /healthz,
#                 EnableMetrics: true, EnablePprof: true}
# ⇒ go-zero@v1.10.2/zrpc/config.go:39   RpcServerConf **内嵌** service.ServiceConf
# ⇒ go-zero@v1.10.2/core/service/serviceconf.go:40   ServiceConf.DevServer 字段
# ⇒ ⇒ **消费点** go-zero@v1.10.2/zrpc/server.go:63  `c.SetUp()`
#      ⇒ ⇒ core/service/serviceconf.go:77  `devserver.StartAgent(sc.DevServer)`
#      ⇒ ⇒ internal/devserver/server.go:79-82 `if !c.Enabled { return }`
#      ⇒ ⇒ internal/devserver/server.go:42 HealthPath / :48 MetricsPath / :53-57 pprof
#      ⇒ ⇒ internal/devserver/server.go:70-73 **独立端口** `http.ListenAndServe(addr, s.server)`
# ⇒ ⇒ Go 侧 favorite-rpc **真的**在 0.0.0.0:16062 起了一个 HTTP 服务
#
# ⚠️ **端口一字不差**（16062）⇒ 抓取配置只需改**路径**
#    （Go `/metrics` → RAG `/actuator/prometheus`，Actuator 的固定前缀）
#
# ⚠️ **与 gRPC 业务端口严格分离**：本端口只承载 Actuator（**无任何业务 HTTP 路由**），
#    gRPC 仍是 `grpc.server.port`（8082）。
#    ⇒ 探针/部署可用 FAVORITE_RPC_MANAGEMENT_PORT 覆盖（探针会自动挑空闲端口）。
server:
  port: ${FAVORITE_RPC_MANAGEMENT_PORT:16062}

# =============================================================================
# 角色标记：rpc 侧（**不是** api 侧）
# =============================================================================
# 🔴 **这一行是「共享层 api 侧 web 能力的边界声明」**（2026-10-30 · 合并收口执行者要求）
#
# 【为什么必须写】—— 共享层那批 **api 侧**的 web 能力（`GoStyleCpuSheddingFilter` ·
#   `GoStyleMaxConnsFilter` · `GoStyleMaxBytesFilter` · `GoStyleBreakerFilter` +
#   `GoStyleTomcatParameterLimitCustomizer` 等）是**按 `rag.side` 分边**的
#   ⇒ G4 侧把门扩成 `@ConditionalOnProperty(prefix="rag", name="side", havingValue="api",
#   matchIfMissing=true)` ⇒ ⇒ **不写这一行 = 默认落在 api 侧** ⇒ ⇒ 那些 Bean 会照常活。
#
# 【为什么 rpc 侧必须落在 rpc 侧】—— Go 侧 rpc **一个 rest 中间件都没挂**
#   （全部走 `zrpc.MustNewServer` ⇒ 不起 servlet 容器 ⇒ 没有 filter 链）
#   ⇒ ⇒ 观测端口上**不该**挂着 Go 侧不存在的中间件 ⇒ 其中 **CPU 降载会拒请求**
#   ⇒ ⇒ 直接威胁「载体存在的目的」（抓取请求被拒 ⇒ 载体装了但抓不到）。
#
# ⚠️ **当前状态（2026-10-30 实测 · 如实标注）**：
#   共享层**当前还没有**消费 `rag.side` 的条件（`grep -rn "rag.side" service/common/src/main/java/`
#   **零命中**）⇒ ⇒ **这一行现在还没有消费点** ⇒ ⇒ 它是**为 G4 正在扩的那道门预留的对侧**。
#   ⇒ ⇒ 门落地前，它**不生效**；落地后，它**必须**已经在位（否则 rpc 域会挂上 api 侧的中间件）。
#   ⇒ ⇒ 域侧的运行期断言见本域的 `*RpcSharedLayerWebBeanGateTest`（它断言「那些 Bean 不在容器里」）。

rag:
  # 🔴 **必须显式写 `rpc`**（2026-10-30 · 合并收口执行者要求）—— 见上方注释：
  #   `matchIfMissing=true` ⇒ **不写 = 默认 api 侧** ⇒ 共享层的 api 侧 web Bean 会挂上来。
  side: rpc

# ============== gRPC server（devh）==============
# 对应 Go etc/favorite.yaml:2  ListenOn: 0.0.0.0:8082
grpc:
  server:
    port: 8082
    address: 0.0.0.0
    # 🔴 reflection **必须显式关掉**（2026-10-26 第十七轮核对时发现本域**漏配**）。
    #
    # Go 出处（service/favorite/rpc/favorite.go:45-47）：
    #     if c.Mode == service.DevMode || c.Mode == service.TestMode { reflection.Register(grpcServer) }
    # 消费点判定：Config 内嵌 zrpc.RpcServerConf → service.ServiceConf，
    #   其 Mode 字段带 `json:",default=pro,options=dev|test|rt|pre|pro"`
    #   （go-zero@v1.10.2 core/service/serviceconf.go:35），
    #   而 etc/favorite.yaml **没有配顶层 Mode** ⇒ 取默认值 "pro"
    #   ⇒ **分支不成立 ⇒ 真源生产形态不暴露 reflection**。
    #
    # devh 侧默认是**开着**的：
    #   GrpcServerProperties.reflectionServiceEnabled 默认 true；
    #   GrpcReflectionServiceAutoConfiguration 上是
    #   `@ConditionalOnProperty(prefix="grpc.server", name="reflection-service-enabled", matchIfMissing=true)`
    #   ⇒ **不写这一行 = 开着** ⇒ RAG 会比真源多暴露一整个反射面
    #   （`grpcurl -plaintext <host>:8082 list` 能列出全部方法并下载 proto 描述符）。
    #
    # ⇒ 与 user-rpc / admin-rpc / message-rpc / hot-rpc **同款显式关闭**；
    #   本模块不配 DevMode/TestMode 切换（Go 侧也没有对应配置项），
    #   因此生产等价物就是关掉；需要本地调试时用环境变量覆盖为 true。
    reflection-service-enabled: false
    # ⚠️ Go 还开了 DevServer（favorite.yaml:23-30，16062 端口 + /metrics + /healthz + pprof）。
    #   那是 go-zero 的开发服务器，Java 侧对应的 /metrics 由 actuator 承担（见 management 段）。
  client:
    # 对应 Go etc/favorite.yaml:37-41  UserRpc.Etcd.Key: user.rpc
    # 🔴 地址必须是**三斜杠**（`discovery:///user-rpc`），不是两斜杠。
    #
    # 判据出处（**字节码实测**，devh grpc-client-spring-boot-starter 3.1.0.RELEASE 的
    # net/devh/boot/grpc/client/nameresolver/DiscoveryClientResolverFactory.newNameResolver）：
    #   String path = targetUri.getPath();
    #   if (path == null || path.length() <= 1 || !path.startsWith("/")) {
    #       throw new IllegalArgumentException("Incorrectly formatted target uri; ...");
    #   }
    #   ... newNameResolver(path.substring(1), args);   // ← 服务名 = path 去掉首斜杠
    #   ⇒ `discovery://user-rpc` 解析出 path=""（长度 0）⇒ 不合格 ⇒ **启动期抛异常**
    #   ⇒ 这个检查发生在**任何网络调用之前** ⇒ 与 Nacos 在不在线无关
    #   ⇒ 炸点在 gRPC client bean 后处理 ⇒ **连 Flyway 都跑不到** ⇒ 真 fat jar 起不来。
    #
    # ⚠️ 三斜杠**不改变服务发现名**：devh 取 path.substring(1) = "user-rpc"
    #    ⇒ 仍是 Nacos 上的服务名 `user-rpc`（与 spring.application.name 同族命名）。
    # ⚠️ 这**不是**「与 Go 对齐」—— 两侧注册中心本来就不同（Go 用 etcd 键 `user.rpc`，
    #    那是**已签字的有意偏离**）；本条修的是「RAG 侧写法非法导致起不来」。
    # ⇒ 守门：FavoriteRpcProductionAddressTest（读**生产** yaml · 遍历**全部** client ·
    #   **真调** devh 的 newNameResolver：生产不抛 + 两斜杠**必须**抛）。
    user-rpc:
      address: discovery:///user-rpc
      enable-keep-alive: true
      keep-alive-time: 30s
      negotiation-type: plaintext
    # 对应 Go etc/favorite.yaml:43-47  ArticleRpc.Etcd.Key: article.rpc
    article-rpc:
      # 🔴 同上：三斜杠。devh 取 path.substring(1) = "article-rpc"
      #    ⇒ 服务名不变（users 域的 article-rpc 侧服务名同样是 article-rpc）。
      address: discovery:///article-rpc
      enable-keep-alive: true
      keep-alive-time: 30s
      negotiation-type: plaintext

# ============== favorite 域专属配置 ==============
favorite:
  # ---------- subject_ref 版本（对应 Go config.go:17-18）----------
  # Go: SubjectRefV2Facts bool `json:",optional"`，注释明写 "Omitted is v1"。
  # ★ **默认必须是 false（v1）**：Go 侧省略即为 v1，而 v2 是尚未放开的候选形态
  #   （favorite.go:31-35 有一条「非 dev/test 模式开 v2 直接 exit(2)」的硬门禁）。
  #   见 FavoriteSubjectRefGate。
  subject-ref-v2-facts: false

  fact:
    # ---------- 事实投递（对应 Go cmd/fact-dispatch/main.go）----------
    # Go :35-40 要求三个环境变量齐全（FAVORITE_DATABASE_URL / DC_PLATFORM_EVENT_URL /
    #      DC_PLATFORM_SERVICE_TOKEN），任一缺失即 return error → 进程退出。
    # Java 侧是单 JVM 合并进程，**不能因为缺 DC 配置就让整个 favorite-rpc 起不来**
    # ⇒ 改为「默认关闭 + 启动时显式告警」；关闭时该功能完全不参与运行。
    dispatch:
      enabled: false
      # Go :56  NewFavoriteDCEventSender(endpoint, token, &http.Client{Timeout: 8 * time.Second})
      dc-endpoint: ${DC_PLATFORM_EVENT_URL:}
      dc-token: ${DC_PLATFORM_SERVICE_TOKEN:}
      dc-timeout: 8s
      # Go :23 的 -once flag（单次模式，适合 cron / CronJob）。
      # 常驻模式下由 FavoriteFactDispatchScheduler 驱动 Dispatcher.run(..., once=false)。
      once: false

    # ---------- 权威读（对应 Go cmd/fact-authority/main.go + internal/authority/http.go）----------
    # Go :35 要求 FAVORITE_AUTHORITY_LISTEN 非空 + FAVORITE_AUTHORITY_TOKEN ≥32 字节。
    #
    # ⚠️ wire 形态：Go favorite **自持** path 参数版 servlet
    #      GET /internal/v1|favorite/facts/{producer}/{event_id}
    #      （internal/authority/http.go:32,63），**不是** RAG 通用
    #      AuthorityHandlerFactory 的 /internal/v1/community/facts?producer=&event_id=。
    #   本实现按 Go 原样写 favorite 专用 servlet（保住 L1 wire），见 FavoriteAuthorityEndpointConfig。
    # ⚠️ 纯 gRPC 进程默认**没有** HTTP 端口；本端点默认关闭 ⇒ 不新增任何对外 wire 面。
    #   开启时需要一个 web connector（Spring MVC），这属于部署形态变更，见剩余问题。
    authority:
      enabled: false
      token: ${FAVORITE_AUTHORITY_TOKEN:}

    # ---------- legacy 预检（对应 Go cmd/fact-legacy-preflight/main.go）----------
    # Go :20-25 缺 FAVORITE_DATABASE_URL ⇒ exit 2；:45-51 报告不 clear ⇒ exit 2。
    # Spring 进程内**没有退出码语义**（kill -9 会连 gRPC 一起带走）⇒ 改为
    # 「结构化报表 + 由人工/CI 判读日志」，见 FavoriteLegacyPreflightRunner。
    legacy-preflight:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      # 对应 Go prometheus Subsystem: "favorite"（metrics.go:16,24,32,40）
      application: favorite-rpc
  prometheus:
    metrics:
      export:
        enabled: true

otel:
  service:
    # 对应 Go Telemetry.Name: favorite-rpc（etc/favorite.yaml:17-21）
    name: favorite-rpc
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:jaeger:4317}
  traces:
    exporter: otlp
    # 对应 Go Telemetry.Sampler: 1.0（= always on）
    sampler: parentbased_always_on

logging:
  level:
    root: INFO
    com.rag: INFO
    io.grpc: WARN

# ===== observability（对齐 Go service/common/observability）=====
# Go favorite.go:40 observability.DisableNativeRpcTimeout(&c.RpcServerConf)
#     + favorite.go:49 s.AddUnaryInterceptors(observability.NewUnaryServerInterceptor(...))
# Go yaml 未配 Timeout ⇒ go-zero zrpc/config.go 的 default=2000ms。
observability:
  rpc-timeout: 2s

# ===== snowflake =====
# 对应 Go service/common/snowflake：只用于 folder_id / favorite_id（两处 GetID），
# ⚠️ **不用于游标**（favorite 的两个 list 用例全量返回，无分页）。
snowflake:
  # 不设 workerId：走 SnowflakeBean 的三级优先级（env SNOWFLAKE_NODE_ID > 本项 > SERVICE_NAME+PID 哈希）