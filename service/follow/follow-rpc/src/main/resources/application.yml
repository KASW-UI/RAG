# =============================================================================
# follow-rpc application.yml —— 对应 Go 端 service/follow/rpc/etc/follow.yaml
#
# 本服务是**单 JVM 纯 gRPC 进程**：Go 侧 service/follow/rpc 只有 1 个 main（rpc/follow.go），
# 无 Redis、无 Kafka、无 MQ 进程。配置项按 Go yaml 段落逐条对应。
# =============================================================================

spring:
  application:
    # 对应 Go Name: follow.rpc（服务发现 / OTEL 均按 follow-rpc 注册，见 NacosRegistration）
    name: follow-rpc

  # ============== Postgres ==============
  # 对应 Go Postgres { Host, Port, User, Password, DBName, Mode }
  # ⚠️ Mode 在 Go 里不是 sslmode 的原名：db.go:22 把它拼进 DSN 的 `sslmode=` 位置
  #    （yaml 值 "disable" ⇒ sslmode=disable）。所以它**必须**落到 URL 的 sslmode 参数上，
  #    写成别的参数名会让连接串少一段、行为与 Go 不一致。
  datasource:
    # ⚠️ 连接串里那两段参数都来自 Go DSN（db.go:21-29）的逐字搬运，顺序也一致：
    #      sslmode  ← c.Postgres.Mode（yaml 写 "disable"）
    #      TimeZone  ← Go 硬编码的 Asia/Shanghai
    #    TimeZone 是**会话时区**，直接影响 timestamptz 的读出值；
    #    漏掉它会让 Java 侧读出的时间偏移与 Go 不同（同一行数据、两个墙上时钟）。
    #    ⚠️ 不要改用 spring.jackson.time-zone：那只管 JSON 序列化，不改 PG 会话。
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:first_db}?sslmode=${POSTGRES_SSLMODE:disable}&TimeZone=Asia/Shanghai
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 对应 Go db.go:38-39 sqlDB.SetMaxIdleConns(10) / SetMaxOpenConns(100)
      maximum-pool-size: 100
      minimum-idle: 10

  # ============== MyBatis-Plus ==============
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
      default-fetch-size: 100
    global-config:
      db-config:
        # 主键策略：Go 侧 GORM 对整数主键默认 autoIncrement（data_model.go 的 ID uint64 primaryKey
        # 未显式关掉），DDL 用 BIGSERIAL ⇒ 插入时让 PG 序列分配，行为与 Go 一致。
        id-type: AUTO
      banner: false

  # ============== Flyway ==============
  # 对应 Go db.go:42 db.AutoMigrate(&FollowRelation{}, &BlockRelation{})。
  # ⚠️ **独立账本表名**（AGENTS.md §6.3 问题 4）。
  #    `flyway_schema_history` 是 **schema 级**账本，一个 schema 只能有一本账。
  #    follow-rpc / like-rpc / message-rpc / article-rpc 连同一个 first_db、同一个 public schema，
  #    共用默认账本时后启动者会把自己的迁移判为「已应用」而静默跳过 —— 而各域的
  #    V1 版本号直接撞车且内容不同（follow_relation vs like_record vs message_notification）。
  #    改账本表名即可消除病根，**迁移文件名一个字都不用动**。
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public
    table: flyway_schema_history_follow

  # ============== Nacos Discovery ==============
  cloud:
    nacos:
      discovery:
        # ⚠️ **必须是 `host` 与 `port` 分开两个变量**（2026-10-24 真启动实测修正）。
        #    原写法 `${NACOS_ADDR:nacos:8848}` 把端口**硬编码在变量默认值里** ⇒
        #    NACOS_PORT 被完全忽略，且 NACOS_ADDR 的语义变成「host:port」，
        #    与 follow-api 的 `${NACOS_ADDR:nacos}:${NACOS_PORT:8848}` **冲突**：
        #    同一份部署环境（只设 NACOS_ADDR=host + NACOS_PORT=port）下，
        #    api 连到 `host:port`、rpc 连到 `host:8848` ⇒ **两个组件连的是两台 Nacos**
        #    ⇒ rpc 注册在 A、api 在 B 找它 ⇒ 恒 "No servers found" ⇒
        #    所有业务码塌成 1015（service busy）。
        #    ⚠️ 这个坑**极难从代码看出来**：两个 yaml 各自都"对"，只有放在一起才冲突。
        #    与 follow-api 保持同一套变量语义后，两端必然指向同一台 Nacos。
        server-addr: ${NACOS_ADDR:nacos}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

# ============== gRPC server（devh）==============
# 对应 Go follow.yaml:2 ListenOn: 0.0.0.0:8082
grpc:
  server:
    port: 8082
    address: 0.0.0.0
    # Go 侧 reflection 仅在 DevMode/TestMode 注册（follow.go:40-42）；
    # Java 侧 devh starter 默认即开启 reflection，此处不额外配置。
  client:
    # 对应 Go follow.yaml:37-41 UserRpc.Etcd.Key: user.rpc → 服务发现名 user-rpc
    # 唯一消费点：logic/helper.go:82 ensureUserExists → UserRpc.GetUser({Uid})
    # ⚠️ **必须是三斜杠 `discovery:///user-rpc`**（2026-10-24 真启动实测修正）。
    #    devh 的 `net.devh.boot.grpc.client.nameresolver.DiscoveryClientResolverFactory#newNameResolver`
    #    判定的是 `uri.getPath()`：**必须非空、长度 > 1、且以 "/" 开头**。
    #      discovery:///user-rpc → authority="" 、path="/user-rpc"  ✅
    #      discovery://user-rpc  → authority="user-rpc"、path=""     ❌ 长度 0，直接抛
    #        IllegalArgumentException: Incorrectly formatted target uri;
    #        expected: 'discovery:[//]/<service-name>'; but was 'discovery://user-rpc'
    #    ⇒ 两斜杠写法**不是「少写一个斜杠」**，它把服务名解析成了 authority、path 留空。
    #    ⚠️ 本仓的 6 个 *-rpc 模块原本全是两斜杠（api 模块反而都是三斜杠）——
    #    之所以没人发现：**测试把地址覆盖成了 static://127.0.0.1:1**
    #    （见 FollowRpcWiringTest 的 @SpringBootTest properties），
    #    生产地址从未被任何测试跑过 ⇒ 「跑绿」与「能启动」无关。
    user-rpc:
      address: discovery:///user-rpc
      enable-keep-alive: true
      keep-alive-time: 30s
      negotiation-type: plaintext

# ============== follow 服务专属配置 ==============
# 对应 Go follow.yaml:43-50 List / Recommend 两段。
# ⚠️ 这里的 4 个 List/Recommend 数值**全部参与业务分支**（默认值 / 截断上限 / 推荐深度 / 扇出上限），
#    不是性能开关 —— 改它们会改变 RPC 的可观察输出。
follow:
  list:
    # Go ListConf.DefaultLimit `json:",default=20"`（yaml 也显式写 20）
    # 作用于 GetFollowList / GetBlockList / GetFollowerList 三个方法
    default-limit: 20
    # Go ListConf.MaxLimit `json:",default=100"` —— limit > MaxLimit 时被截断
    max-limit: 100
  recommend:
    # Go RecommendConf.DefaultLimit `json:",default=20"` —— 只作用于 GetRecommendations
    # ⚠️ 与 list.default-limit 是**两个不同的常量**：Go 侧它们在不同的 struct 里，
    #    值虽然都是 20 但语义独立，改一个不影响另一个。
    default-limit: 20
    # Go RecommendConf.MaxLimit `json:",default=50"` —— ⚠️ 是 50 不是 100
    max-limit: 50
    # Go RecommendConf.MaxDepth `json:",default=3"` —— 推荐展开层数上限，
    #    经 clampRecommendDepth（helper.go:130-138）夹到 [2,5]
    max-depth: 3
    # Go RecommendConf.MaxFanout `json:",default=50"` —— 每层每个源用户的扇出上限，
    #    经 clampFanout（helper.go:140-147）夹到 (0,200]
    max-fanout: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    # ⚠️ **刻意不加 `tags.application`**（2026-10-24 双侧活体对拍实测修正）。
    #
    # Go 侧 5 个指标的 Subsystem 都是 "follow_rpc"，而 Prometheus 导出时
    # **Subsystem 直接变成指标名前缀** ⇒ Go 的指标名本身就是 `follow_rpc_request_total`。
    # RAG 侧的 meter 名**已带同一个前缀** ⇒ 再挂 application="follow-rpc" 是重复信息，
    # 且会让同一份 PromQL 在两侧得到不同聚合结果。
    # 详见 docs/DRIFT/follow/rpc.md（DRIFT-FOLLOW-007）。
  prometheus:
    metrics:
      export:
        enabled: true

otel:
  service:
    name: follow-rpc
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:jaeger:4317}
  traces:
    exporter: otlp
    sampler: parentbased_always_on

logging:
  level:
    root: INFO
    com.rag: INFO
    io.grpc: WARN

# ===== observability（对齐 Go service/common/observability）=====
# Go follow.go:34 observability.DisableNativeRpcTimeout(&c.RpcServerConf)
#            + follow.go:44 s.AddUnaryInterceptors(observability.NewUnaryServerInterceptor(...))
# Go yaml 未配 Timeout ⇒ go-zero zrpc/config.go 的 default=2000ms。
observability:
  rpc-timeout: 2s