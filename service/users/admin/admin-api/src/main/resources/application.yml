# admin-api 启动配置 —— 对齐 Go 端 service/user/admin/api/etc/admincenter.yaml
# 独立 HTTP gateway 进程；下游通过 gRPC 调 admin-rpc，调 Redis 查 JWT 黑名单。
#
# 字段重映射：
#   Go etc/admincenter.yaml          →         application.yml
#   ============================================================
#   Name=admincenter                 →   spring.application.name=admin-api
#   Host=0.0.0.0                     →   server.address=0.0.0.0
#   Port=8889                        →   server.port=（与 user-api 段同款，按 Infrastructure.md §3 实际部署填写）
#   Log.ServiceName/Mode/Path        →   （交由 service/common Logger.java + application.yml logging 节）
#   AdminAuth.AccessSecret           →   admin-api.admin-auth.access-secret
#   AdminAuth.AccessExpire           →   admin-api.admin-auth.access-expire
#   AdminRpc.Etcd.Hosts/Key          →   grpc.client.admin-rpc.address（discovery://admin-rpc 走 Nacos）
#   BizRedis.Host/Type/Pass          →   spring.data.redis.*
#   Telemetry.Endpoint/Sampler       →   otel.exporter.otlp.* + otel.traces.sampler
#   DevServer.Enabled/Port/Paths     →   management.endpoints + management.server.port

spring:
  application:
    name: admin-api

  # ===== 1. Redis（对齐 Go 端 BizRedis）=====
  # Go: BizRedis.Host=redis:6379 / Type=node / Pass=""
  # Java 侧用 Spring Data Redis（Lettuce）
  # REDIS_ADDR/REDIS_PORT 来自 docker-compose.yaml（容器内 DNS 名 + 容器内端口 6379）
  data:
    redis:
      host: ${REDIS_ADDR:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # ⚠️ 取值出处（2026-10-23 补记，此前只有数值没有出处）：
      #   Go 的 admin.yaml 完全没配 BizRedis 超时
      #     → go-zero v1.10.2 redisclientmanager.go:32-39 建 red.Options 时不传任何 timeout
      #     → go-redis/v9 **v9.20.0**（Sea 仓 go.mod:15 **直接 pin**）options.go 的 init() 默认：
      #        ReadTimeout = 3s（options.go:364-370）· DialTimeout = 5s（options.go:338-339）· WriteTimeout = ReadTimeout（:374-378）
      #   ⇒ 读命令超时 3s，与 go-redis 默认逐字相同（完整出处链见 admin-rpc 侧同段注释）。
      #   🔴 go-zero redis.go:27 的 `readWriteTimeout = 2s` 是**死常量**，别被它误导。
      timeout: 3s
      # 连接超时：Go 的 go-redis DialTimeout 默认 **5s**。
      # 🔴 2026-10-27 订正：此处原写「Lettuce 在 connect-timeout 未设时回落到 timeout ⇒ 跟着变成 3s」
      #    ——**那是错的**：Boot 4.0.8 createClientOptions 的字节码是 `if (connectTimeout != null) { … }`
      #    ⇒ null ⇒ 整段跳过 ⇒ 用 Lettuce 自己的默认 **10s**（SocketOptions.DEFAULT_CONNECT_TIMEOUT_DURATION）
      #    ⇒ 不配这行 = 10s（≠ Go 的 5s）；修法与结论不变。详见 DRIFT-ADMINAPI-012 订正块。
      # Boot 4 里这是独立属性（DataRedisProperties.connectTimeout，模块 spring-boot-data-redis）。
      connect-timeout: 5s

  # ===== 2. Nacos 服务发现客户端 =====
  # 配 Nacos server 地址 + namespace + group。
  # env 覆盖：NACOS_ADDR / NACOS_PORT / NACOS_NAMESPACE / NACOS_GROUP / NACOS_USERNAME / NACOS_PASSWORD
  cloud:
    nacos:
      discovery:
        # NACOS_ADDR/NACOS_PORT 来自 docker-compose.yaml（容器内 DNS 名 + 容器内端口 8848）
        server-addr: ${NACOS_ADDR:nacos}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:sea-rtw}
        group: ${NACOS_GROUP:USER_GROUP}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}

# ===== 3. HTTP server 监听端口（对齐 Go 端 etc/admincenter.yaml: Host=0.0.0.0, Port=8889）=====
# Java 版端口按实际部署填写（与 user-api 段同款，按 Infrastructure.md §3）
server:
  port: 8889
  address: 0.0.0.0
  servlet:
    context-path: /
  # ⚠️ 容器三旋钮：与 Go 对齐（Go 出处 + 实测 ⇒ docs/DRIFT/hot/api.md 的 DRIFT-HOTAPI-021/022/023；
  #    守门 ⇒ tools/difftest/check-tomcat-limits.py）
  #    ① relaxed-query-chars：Go 的 net/http 不校验 query 里的 [ ]，且 go-zero httpx.GetFormValues
  #       明确支持方括号数组记法；Tomcat 默认拒绝 ⇒ 400 + HTML 错误页（不是业务信封）
  #    ② max-parameter-count：Go = go-zero httpx/util.go:15 maxFormParamCount=2048（应用层判）；
  #       Boot 4 默认 1000 ⇒ Tomcat 先拒，RAG 自己实现的 2048 判据在 GET query 上不可达
  #    ③ max-http-request-header-size：Go 的**真实**上限 = DefaultMaxHeaderBytes(1<<20)
  #       + 4096（net/http/server.go:941 `return int64(s.maxHeaderBytes()) + 4096 // bufio slop`）
  #       ⇒ 1 MiB + 4 KiB = **1028KB**；Boot 4 默认 8KB
  tomcat:
    relaxed-query-chars: ["[", "]"]
    max-parameter-count: 2048
  max-http-request-header-size: 1028KB

# ===== 3.5. gRPC client（端到端验证期：走 Nacos discovery 找到 admin-rpc）=====
# devh grpc-client-spring-boot-starter 3.1.0.RELEASE 的 discovery scheme：
#   address: discovery:///admin-rpc   ← 三斜杠（discovery://[authority]/<service-name>）
# admin-rpc 端已通过新增的 NacosBootstrap（DRIFT-NEW-011）显式注册到 Nacos，
# admin-api 这里走标准 Spring Cloud Nacos discovery 路径，不走 static:// 旁路。
#
# DRIFT-NEW-008：devh 3.1.0.RELEASE 的 GLOBAL 默认 negotiation-type=TLS，与 admin-rpc plaintext 不符。
# 显式覆写为 plaintext（admin-rpc server 是 plain gRPC，没有 TLS）。
grpc:
  client:
    admin-rpc:
      address: discovery:///admin-rpc
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      permit-keep-alive-without-calls: true
      # 🔴 DRIFT-ADMINAPI-009：启动期必须能连上 admin-rpc，否则进程起不来。
      #
      # Go 出处（逐层到消费点）：
      #   service/user/admin/api/internal/svc/servicecontext.go:27
      #       AdminRpc: adminservice.NewAdminService(zrpc.MustNewClient(c.AdminRpc)),
      #   go-zero v1.10.2 zrpc/client.go:50-54  →  logx.Must(err)   // 失败即 panic
      #   go-zero v1.10.2 zrpc/internal/client.go:18   →  dialTimeout = time.Second * 3
      #   go-zero v1.10.2 zrpc/internal/client.go:122-142
      #       grpc.DialContext(timeCtx, server, options...)  // options 含 WithBlock()
      # ⇒ Go 启动时阻塞拨号 3s，连不上就 panic ⇒ **进程根本起不来**。
      #
      # 本属性对应 devh grpc-client-spring-boot-starter 3.1.0 的
      # AbstractChannelFactory.newManagedChannel → connectOnStartup：
      #   channel.getState(true) → 等 READY → 超时则 throw IllegalStateException(
      #       "Can't connect to channel admin-rpc") ⇒ stub 创建失败 ⇒ 上下文启动失败。
      # ⇒ 与 Go 的 zrpc.MustNewClient 同型：「连不上 ⇒ 起不来」，不是「起来但请求全失败」。
      #
      # ⚠️ **只对 admin-rpc 这一个 channel 开**（不要提到 grpc.client 顶层当全局）：
      #   Go 侧 admin-api 的 ServiceContext 里**只有** AdminRpc 一个下游依赖
      #   （service/user/admin/api/internal/svc/servicecontext.go:24-28），
      #   而本 yml 里下面那条 grpc.client.user-rpc 是**没有对应 Go 依赖的遗留配置**
      #   （本模块没有任何 @GrpcClient("user-rpc") 注入点）
      #   ⇒ 设成全局会凭空多出一条 Go 侧不存在的启动期硬依赖。
      #
      # ⚠️ devh 的默认值是 0（= 关闭）⇒ 「yml 里没写」就等于「机制没武装」。
      #   AdminRpcClient.afterPropertiesSet() 会断言本项已武装，删掉这行会让 admin-api 起不来
      #   （宁可起不来，也不要静默退化成「Pod Ready 但 100% 请求失败」）。
      immediate-connect-timeout: 3s
    user-rpc:
      address: discovery:///user-rpc
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      permit-keep-alive-without-calls: true
      # ⚠️ 这里**刻意不设** immediate-connect-timeout：
      #   Go 侧 admin-api 根本没有 user-rpc 依赖（见上）⇒ 不该给它加启动期硬依赖。
      #   本模块也没有 @GrpcClient("user-rpc") 注入点 ⇒ 这条配置当前无消费者。

# ===== 4. 业务配置（对齐 Go 端 AdminAuth.*）=====
# 对应 Go: AdminAuth.AccessSecret / AdminAuth.AccessExpire
# gRPC channel 目标由 devh starter 通过 grpc.client.admin-rpc.address 装配（见上面 §3.5）
admin-api:
  admin-auth:
    access-secret: ${ADMIN_JWT_SECRET:yU-hCm)2*?NQmWG}
    access-expire: ${ADMIN_JWT_EXPIRE:2592000}    # 30 天，与 Go 端 etc/admincenter.yaml 一致

# ===== 5. Metrics：暴露 /actuator/prometheus =====
# Spring Web 已在 server.port；Actuator 复用同一 Tomcat。
# Prometheus 从同 docker 网络内 scrape：http://admin-api:<server>/actuator/prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    enabled-by-default: false      # 只显式开启下面三个
  endpoint:
    health:
      enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    enable:
      prometheus: true
    tags:
      application: ${spring.application.name}

# ===== 6. OpenTelemetry OTLP exporter（对齐 Go 端 Telemetry.*）=====
# Go: Endpoint=jaeger:4317, Batcher=otlpgrpc, Sampler=1.0, Name=admin-api
# OTEL_ADDR/OTLP_PORT 来自 docker-compose.yaml（容器内 DNS 名 + 容器内端口 4317）
otel:
  exporter:
    otlp:
      endpoint: http://${OTEL_ADDR:jaeger}:${OTLP_PORT:4317}
      protocol: grpc
  resource:
    attributes:
      service.name: admin-api
  traces:
    sampler: always_on          # 对齐 Go Sampler: 1.0

# ===== 7. 日志（Spring Boot 默认走 logback-classic，SLF4J）=====
# Logger.java 已显式调 Logger.init("admin-api")，MDC trace_id 会被自动填入
logging:
  level:
    root: INFO
    com.rag.users.admin.api: INFO
    com.rag.common: INFO
# ===== observability（对齐 Go service/user/admin/api 的 DisableNativeRestTimeout + NewHTTPMiddleware）=====
# 取值依据：Go 侧 service/user/admin/api/etc/admincenter.yaml 未配置 Timeout，
# 实际生效值为 go-zero v1.10.2 `rest/config.go:55` 的 `json:",default=3000"` → 3000ms。
observability:
  http-timeout: 3s

rag:
  http:
    # =============================================================================
    # 🔴 Go 风格 form 值上限闸门（2026-10-25 第十四轮 · global 收口域 · X-6 / DRIFT-HOTAPI-030）
    # =============================================================================
    # Go 出处：go-zero rest/httpx/util.go:15  maxFormParamCount = 2048
    #          （数的是**非空值**；util.go:44-45 空值 continue 不计数）
    #          Go 1.25 net/url/url.go:1001  defaultMaxParams = 10000（数的是**段数**）
    #
    # mode = 本域的 form 超限时应该输出什么形状 —— 依据是「Go 侧该 api 有没有注册
    #        httpx.SetErrorHandler」（逐域取证）：
    #   · raw      ⇒ Go 未注册 SetErrorHandler ⇒ http.Error(w, err.Error(), 400)
    #                ⇒ **400 + text/plain; charset=utf-8 + nosniff + Go 原文**
    #   · envelope ⇒ Go 注册了 SetErrorHandler ⇒ 走业务信封
    #                ⇒ **200 + {"code":5001,"msg":"<该域自己的错误码表文案>","data":null}**
    #
    # ⚠️ 本属性**同时**决定两件事（缺一不可）：
    #   ① service/common 的 GoStyleTomcatParameterLimitCustomizer 把 Tomcat 的
    #      maxParameterCount 抬到 10001（= Go 段数上限 +1）⇒ 否则 Tomcat 会先于应用层拒绝，
    #      且拒绝形状是 400 + HTML 错误页（与 Go 不同）；
    #   ② service/common 的 GoStyleFormValueLimitInterceptor 按 Go 的语义判定。
    #
    # ⚠️ 各域 5001 的文案**不一样**（like/comment =「系统内部错误」，
    #    hot/follow/message = "internal server error"）⇒ 共享层**不硬编码文案**：
    #    envelope 模式下共享层只抛异常，由**本域自己的**兜底 handler 查本域的错误码表渲染。
    #
    # 🔴 favorite 域**故意没有这一项**（= off）⇒ global 对该域零影响：
    #    既不改它的容器上限、也不装闸门 ⇒ 行为逐字节不变。
    #    （favorite 不在 global 的写权范围内，AGENTS.md §5.3c）
    go-form-limit:
      # Go 侧 user/api **没有** httpx.SetErrorHandler ⇒ 同 article ⇒ **400 + Go 原文** ⇒ mode: raw
      mode: raw
