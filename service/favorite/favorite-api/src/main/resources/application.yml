# =============================================================================
# favorite-api application.yml —— 对齐 Go 端 service/favorite/api/etc/favorite.yaml
#
# 独立 HTTP gateway 进程；下游通过 gRPC 调 favorite-rpc，调 Redis 查 JWT 黑名单。
#
# 字段重映射：
#   Go etc/favorite.yaml            →         application.yml
#   ============================================================
#   Name=favorite-api               →   spring.application.name=favorite-api
#   Host=0.0.0.0                     →   server.address=0.0.0.0
#   Port=8890                        →   server.port=18893
#                                     （18893 = Infrastructure.md §3 给 favorite 域预占的号段）
#   Log.ServiceName/Mode/Path        →   （交由 service/common Logger.java + logging 节）
#   UserAuth.AccessSecret           →   favorite-api.user-auth.access-secret
#   UserAuth.AccessExpire           →   favorite-api.user-auth.access-expire
#   FavoriteRpc.Etcd.Hosts/Key       →   grpc.client.favorite-rpc.address（discovery:///favorite-rpc）
#   BizRedis.Host/Type/Pass          →   spring.data.redis.*
#   Telemetry.Endpoint/Sampler       →   otel.exporter.otlp.* + otel.traces.sampler
#   DevServer.Enabled/Port/Paths     →   management.endpoints + management.server.port
# =============================================================================

spring:
  application:
    name: favorite-api

  # ===== 1. Redis（对齐 Go 端 BizRedis）=====
  # Go: BizRedis.Host=redis:6379 / Type=node / Pass=""
  # Java 侧用 Spring Data Redis（Lettuce）。
  # REDIS_ADDR/REDIS_PORT 来自 docker-compose.yaml（容器内 DNS 名 + 容器内端口 6379）。
  data:
    redis:
      host: ${REDIS_ADDR:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # 命令超时（读写）= Go 的 ReadTimeout/WriteTimeout = 3s
      timeout: 3s
      # 🔴 connect-timeout（**TCP 连接**超时）必须显式写 5s：
      #   Go 出处（消费点）：service/favorite/api/internal/svc/service_context.go:20
      #       redisDB := redis.MustNewRedis(c.BizRedis)
      #     → go-zero core/stores/redis/redisclientmanager.go:32-40 构造
      #       red.NewClient(&red.Options{Addr, Username, Password, DB, MaxRetries, MinIdleConns, TLSConfig})
      #     ⇒ **没有设置 DialTimeout** ⇒ 走 go-redis v9.20.0 options.go:338-340 的默认
      #       DialTimeout = **5s**（ReadTimeout/WriteTimeout 同理走 :364-379 的 3s）。
      #   RAG 侧：Boot 4.0.8 的 LettuceConnectionConfiguration.createClientOptions **只在**
      #       spring.data.redis.connect-timeout 非空时才设 SocketOptions.connectTimeout
      #     ⇒ 不配 ⇒ 走 Lettuce SocketOptions.DEFAULT_CONNECT_TIMEOUT = **10s**
      #   ⇒ 不配 ⇒ 连接超时 10s vs Go 5s ⇒ **漂移 2 倍**（连接不可达时要等 2 倍时间）。
      # ⚠️ spring.data.redis.timeout 只管**命令**超时；Boot 4 起它**不再**兼管连接超时
      #    （Boot 2/3 才是同一个属性）—— 两个超时必须分别配。
      connect-timeout: 5s

      # ===== 1.3 Redis 连接池（对齐 Go 侧 go-zero 的 node 客户端）=====
      # 🔴 形态漂移（2026-10-27 G3 修）：Go 侧**有池**，本模块原先**无池**
      #   （无 pool 段 ＋ pom 无 commons-pool2 ⇒ Boot 4 的判据
      #    `DataRedisConnectionConfiguration#isPoolEnabled` = `enabled ?? COMMONS_POOL2_AVAILABLE`
      #    ⇒ 池不启用 ⇒ Lettuce 走**共享单连接** ⇒ 并发下命令串行排队 ⇒ 可能撞 3s 命令超时）。
      # Go 出处（**消费点**，逐条可追）：
      #   真源 `service/favorite/api/internal/svc/service_context.go:20`
      #     `redisDB := redis.MustNewRedis(c.BizRedis)`
      #   ⇒ `c.BizRedis` = `redis.RedisConf`（`internal/config/config.go:16`）· `Type: node`（`etc/favorite.yaml:16`）
      #   ⇒ go-zero `core/stores/redis/redis.go:109` `MustNewRedis` → `:122` `NewRedis`
      #      → `:139` `newRedis`（`Type: NodeType`）→ `:2723` `case NodeType: return getClient(r)`
      #   ⇒ **消费点** `core/stores/redis/redisclientmanager.go:32-40`
      #      `red.NewClient(&red.Options{Addr, Username, Password, DB, MaxRetries: maxRetries, MinIdleConns: idleConns, TLSConfig})`
      #      ⇒ `:15` `idleConns = 8` ⇒ ⇒ **Go 侧 `MinIdleConns = 8`（至少保留 8 条空闲连接）**
      #   ⇒ `PoolSize` 未设 ⇒ go-redis v9.20.0 库默认 `10 × GOMAXPROCS` ⇒ **Go 有池**
      #   ⇒ `PoolTimeout` 未设 ⇒ `go-redis@v9.20.0/options.go:380-386` `= ReadTimeout + 1s`
      #     = **4s**（本模块 `timeout: 3s` 对齐的就是 Go 的 ReadTimeout）
      # 取值口径（**不拿「现有 RAG 代码」当对照基准** · AGENTS.md §3.1）：
      #   · `min-idle: 8`  ↔ Go 的 `MinIdleConns = 8` ⇒ **精确对齐**
      #     ⚠️ **本域与 hot-rpc / comment-rpc 不同族**：那两个域的 Go 走 **go-redis 直连**
      #        （`MinIdleConns` 未设 ⇒ `options.go:218-222` 无 default ⇒ 0）⇒ 它们取 `min-idle: 0`；
      #        本域的 Go 走 **go-zero** ⇒ **8** ⇒ ⇒ **别照抄别域的 0**（照抄 = 变成对 Go 的偏离）。
      #   · `max-active: 64` ↔ Go 的 `PoolSize = 10 × 核数`（机器相关，本机 100）⇒ **数量级对齐**
      #     ⚠️ Go 的 `MaxActiveConns` 未设 ⇒ `options.go:230-235`「zero ⇒ no limit」⇒ **Go 无总量硬上限**
      #     ⇒ 64 是**表达层**硬上限（残留差异属**性能面**）。
      #   · `max-idle: 16` ↔ Go 的 `MaxIdleConns` 未设 ⇒ `options.go:224-228` 无 default ⇒ 0
      #     ⇒ 消费点 `internal/pool/pool.go:1257` `if p.cfg.MaxIdleConns == 0 || …` ⇒ **0 = 无上限**
      #     ⇒ 16 是**表达层**取值（**比 Go 更严**：只影响空闲连接的保留/回收，**不影响命令结果**）。
      #   · `max-wait: 4s` ↔ Go 的 `PoolTimeout = 4s` ⇒ **必配项，不是可选优化**
      #     ⚠️ **不配 ⇒ 落 commons-pool2 自己的 `DEFAULT_MAX_WAIT = -1`** ⇒ `GenericObjectPool:306`
      #        走 `idleObjects.takeFirst()` ⇒ **无限等**；且 Lettuce 的 3s 命令超时**此时尚未起算**
      #        （`CommandExpiryWriter.write()` 才起算，而**借连接发生在写命令之前**）⇒ ⇒ **光加池反而比 Go 更糟**。
      #     消费点：go-redis `internal/pool/pool.go:1113`
      #       `err := p.semaphore.Acquire(ctx, p.cfg.PoolTimeout, ErrPoolTimeout)`。
      #   · Boot 4 的装配点：`LettuceConnectionConfiguration$PoolBuilderFactory.getPoolConfig`
      #     ⇒ `setMaxTotal/setMaxIdle/setMinIdle/setMaxWait`（**只在 `maxWait != null` 时才设 maxWait**）。
      lettuce:
        pool:
          enabled: true
          max-active: 64
          max-idle: 16
          min-idle: 8
          max-wait: 4s

  # ===== 2. Nacos 服务发现客户端 =====
  # ⚠️ namespace / group 的默认值必须与 favorite-rpc 的 application.yml 一致，
  #    否则 api 侧【找不到】自己的下游 —— 两边都走同一组 env 覆盖。
  #    favorite-rpc 侧当前默认：namespace=public / group=DEFAULT_GROUP。
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

# ===== 3. HTTP server 监听端口 =====
# Infrastructure.md §3：favorite 域预占 18893。
server:
  port: ${FAVORITE_API_PORT:18893}
  address: 0.0.0.0
  servlet:
    context-path: /
  # ⚠️ 容器三旋钮：与 Go 对齐（Go 出处 + 实测 ⇒ docs/DRIFT/hot/api.md 的 DRIFT-HOTAPI-021/022/023；
  #    守门 ⇒ tools/difftest/check-tomcat-limits.py）
  #    ① relaxed-query-chars：Go 的 net/http 不校验 query 里的 [ ]，且 go-zero httpx.GetFormValues
  #       明确支持方括号数组记法；Tomcat 默认拒绝 ⇒ 400 + HTML 错误页（不是业务信封）
  #    ② max-parameter-count：Go = go-zero httpx/util.go:15 maxFormParamCount=2048（应用层判）；
  #       Boot 4 默认 1000 ⇒ Tomcat 先拒，RAG 自己实现的 2048 判据在 GET query 上不可达
  #    ③ max-http-request-header-size：Go 的**真实**上限 = DefaultMaxHeaderBytes(1<<20)
  #       + 4096（net/http/server.go:941 `return int64(s.maxHeaderBytes()) + 4096 // bufio slop`）
  #       ⇒ 1 MiB + 4 KiB = **1028KB**；Boot 4 默认 8KB
  tomcat:
    relaxed-query-chars: ["[", "]"]
    max-parameter-count: 2048
  max-http-request-header-size: 1028KB

# ===== 3.5. gRPC client（端到端验证期：走 Nacos discovery 找到 favorite-rpc）=====
# devh grpc-client-spring-boot-starter 3.1.0.RELEASE 的 discovery scheme：
#   address: discovery:///favorite-rpc   ← 三斜杠（discovery://[authority]/<service-name>）
# 对应 Go 端 FavoriteRpc.Etcd.Key: favorite.rpc（favorite.yaml:34-37）。
#
# ⚠️ negotiation-type 必须显式写 plaintext：
#    devh 的 GrpcChannelProperties 默认值是 TLS，不写会【静默】变 TLS，
#    而 Go zrpc.MustNewServer 是明文 gRPC ⇒ 写错时表现为连接握手失败，不是配置报错。
grpc:
  client:
    favorite-rpc:
      address: discovery:///favorite-rpc
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      permit-keep-alive-without-calls: true

# ===== 4. 业务配置（对齐 Go 端 UserAuth.*）=====
# 对应 Go: UserAuth.AccessSecret / UserAuth.AccessExpire（favorite.yaml:10-12）
#
# ⚠️ access-secret 必须与 user-rpc 的签发密钥一致：
#    Go 侧 favorite/api 只验签、不签发（没有 login 端点），签发方是 user-api。
#    两边密钥不一致 ⇒ 验签必失败，表现为 HTTP 401。
favorite-api:
  user-auth:
    access-secret: ${FAVORITE_JWT_SECRET:ae0536f9-6450-4606-8e13-5a19ed505da0}
    access-expire: ${FAVORITE_JWT_EXPIRE:2592000}   # 30 天，与 Go 端 favorite.yaml:12 一致

# ===== 5. Metrics：暴露 /actuator/prometheus =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
    enabled-by-default: false      # 只显式开启下面三个
  endpoint:
    health:
      enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    enable:
      prometheus: true
    tags:
      application: ${spring.application.name}

# ===== 6. OpenTelemetry OTLP exporter（对齐 Go 端 Telemetry.*）=====
# Go: Endpoint=jaeger:4317, Batcher=otlpgrpc, Sampler=1.0, Name=favorite-api
otel:
  service:
    name: favorite-api
  exporter:
    otlp:
      endpoint: http://${OTEL_ADDR:jaeger}:${OTLP_PORT:4317}
      protocol: grpc
  traces:
    sampler: parentbased_always_on     # 对齐 Go Sampler: 1.0

# ===== 7. 日志（Spring Boot 默认走 logback-classic，SLF4J）=====
# Logger.java 已显式调 Logger.init("favorite-api")，MDC trace_id 会被自动填入
logging:
  level:
    root: INFO
    com.rag.favorite.favorite.api: INFO
    com.rag.common: INFO

# ===== observability（对齐 Go service/favorite/api/favorite.go:28-30）=====
# Go: observability.DisableNativeRestTimeout(&c.RestConf) + observability.NewHTTPMiddleware(...)
# 取值依据：Go 侧 service/favorite/api/etc/favorite.yaml 【未配置】Timeout，
# 实际生效值为 go-zero v1.10.2 `rest/config.go:55` 的 `json:",default=3000"` → 3000ms。
observability:
  http-timeout: 3s
