# ─────────────────────────────────────────────────────────────────────────────
# 测试作用域配置（user-api）
# ─────────────────────────────────────────────────────────────────────────────
# 🔴 为什么需要这个文件（2026-10-29 · G1 阶段 1 · P0 #8）：
#   主配置 `src/main/resources/application.yml` 的
#     user-api.user-auth.access-secret: ${USER_JWT_SECRET}
#   **已去掉明文默认值** ⇒ ⇒ 变量没设时启动即失败（fail-closed）
#   ⇒ ⇒ 测试必须**自带**密钥，否则整个测试上下文起不来。
#
# ⚠️ 本文件是 **test scope**（只进 target/test-classes）⇒ **不进产物 jar** ⇒
#    ⇒ 生产/部署**拿不到**这个默认值 ⇒ ⇒ 生产必须由环境变量提供。
#
# ⚠️ 值必须与测试里签发 token 的常量一致
#    （UserApiMvcPipelineTest#SECRET / UserLoginServiceTest#SECRET 等）⇒ 否则验签必失败（401）。
# ⚠️ **长度必须保持 36 字节**（jjwt 要求 HMAC 密钥 ≥32 字节 ⇒ JwtUtil.padToHmacKeySize 会补齐）
#    ⇒ 长度本身是被测的不变量 ⇒ 不要换成别的长度。
user-api.user-auth.access-secret=ae0536f9-6450-4606-8e13-5a19ed505da0
