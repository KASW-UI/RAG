# like-api 运行配置
#
# 对应 Go 端 service/like/api/etc/likecenter.yaml。
#
# ⚠️⚠️ 头部纪律（本文件每一条都对应 Go 侧一个「yaml 里看不到、但代码里开着」的事实）
#
# ① 【2026-10-22 更正】Go 的 RestConf **有** 3s 超时，虽然 yaml 里一个字都没写
#    出处：go-zero v1.10.2 rest/config.go:55
#          Timeout int64 `json:",default=3000"`
#    ⇒ conf.MustLoad 会套用这个 struct tag 默认值 ⇒ Timeout == 3000，**不是 0**
#    ⇒ observability.DisableNativeRestTimeout 返回 3s，并关掉 go-zero 自带的
#      rest 超时中间件（conf.Middlewares.Timeout = false）—— 超时只有一个执行者
#    ⇒ observability.NewHTTPMiddleware 用它包住整个请求，超时写
#      http.Error(w, "Request Timeout", http.StatusServiceUnavailable)
#
#    ⚠️ 本文件此前**故意不配** http-timeout，理由写的是「yaml 没写 Timeout
#       ⇒ TimeoutFromMillis(0)==0 ⇒ 无超时」。那个推理**字面自洽但完全错误** ——
#       它只看了 yaml，没看 rest/config.go 的 tag。这就是 DRIFT-LIKEAPI-001。
#       改之前 message-api / user-api / admin-api 三个兄弟模块都配了 3s，
#       com.rag.common.spring.ObservabilityProperties.java:45 也已写明
#       「各模块 yaml 须显式写出同值，不得留空」；like-api 曾是唯一不配的那个。
#
#    ⚠️ 残留差异（未消）：Go 的 3s 跑在**独立 goroutine** 上，超时后 handler 仍在执行、
#       只是写丢弃；Java 的 HttpMiddleware 用 Future.cancel(true) 去中断 worker 线程，
#       而**阻塞中的 gRPC 调用不可中断**。⇒ 补上本配置修好了状态码与等待时长，
#       但**取消语义仍不等价**，需要单独设计（如显式 deadline 透传给 stub）。
observability:
  # 对齐 Go rest.RestConf.Timeout 的实际生效值 3000ms（rest/config.go:55）
  http-timeout: 3s

server:
  # Go: likecenter.yaml Host: 0.0.0.0 / Port: 18887
  port: 18887
  # ⚠️ 容器三旋钮：与 Go 对齐（Go 出处 + 实测 ⇒ docs/DRIFT/hot/api.md 的 DRIFT-HOTAPI-021/022/023；
  #    守门 ⇒ tools/difftest/check-tomcat-limits.py）
  #    ① relaxed-query-chars：Go 的 net/http 不校验 query 里的 [ ]，且 go-zero httpx.GetFormValues
  #       明确支持方括号数组记法；Tomcat 默认拒绝 ⇒ 400 + HTML 错误页（不是业务信封）
  #    ② max-parameter-count：Go = go-zero httpx/util.go:15 maxFormParamCount=2048（应用层判）；
  #       Boot 4 默认 1000 ⇒ Tomcat 先拒，RAG 自己实现的 2048 判据在 GET query 上不可达
  #    ③ max-http-request-header-size：Go 的**真实**上限 = DefaultMaxHeaderBytes(1<<20)
  #       + 4096（net/http/server.go:941 `return int64(s.maxHeaderBytes()) + 4096 // bufio slop`）
  #       ⇒ 1 MiB + 4 KiB = **1028KB**；Boot 4 默认 8KB
  tomcat:
    relaxed-query-chars: ["[", "]"]
    max-parameter-count: 2048
  max-http-request-header-size: 1028KB

spring:
  application:
    name: likecenter
  cloud:
    nacos:
      discovery:
        # 对应 Go 端 DevServer/Name：Name: likecenter
        server-addr: ${NACOS_ADDR:nacos:8848}

like-api:
  user-auth:
    # Go: likecenter.yaml:6  AccessSecret = <36 字节 UUID 字面量>（⚠️ **值不贴在本仓**：它就是那把公开密钥）
    # ⚠️ 36 字节 UUID，jjwt 要求 ≥32 字节，天然满足（JwtUtil.padToHmacKeySize 对它其实是 no-op）。
    #    必须与**签发方** user-api 完全一致，否则验签必失败 → HTTP 401 + 空 body。
    #
    # 🔴 2026-10-29 · R1·T-1.3（P0 #8）：**默认明文值已去掉**（原为裸字面量）
    #    ⇒ 理由：那个 UUID 是**写在仓里的公开密钥** ⇒ 谁都能用它伪造 JWT
    #    ⇒ 而本模块**只验签、不签发**（签发方是 user-api）
    #    ⇒ ⇒ 一旦部署时忘了覆盖 ⇒ **token 可伪造**。
    #
    # 🔴 2026-10-29（本轮补）：**「yaml 不给默认值」只挡得住一半** ⇒ 另一半必须由**代码守卫**挡
    #    ⇒ 守卫 = `LikeApiProperties#verifyAccessSecret()`（@PostConstruct）
    #      ⇒ 本文件下面的 `access-secret: ${USER_JWT_SECRET}` **没有默认值**
    #      ⇒ ⚠️ **单靠 yaml，缺变量时并不会炸**：Spring 的 `@ConfigurationProperties` 绑定器
    #        遇到**解析不出来**的占位符**不报错**，而是把**占位符原文**当成值绑上去
    #        ⇒ ⇒ 应用**照常启动** ⇒ ⇒ 而那是**仓里公开可知的一串字符**
    #        ⇒ ⇒ 🔴 **比空密钥更危险**（HMAC 密钥公开 ⇒ 谁都能伪造 token）。
    #      ⇒ ⚠️ 同理，**变量存在但值为空串**时，Spring 的 PropertyPlaceholderHelper
    #        把**空串当合法值**（不走默认值、也不报错）⇒ 属性绑成 "" ⇒ 空签名密钥 ⇒ token 可伪造。
    #      ⇒ ⇒ 「未解析占位符」与「空串」**两条都**由 `verifyAccessSecret()` 显式拒
    #        ⇒ ⇒ **缺变量 / 空串 / 占位符原文 三条路都 fail-closed**。
    #    ⇒ 回归网：`LikeApiPropertiesSecretGuardTest#prodLikeStartupWithoutEnvVarFails`
    #      （真 SpringApplication + 真 ConfigData + 只有 application.yml ⇒ 生产等价路径）。
    #    ⚠️ 本地开发 / 测试：本模块测试用 `src/test/resources/application.properties` 提供同名变量
    #      （**test scope 不进产物 jar** ⇒ 生产拿不到默认值）。
    #    ⚠️ Go 侧写的是**字面量**（真源公开在仓里）⇒ 本条属「RAG 更严」的一侧
    #      ⇒ 登记为有意偏离，不是「RAG 抄错了 Go」。
    access-secret: ${USER_JWT_SECRET}
    # Go: likecenter.yaml:7  AccessExpire: 31536000（365 天）
    # ⚠️ 本模块只验签、不签发，与 message-api 一样**不读**该值；
    #   保留是为了让 yaml 与 Go 端 1:1 可对照。
    access-expire: 31536000

# =============================================================================
# rag.protection —— Go「请求保护层」四道中间件 + gRPC client 熔断
# =============================================================================
# ⚠️ **本段不需要任何装配代码就已生效**：2026-10-22 保护层从 message-api 下沉到
#    com.rag.common.protection，而本模块的 scanBasePackages 已含 com.rag.common，
#    ⇒ 四个 Filter、GoStyleProtectionProperties 的注册、gRPC client breaker
#      都是**扫到即生效**的（见 com.rag.common.protection.GoStyleProtectionConfiguration）。
#    下面这些值写出来只是为了运维可读 + 与 Go yaml 可逐字段对照；
#    **删掉整段不会关闭保护层**，只会回落到下方这些默认值，
#    而默认值 == go-zero 的 tag 默认值（fail-safe 方向）。
#
# ⚠️⚠️ 这四项在 Go 的 etc/likecenter.yaml 里 **一个字都没写**，但 Go 侧 **是开启的**：
#   rest/config.go:52      MaxConns     int   `json:",default=10000"`
#   rest/config.go:53      MaxBytes     int64 `json:",default=1048576"`
#   rest/config.go:56      CpuThreshold int64 `json:",default=900,range=[0:1000)"`
#   rest/config.go:12-22   MiddlewaresConf 九个开关 **全部** `json:",default=true"`
# ⇒ 「Go yaml 里没写」≠「Go 没开」（AGENTS.md §3.3.1）。
#
# ⚠️ 拒绝响应是 **裸状态码 + 空 body + 无 Content-Type**（Go 是裸 w.WriteHeader，
#    没有 httpx.Error），刻意不走本模块的 200+envelope 约定。
# ⚠️ 熔断拒绝（503）的 msg 为空，与 Go 的裸响应一致。
# ⚠️ 超限请求返回 413 而不是 401 —— 与 Go engine.go:105-112 同（MaxBytes 在 Authorize 之外）。
#    ⚠️ 但这**不是**因为 @Order(+6)：所有 Filter 都包在 DispatcherServlet 外、
#    HandlerInterceptor 跑在其内，先后由容器结构决定，与 order 数值无关
#    （实测：把 @Order 改成 LOWEST_PRECEDENCE，该断言依然绿）。详见 GoStyleMaxBytesFilter。
rag:
  http:
    # =============================================================================
    # 🔴 Go 风格 form 值上限闸门（2026-10-25 第十四轮 · global 收口域 · X-6 / DRIFT-HOTAPI-030）
    # =============================================================================
    # Go 出处：go-zero rest/httpx/util.go:15  maxFormParamCount = 2048
    #          （数的是**非空值**；util.go:44-45 空值 continue 不计数）
    #          Go 1.25 net/url/url.go:1001  defaultMaxParams = 10000（数的是**段数**）
    #
    # mode = 本域的 form 超限时应该输出什么形状 —— 依据是「Go 侧该 api 有没有注册
    #        httpx.SetErrorHandler」（逐域取证）：
    #   · raw      ⇒ Go 未注册 SetErrorHandler ⇒ http.Error(w, err.Error(), 400)
    #                ⇒ **400 + text/plain; charset=utf-8 + nosniff + Go 原文**
    #   · envelope ⇒ Go 注册了 SetErrorHandler ⇒ 走业务信封
    #                ⇒ **200 + {"code":5001,"msg":"<该域自己的错误码表文案>","data":null}**
    #
    # ⚠️ 本属性**同时**决定两件事（缺一不可）：
    #   ① service/common 的 GoStyleTomcatParameterLimitCustomizer 把 Tomcat 的
    #      maxParameterCount 抬到 10001（= Go 段数上限 +1）⇒ 否则 Tomcat 会先于应用层拒绝，
    #      且拒绝形状是 400 + HTML 错误页（与 Go 不同）；
    #   ② service/common 的 GoStyleFormValueLimitInterceptor 按 Go 的语义判定。
    #
    # ⚠️ 各域 5001 的文案**不一样**（like/comment =「系统内部错误」，
    #    hot/follow/message = "internal server error"）⇒ 共享层**不硬编码文案**：
    #    envelope 模式下共享层只抛异常，由**本域自己的**兜底 handler 查本域的错误码表渲染。
    #
    # 🔴 favorite 域**故意没有这一项**（= off）⇒ global 对该域零影响：
    #    既不改它的容器上限、也不装闸门 ⇒ 行为逐字节不变。
    #    （favorite 不在 global 的写权范围内，AGENTS.md §5.3c）
    go-form-limit:
      # Go 侧 like/api/likecenter.go:48 **注册了** httpx.SetErrorHandler ⇒ **200 + 业务信封**
      #    ⇒ 该域 5001 的文案是「系统内部错误」（不是 "internal server error"）⇒ mode: envelope
      mode: envelope
  protection:
    # Go rest/config.go:52
    max-conns: 10000
    # Go rest/config.go:53（1 MiB）。Go 只看 Content-Length 头，chunked 会绕过 —— 刻意保留。
    max-bytes: 1048576
    cpu-shedding:
      # Go rest/config.go:22 Middlewares.Shedding
      enabled: true
      # Go rest/config.go:56（千分比，900 = 90% CPU）
      cpu-threshold: 900
      # Go 读整机 CPU（Linux /proc/stat）⇒ SYSTEM 对齐
      cpu-source: SYSTEM
    breaker:
      # Go rest/config.go:15 Middlewares.Breaker
      enabled: true
    outbound-deadline:
      # ==========================================================================
      # 🔴 出向 gRPC 客户端硬上界（P2-T04 · G2 lane · 2026-10-31）
      # Go 出处：go-zero@v1.10.2/zrpc/config.go:31 `Timeout int64 json:",default=2000"`
      #   ⇒ 默认 2000ms；本域 Go 侧 service/like/api/etc/likecenter.yaml 的
      #     `LikeRpc:` 段**无显式 Timeout** ⇒ ⇒ 恒 2000ms。
      # ⚠️ 本域**只配参数**：封顶逻辑由共享层 `GoStyleOutboundDeadlineInterceptor`
      #   （`@GrpcGlobalClientInterceptor` ⇒ 装在**每个**出向 devh 调用上）**唯一**承担
      #   ⇒ 域侧不得再造私有副本。**不要**改用空配的 `grpc.client.*.deadline`。
      # env 覆盖：LIKE_API_OUTBOUND_DEADLINE_CAP_MILLIS（Go 的 Timeout 也是域级字段）
      cap-millis: ${LIKE_API_OUTBOUND_DEADLINE_CAP_MILLIS:2000}

grpc:
  client:
    # 对应 Go 端 likecenter.yaml:31-36 的 LikeRpc.Etcd.Key: like.rpc
    # ⚠️ negotiation-type 必须显式写 plaintext：
    #   devh 的 GrpcChannelProperties 默认值是 TLS，不写会静默变 TLS，
    #   而 Go zrpc.MustNewServer 是明文 gRPC（DRIFT-NEW-014）。
    like-rpc:
      address: discovery:///like-rpc
      negotiation-type: plaintext

management:
  endpoints:
    web:
      exposure:
        # 对应 Go 端 DevServer 的 MetricsPath / HealthPath
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always