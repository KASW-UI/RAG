# =============================================================================
# follow-rpc application.yml —— 对应 Go 端 service/follow/rpc/etc/follow.yaml
#
# 本服务是**单 JVM 纯 gRPC 进程**：Go 侧 service/follow/rpc 只有 1 个 main（rpc/follow.go），
# 无 Redis、无 Kafka、无 MQ 进程。配置项按 Go yaml 段落逐条对应。
# =============================================================================

spring:
  application:
    # 对应 Go Name: follow.rpc（服务发现 / OTEL 均按 follow-rpc 注册，见 NacosRegistration）
    name: follow-rpc

  # ============== Postgres ==============
  # 对应 Go Postgres { Host, Port, User, Password, DBName, Mode }
  # ⚠️ Mode 在 Go 里不是 sslmode 的原名：db.go:22 把它拼进 DSN 的 `sslmode=` 位置
  #    （yaml 值 "disable" ⇒ sslmode=disable）。所以它**必须**落到 URL 的 sslmode 参数上，
  #    写成别的参数名会让连接串少一段、行为与 Go 不一致。
  datasource:
    # ⚠️ 连接串里那两段参数都来自 Go DSN（db.go:21-29）的逐字搬运，顺序也一致：
    #      sslmode  ← c.Postgres.Mode（yaml 写 "disable"）
    #      TimeZone  ← Go 硬编码的 Asia/Shanghai
    #    TimeZone 是**会话时区**，直接影响 timestamptz 的读出值；
    #    漏掉它会让 Java 侧读出的时间偏移与 Go 不同（同一行数据、两个墙上时钟）。
    #    ⚠️ 不要改用 spring.jackson.time-zone：那只管 JSON 序列化，不改 PG 会话。
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:first_db}?sslmode=${POSTGRES_SSLMODE:disable}&TimeZone=Asia/Shanghai
    username: ${POSTGRES_USER:admin}
    # ⚠️ **本行无默认值（2026-10-30 按 Go 同形取消 fallback · `S1-USERS-002`）**
    #    Go 侧（`service/follow/rpc/etc/follow.yaml:33`）= `Password: "${POSTGRES_PASSWORD}"` ⇒ **无默认值**：
    #    go-zero `core/conf/config.go:63` 用 `os.ExpandEnv` 展开 ⇒ 它**不认** `${VAR:default}` 语法
    #    ⇒ 未设 env 即展开成**空串** ⇒ 用空口令连库 ⇒ 认证失败 ⇒ **fail-fast**。
    #    RAG 侧此前给这个占位符挂了**明文默认口令** ⇒ 缺变量时**用那个公开口令连上**
    #    ⇒ 与 Go **不同形**（Go 连不上 / RAG 连得上）⇒ ⇒ 那是一条**真漂移** ⇒ 本轮取消。
    #    ⚠️ **残余差异（RAG 更严的一侧）**：Go = 启动成功、**连库时**失败；RAG = **启动即失败**
    #    （Spring 解析不到占位符 ⇒ DataSource bean 创建失败）⇒ ⇒ 失败时刻不同 ⇒ 属有意偏离候选。
    #    ⚠️ 注入侧一字不变：根级 `docker-compose.yaml` 用 `${POSTGRES_PASSWORD:?…}` 强制要求并透传、
    #    `manage.sh` 硬校验 `.env`、`tools/difftest/*` 对拍装置显式 export ⇒ **不打断任何现有流程**。
    #    ⚠️ 其余 7 处（article×2 / comment / favorite / like / message / task）属 G2/G3 面 ⇒ 口径尚未全仓统一。
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 对应 Go db.go:38-39 sqlDB.SetMaxIdleConns(10) / SetMaxOpenConns(100)
      maximum-pool-size: 100
      minimum-idle: 10

  # ============== MyBatis-Plus ==============
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
      default-fetch-size: 100
    global-config:
      db-config:
        # 主键策略：Go 侧 GORM 对整数主键默认 autoIncrement（data_model.go 的 ID uint64 primaryKey
        # 未显式关掉），DDL 用 BIGSERIAL ⇒ 插入时让 PG 序列分配，行为与 Go 一致。
        id-type: AUTO
      banner: false

  # ============== Flyway ==============
  # 对应 Go db.go:42 db.AutoMigrate(&FollowRelation{}, &BlockRelation{})。
  # ⚠️ **独立账本表名**（AGENTS.md §6.3 问题 4）。
  #    `flyway_schema_history` 是 **schema 级**账本，一个 schema 只能有一本账。
  #    follow-rpc / like-rpc / message-rpc / article-rpc 连同一个 first_db、同一个 public schema，
  #    共用默认账本时后启动者会把自己的迁移判为「已应用」而静默跳过 —— 而各域的
  #    V1 版本号直接撞车且内容不同（follow_relation vs like_record vs message_notification）。
  #    改账本表名即可消除病根，**迁移文件名一个字都不用动**。
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 🔴 **baseline-version 必须显式钉 0**（2026-10-25 实测修掉的真缺陷 · global 收口域 X-1）
    #
    # 【现象】本模块与其它 rpc 模块**连同一个库**（first_db / rag_db），
    #         各自用**独立的账本表**（flyway_schema_history_follow）⇒ **先启动的模块已经把 public schema 弄非空**
    #         ⇒ 本模块启动时 Flyway 看到「非空 schema + 没有自己的账本」
    #         ⇒ 因 baseline-on-migrate=true ⇒ **在 V1 处打 baseline 标记**（默认 baseline-version=1）
    #         ⇒ **V1 的 SQL 从未执行** ⇒ `follow_relation` 表永远建不出来
    #         ⇒ 后续依赖它的迁移报 `relation "follow_relation" does not exist` ⇒ **服务起不来**。
    #
    # 【为什么 0 而不是关掉 baseline-on-migrate】
    #         baseline-on-migrate=false 时，非空 schema 且无账本 ⇒ Flyway **直接抛异常退出**
    #         （"Found non-empty schema(s) … but no schema history table"）⇒ 更糟（起不来且无修复路径）。
    #         baseline-version=0 ⇒ baseline 标记打在 version 0 ⇒ **V1 之后全部迁移照常执行**
    #         ⇒ 既能在共享库里安全启动，又不丢任何迁移。
    #
    # 【为什么「全新空库」的测试测不出来】
    #         多数单测用**全新空库** + 只有本模块一个进程 ⇒ schema 是空的 ⇒ baseline 根本不触发
    #         ⇒ V1 正常执行 ⇒ 「测试全绿」与「生产拓扑下起不来」同时成立（§3.3 的经典形态）。
    #         ⇒ 必须显式把 schema 弄成非空 ⇒ 守门见 FollowFlywaySharedSchemaGateTest（真 PG 16 + 真 Flyway 引擎）。
    baseline-version: 0
    locations: classpath:db/migration
    schemas: public
    table: flyway_schema_history_follow

  # ============== Nacos Discovery ==============
  cloud:
    nacos:
      discovery:
        # ⚠️ **必须是 `host` 与 `port` 分开两个变量**（2026-10-24 真启动实测修正）。
        #    原写法 `${NACOS_ADDR:nacos:8848}` 把端口**硬编码在变量默认值里** ⇒
        #    NACOS_PORT 被完全忽略，且 NACOS_ADDR 的语义变成「host:port」，
        #    与 follow-api 的 `${NACOS_ADDR:nacos}:${NACOS_PORT:8848}` **冲突**：
        #    同一份部署环境（只设 NACOS_ADDR=host + NACOS_PORT=port）下，
        #    api 连到 `host:port`、rpc 连到 `host:8848` ⇒ **两个组件连的是两台 Nacos**
        #    ⇒ rpc 注册在 A、api 在 B 找它 ⇒ 恒 "No servers found" ⇒
        #    所有业务码塌成 1015（service busy）。
        #    ⚠️ 这个坑**极难从代码看出来**：两个 yaml 各自都"对"，只有放在一起才冲突。
        #    与 follow-api 保持同一套变量语义后，两端必然指向同一台 Nacos。
        server-addr: ${NACOS_ADDR:nacos}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # 🔴 **必须显式关掉自动注册**（2026-10-29 · DRIFT-FOLLOW-006 落地时实测补上）。
        #
        # 【为什么】`spring-cloud-starter-alibaba-nacos-discovery` 的**自动注册**
        # （NacosAutoServiceRegistration）注册的是 **web 容器端口** ——
        # 而本模块的 web 容器（2026-10-29 起为了给 Actuator 载体才引入）
        # 监听的是 **观测端口 16065**，**不是 gRPC 业务端口 8082**。
        # ⇒ 自动注册一旦生效 ⇒ Nacos 里会出现「follow-rpc → 16065」这条**错端口**实例
        # ⇒ follow-api 按 Nacos 给出的地址连过来 ⇒ 连到一个**只提供 /actuator/** 的 HTTP 端口
        # ⇒ **gRPC 链路直接断**（业务码塌成 1015）。
        #
        # 【本模块的注册是手写的】`bootstrap/NacosRegistration.java` 用
        # `GrpcServerProperties.getPort()`（= gRPC 端口）注册 ⇒ 与 Go 侧
        # `zrpc.MustNewServer` 注册 ListenOn 的语义一致。
        # ⇒ 自动注册必须关掉，否则**同一个服务名下会有两个端口的实例**。
        register-enabled: false

# =============================================================================
# HTTP 观测端口（Actuator 载体）
# =============================================================================
# 🔴 **这是本模块唯一的 HTTP 监听**（2026-10-29 · DRIFT-FOLLOW-006 落地）。
#
# 【Go 出处（真源 · 消费点）】
#   service/follow/rpc/etc/follow.yaml:20-27  DevServer.Port: 16065
#   ⇒ go-zero@v1.10.2/core/service/serviceconf.go:77  devserver.StartAgent(sc.DevServer)
#   ⇒ go-zero@v1.10.2/internal/devserver/server.go:67-75  独立端口 http.ListenAndServe
# ⇒ ⇒ **Go 的观测端口就是 16065** ⇒ RAG 侧取同一个端口（默认 16065），
#      抓取配置只需改**路径**（Go `/metrics` → RAG `/actuator/prometheus`），
#      **端口一字不差**。
#
# ⚠️ **与 gRPC 业务端口严格分离**：本端口只承载 Actuator（无任何业务路由），
#    gRPC 仍是 `grpc.server.port`（8082 / ${FOLLOW_RPC_PORT}）。
#    ⇒ 探针/部署可用 FOLLOW_RPC_MANAGEMENT_PORT 覆盖（探针会自动挑空闲端口）。
server:
  port: ${FOLLOW_RPC_MANAGEMENT_PORT:16065}

# ============== gRPC server（devh）==============
# 对应 Go follow.yaml:2 ListenOn: 0.0.0.0:8082
grpc:
  server:
    # ⚠️ 默认端口**一字不变**（Go follow.yaml:2 `ListenOn: 0.0.0.0:8082`）。
    #    加 env 覆盖是为了与同域 `follow-api` 的 `${FOLLOW_API_PORT:8891}` **策略一致**，
    #    并解除「本机该口已被占 ⇒ 组件无法真启动 / 无法并行起」的死结
    #    （2026-10-28 实测：本机 8082 被一个 34 天前的 `python -m http.server 8082` 占着）。
    #    ⚠️ 改口时**必须同时确认 Nacos 注册地址跟着变** —— devh 用这个端口既监听又注册，
    #    两者不同步 ⇒ follow-api 找到的是旧地址 ⇒ 链路断（业务码塌成 1015）。
    port: ${FOLLOW_RPC_PORT:8082}
    address: 0.0.0.0
    # Go 侧 reflection 仅在 DevMode/TestMode 注册（follow.go:40-42）；
    # Java 侧 devh starter 默认即开启 reflection，此处不额外配置。
  client:
    # 对应 Go follow.yaml:37-41 UserRpc.Etcd.Key: user.rpc → 服务发现名 user-rpc
    # 唯一消费点：logic/helper.go:82 ensureUserExists → UserRpc.GetUser({Uid})
    # ⚠️ **必须是三斜杠 `discovery:///user-rpc`**（2026-10-24 真启动实测修正）。
    #    devh 的 `net.devh.boot.grpc.client.nameresolver.DiscoveryClientResolverFactory#newNameResolver`
    #    判定的是 `uri.getPath()`：**必须非空、长度 > 1、且以 "/" 开头**。
    #      discovery:///user-rpc → authority="" 、path="/user-rpc"  ✅
    #      discovery://user-rpc  → authority="user-rpc"、path=""     ❌ 长度 0，直接抛
    #        IllegalArgumentException: Incorrectly formatted target uri;
    #        expected: 'discovery:[//]/<service-name>'; but was 'discovery://user-rpc'
    #    ⇒ 两斜杠写法**不是「少写一个斜杠」**，它把服务名解析成了 authority、path 留空。
    #    ⚠️ 本仓的 6 个 *-rpc 模块原本全是两斜杠（api 模块反而都是三斜杠）——
    #    之所以没人发现：**测试把地址覆盖成了 static://127.0.0.1:1**
    #    （见 FollowRpcWiringTest 的 @SpringBootTest properties），
    #    生产地址从未被任何测试跑过 ⇒ 「跑绿」与「能启动」无关。
    user-rpc:
      address: discovery:///user-rpc
      enable-keep-alive: true
      keep-alive-time: 30s
      negotiation-type: plaintext

# ============== follow 服务专属配置 ==============
# 对应 Go follow.yaml:43-50 List / Recommend 两段。
# ⚠️ 这里的 4 个 List/Recommend 数值**全部参与业务分支**（默认值 / 截断上限 / 推荐深度 / 扇出上限），
#    不是性能开关 —— 改它们会改变 RPC 的可观察输出。
follow:
  list:
    # Go ListConf.DefaultLimit `json:",default=20"`（yaml 也显式写 20）
    # 作用于 GetFollowList / GetBlockList / GetFollowerList 三个方法
    default-limit: 20
    # Go ListConf.MaxLimit `json:",default=100"` —— limit > MaxLimit 时被截断
    max-limit: 100
  recommend:
    # Go RecommendConf.DefaultLimit `json:",default=20"` —— 只作用于 GetRecommendations
    # ⚠️ 与 list.default-limit 是**两个不同的常量**：Go 侧它们在不同的 struct 里，
    #    值虽然都是 20 但语义独立，改一个不影响另一个。
    default-limit: 20
    # Go RecommendConf.MaxLimit `json:",default=50"` —— ⚠️ 是 50 不是 100
    max-limit: 50
    # Go RecommendConf.MaxDepth `json:",default=3"` —— 推荐展开层数上限，
    #    经 clampRecommendDepth（helper.go:130-138）夹到 [2,5]
    max-depth: 3
    # Go RecommendConf.MaxFanout `json:",default=50"` —— 每层每个源用户的扇出上限，
    #    经 clampFanout（helper.go:140-147）夹到 (0,200]
    max-fanout: 50

# =============================================================================
# 进程形态：rpc 侧（`rag.side: rpc`）
# =============================================================================
# 🔴 **这一行是「共享层 api 侧中间件」的闸门**（2026-10-30 · G1 lane）
#
# 【Go 出处】Go 的 rpc 进程**一个 rest 中间件都没挂**（全部 `zrpc.MustNewServer`）
#   ⇒ ⇒ rpc 侧不存在任何 servlet 过滤器 ⇒ ⇒ RAG 的 rpc 域也**不得**挂 Go 侧没有的中间件。
#
# 【机制】共享层用 `@ConditionalOnApiSide`
#   （= `@ConditionalOnProperty(name="rag.side", havingValue="api", matchIfMissing=true)`）
#   挡住 api 侧那 **13 个类**（11 个带 `@ConditionalOnWebApplication(SERVLET)` ＋
#   `HttpMiddlewareFilter`（无条件 `@Component`）＋ `GoStyleJsonBodyConverterConfig`（`@Configuration`））：
#   `GoStyleCpuSheddingFilter` / `GoStyleMaxConnsFilter` / `GoStyleMaxBytesFilter`
#   / `GoStyleBreakerFilter` + 路由模板 / `GoStyleTraceparentFilter` / `HttpMiddlewareFilter`
#   / `GoStyleFormLimitWebMvcConfig` / `GoStyleFormValueLimitInterceptor`
#   / `GoStyleJsonBodyConverterConfig` / `GoStyleJsonContentTypeAdvice`
#   / `GoStylePathNormalizingAutoConfiguration` / `GoStyleTomcatParameterLimitCustomizer`
#   ⇒ ⇒ 其中**会「拒请求」的只有两个**：`GoStyleCpuSheddingFilter`（CPU 高负载）
#   与 `GoStyleMaxConnsFilter`（连接数超限）⇒ ⇒ 抓取请求可能被自己域的中间件挡掉。
#   ⚠️ **`matchIfMissing=true` ⇒ 默认就是 api 侧** ⇒ ⇒ rpc 域**必须显式写这一行**。
#
# 【⚠️ 本模块与另外两个 rpc 域不同 —— 载体**已经在**】
#   本模块 2026-10-29 落地 `DRIFT-FOLLOW-006` 时就加了 `spring-boot-starter-web`
#   （pom 第 5 段）＋ `server.port: ${FOLLOW_RPC_MANAGEMENT_PORT:16065}`（下面）
#   ⇒ ⇒ **本模块的主上下文就是 servlet web 应用** ⇒ ⇒ 若不写这一行
#   ⇒ ⇒ 那 13 个 api 侧 Bean 会挂到 **16065 的抓取口**上 ⇒ ⇒ 其中
#   ⇒ ⇒ **`GoStyleCpuSheddingFilter` 在 CPU 高负载时会拒掉抓取请求**
#   ⇒ ⇒ 而 Go 侧 rpc 域一个中间件都没挂 ⇒ ⇒ **与 Go 不同形**
#   ⇒ ⇒ ⇒ 即：载体的目的（抓得到 `/actuator/prometheus`）会被自己的中间件挡掉。
#
# ✅ **现状（2026-10-30 · 合并主干后订正）**：共享层的 `ConditionalOnApiSide` **已落库**（`53bc05ec`）
#   ⇒ ⇒ **本行现在真的生效**（原写「本分支基线上尚未落库 ⇒ 死配置」是**分支相对**的说法 ⇒ 叠到主干后已不成立 ⇒ 原值保留备查）
#   ⇒ ⇒ **本行是必做项**：该注解默认值是 api（`matchIfMissing=true`）⇒ ⇒ rpc 域**必须显式写这一行**
#   ⇒ ⇒ 本模块**已是 servlet 形态**（`management.server.port: 16065`）⇒ ⇒ 不写它 ⇒ ⇒ 那 13 个 api 侧 web 类就挂到抓取口上
#        （其中 `GoStyleCpuSheddingFilter` 在 CPU 高负载时会**拒掉抓取请求** ⇒ 而 Go 侧 rpc 域一个中间件都没挂 ⇒ ⇒ 与 Go 不同形）。
rag:
  side: rpc
  protection:
    # ==========================================================================
    # 🔴 出向 gRPC 客户端硬上界（P2-T04 · G1 lane · 2026-10-31）
    # Go 出处：go-zero@v1.10.2/zrpc/config.go:31 `Timeout int64 json:",default=2000"`
    #   ⇒ 默认 2000ms；本域 Go 侧 service/follow/rpc/etc/follow.yaml:37-41 的
    #     `UserRpc:` 段**无显式 Timeout** ⇒ ⇒ 恒 2000ms。
    # ⚠️ 本域**只配参数**：封顶逻辑由共享层 `GoStyleOutboundDeadlineInterceptor`
    #   （`@GrpcGlobalClientInterceptor` ⇒ 装在**每个**出向 devh 调用上）**唯一**承担
    #   ⇒ 域侧不得再造私有副本。**不要**改用空配的 `grpc.client.*.deadline`。
    # env 覆盖：FOLLOW_RPC_OUTBOUND_DEADLINE_CAP_MILLIS（Go 的 Timeout 也是域级字段）
    outbound-deadline:
      cap-millis: ${FOLLOW_RPC_OUTBOUND_DEADLINE_CAP_MILLIS:2000}

management:
  endpoints:
    web:
      exposure:
        # ⚠️ **这行以前是死配置**（2026-10-29 才真正生效，见下）：
        #    `spring-boot-starter-actuator` 只给 endpoint 与自动配置，**不给 servlet 容器**
        #    ⇒ classpath 上没有 jakarta.servlet.Servlet ⇒ WebApplicationType 推导出 NONE
        #    ⇒ 没有 web server ⇒ 这一族配置**不加载**（不是报错，是静默无效）。
        #    ⇒ 2026-10-29 补 `spring-boot-starter-web`（pom 第 5 段）后才有载体。
        #
        # ⚠️ **与 Go 的暴露面差异**（twoStage.md §10 定级 · 已登记）：
        #    Go  : DevServer 的 `MetricsPath: /metrics` + `HealthPath: /healthz`（follow.yaml:20-27）
        #    RAG : `/actuator/prometheus` + `/actuator/health`（Actuator 的固定前缀）
        #    ⇒ **路径不同、端口相同（都是 16065）** ⇒ 抓取配置要改路径，不是改端口。
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    # ⚠️ **刻意不加 `tags.application`**（2026-10-24 双侧活体对拍实测修正）。
    #
    # Go 侧 5 个指标的 Subsystem 都是 "follow_rpc"，而 Prometheus 导出时
    # **Subsystem 直接变成指标名前缀** ⇒ Go 的指标名本身就是 `follow_rpc_request_total`。
    # RAG 侧的 meter 名**已带同一个前缀** ⇒ 再挂 application="follow-rpc" 是重复信息，
    # 且会让同一份 PromQL 在两侧得到不同聚合结果。
    # 详见 docs/DRIFT/follow/rpc.md（DRIFT-FOLLOW-007）。
  prometheus:
    metrics:
      export:
        enabled: true

otel:
  service:
    name: follow-rpc
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:jaeger:4317}
  traces:
    exporter: otlp
    sampler: parentbased_always_on

logging:
  level:
    root: INFO
    com.rag: INFO
    io.grpc: WARN

# ===== observability（对齐 Go service/common/observability）=====
# Go follow.go:34 observability.DisableNativeRpcTimeout(&c.RpcServerConf)
#            + follow.go:44 s.AddUnaryInterceptors(observability.NewUnaryServerInterceptor(...))
# Go yaml 未配 Timeout ⇒ go-zero zrpc/config.go 的 default=2000ms。
observability:
  rpc-timeout: 2s