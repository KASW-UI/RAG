# =============================================================================
# message-rpc application.yml —— 对应 Go 端 service/message/rpc/etc/message.yaml
# =============================================================================
# 1:1 迁移原则：保留 Go yaml 同名字段；Java 端用 Spring / devh starter /
# Spring Cloud Alibaba 自身字段名表达相同语义。
# =============================================================================

spring:
  application:
    # 对应 Go Name: message.rpc —— 服务发现 / Nacos / OTEL 都按这个名注册
    name: message-rpc

  # ============== Postgres ==============
  # 对应 Go Postgres.*：Host / Port / User / Password / DBName / Mode
  datasource:
    # ⚠️ 两个连接参数不是「锦上添花」，是逐字对齐 Go 的 DSN（2026-10-23 实测确认）：
    #   Go  service/message/rpc/internal/model/db.go:21-29
    #       host=%s user=%s password=%s dbname=%s port=%s sslmode=%s TimeZone=Asia/Shanghai
    #       ↑ 等于 etc/message.yaml:34 的 Mode: "disable" ⇒ sslmode=disable
    #
    # ① sslmode=disable —— Go **永不尝试 TLS**；URL 里不写时 pgjdbc 用文档化默认值
    #    `prefer`（先试 TLS 再回落明文）。对当前没开 TLS 的容器两边都是明文，
    #    但 PG 一旦启用 TLS：Go 连不上，RAG 会自动升级成加密连接。
    # ② options=-c TimeZone=Asia/Shanghai —— Go 把**会话时区**钉死；pgjdbc 没有 TimeZone
    #    这个连接属性（PGProperty 里查无此项，实测），只能用 options 透传。
    #    ⚠️ 本域时间列当前是 `TIMESTAMP`（无时区），会话时区直接决定读出来的是哪一刻。
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:first_db}?sslmode=disable&options=-c%20TimeZone%3DAsia%2FShanghai
    username: ${POSTGRES_USER:admin}
    # 🔴 口令**不加默认值**（2026-10-30 · 与 Go 逐字同形）
    #
    # Go 出处：service/message/rpc/etc/message.yaml:32
    #     Password: "${POSTGRES_PASSWORD}"        ← 裸占位符，**无默认值**
    # Go 侧加载语义：go-zero@v1.10.2/core/conf/config.go:63
    #     return loader([]byte(os.ExpandEnv(string(content))), v)
    #   ⇒ os.ExpandEnv **不认** `${VAR:default}` 语法 ⇒ 它把 `POSTGRES_PASSWORD:password`
    #     整串当成变量名去查 ⇒ 查不到 ⇒ 落成**空串** ⇒ Go 侧缺变量 = **空口令** = 连库失败。
    #
    # 为什么取消兜底：Spring 的 `${VAR:default}` 语义会让**缺变量时用默认口令连上去**
    #   ⇒ RAG 比 Go **松** ⇒ 真漂移（不是「更严的有意偏离」）⇒ 不需要为「保留兜底」签字。
    #
    # ⚠️ 残余差异（**失败时刻**不同，由合并收口执行者统一登记为有意偏离候选）：
    #   Go = 启动成功、**连库时**失败；RAG = **启动即失败**（占位符解析不到 ⇒ DataSource bean 创建失败）
    #   ⇒ 属「RAG 更严的一侧」⇒ 按 P0 #8 同款口径登记。
    #
    # ⚠️ 装置侧**不需要**改：tools/difftest/run.sh:196 显式 export POSTGRES_PASSWORD
    #   ＋ 根级 docker-compose.yaml:15 是 `${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}`（强制）
    #   ＋ manage.sh 硬校验 .env ⇒ ⇒ 取消兜底不影响任何对拍装置。
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 100     # 对应 Go sqlDB.SetMaxOpenConns(100)
      minimum-idle: 10           # 对应 Go sqlDB.SetMaxIdleConns(10)

  # ============== MyBatis-Plus（strict HUMAN_ONLY 取代 JPA） ==============
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true   # snake_case 列名 → camelCase 字段
      default-fetch-size: 100
    global-config:
      db-config:
        # 表名 / 主键策略在 Entity @TableName / @TableId 上显式钉死，不靠全局策略
        id-type: ASSIGN_ID                 # 雪花 ID（与 Go 端 snowflake.GetID 等价）
      banner: false

  # 关闭 JPA ddl-auto（HUMAN_ONLY 严格 MyBatis-Plus，不引 spring-data-jpa）
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  # ============== Flyway ==============
  # ⚠️ **独立账本表名**（2026-10-23，AGENTS.md §6.3 问题 4）。
  #    `flyway_schema_history` 是 **schema 级**账本，一个 schema 只能有一本账。
  #    message-rpc / like-rpc / article-rpc 连同一个 first_db、同一个 public schema，
  #    共用默认账本时后启动者会把自己的迁移判为「已应用」而静默跳过 ——
  #    message 与 like 的 V1-V3 版本号直接撞车且内容不同。
  #    改账本表名即可消除病根，**迁移文件名一个字都不用动**。
  #    ⛔ 不要用 validate-on-migrate=false / out-of-order=true 绕道：
  #       已用真 jar + 真 PG 16 实测证伪（会让账本更脏），
  #       见 tools/difftest/exp-drift015-flyway-flags.sh。
  # ⚠️ 上面的声明只保证**配置层**不撞；「Flyway 运行时真的按它建表」
  #    尚未在真 PG 上双模块对启动验证过，按 §3.3 记为 UNKNOWN。
  flyway:
    enabled: true
    baseline-on-migrate: true
    # ⚠️⚠️ **baseline-version 必须显式钉 0**（2026-10-24 实测修掉的真缺陷）
    #
    # 【现象】message-rpc 与 user-rpc / admin-rpc **连同一个库**（rag_db / first_db），
    #         而 user-rpc / admin-rpc 用的是 SchemaInitializer 幂等重放（无账本），
    #         它们先启动 ⇒ **public schema 已经非空**（users_user / admin_admin …）。
    #         ⇒ message-rpc 启动时 Flyway 看到「非空 schema + 没有自己的账本」
    #         ⇒ 因 baseline-on-migrate=true ⇒ **在 V1 处打 baseline 标记**
    #         ⇒ **V1 的 SQL 从未执行** ⇒ `message_notification` 表永远建不出来
    #         ⇒ V5（ALTER 那 8 个时间列）报 `relation "message_notification" does not exist`
    #         ⇒ **服务起不来**。
    #
    # 【为什么 Testcontainers 永远测不出来】
    #         `MessageTransactionWiringTest` 每个用例都是**全新空库** + 只有 message-rpc 一个进程
    #         ⇒ schema 是空的 ⇒ baseline 根本不触发 ⇒ V1 正常执行。
    #         ⇒ 「测试全绿」与「生产拓扑下根本起不来」同时成立（§3.3 的经典形态）。
    #
    # 【证据】真 PG 16 + 真 jar 实测（2026-10-24，difftest 并行实例）：
    #         非空 schema + baseline-on-migrate=true（默认 baseline-version=1）
    #           ⇒ 账本首行 = `<< Flyway Baseline >>`（version 1）
    #           ⇒ message_notification **不存在** ⇒ V5 失败 ⇒ 启动失败
    #         非空 schema + **baseline-version=0**
    #           ⇒ 账本 = V1..V5 **五条全部真实执行**
    #           ⇒ message_notification 建出 ⇒ `Started MessageRpcApplication in 4.09 seconds`
    #
    # 【为什么 0 而不是关掉 baseline-on-migrate】
    #         baseline-on-migrate=false 时，非空 schema 且无账本 ⇒ Flyway **直接抛异常退出**
    #         （"Found non-empty schema(s) … but no schema history table"）⇒ 更糟（起不来且无修复路径）。
    #         baseline-version=0 ⇒ baseline 标记打在 version 0 ⇒ **V1 之后全部迁移照常执行**
    #         ⇒ 既能在共享库里安全启动，又不丢任何迁移。
    #
    # 【影响面】同一套写法（独立账本 + baseline-on-migrate=true + 共享 schema）
    #         在 **like-rpc** 上**同样成立**（它的迁移从 V1 起步 ⇒ V1 会被顶掉
    #         ⇒ like_record 表建不出来）⇒ 见 DRIFT 台的 `DRIFT-MSG-V-029`。
    #         ⚠️ **article-rpc 不受影响**：它的迁移从 V8 起步，没有 V1 可跳
    #         ⇒ baseline 落在 version 1 ⇒ V8..V10 照常执行（2026-10-24 实测更正）。
    baseline-version: 0
    locations: classpath:db/migration
    schemas: public
    table: flyway_schema_history_message

  # ============== Nacos Discovery ==============
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        # 注册到 Nacos 的 group 与 message-api 保持一致
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # 🔴 **必须显式关掉自动注册**（2026-10-30 · 补指标抓取载体时落地）。
        #
        # 【为什么】`spring-cloud-starter-alibaba-nacos-discovery` 的**自动注册**
        # （`NacosAutoServiceRegistration`）继承自
        # `org.springframework.cloud.client.serviceregistry.AbstractAutoServiceRegistration`
        # —— 它 `implements ApplicationListener<WebServerInitializedEvent>`
        # ⇒ **注册的是 web 容器端口**（实测 class 字节码：`onApplicationEvent(WebServerInitializedEvent)`）。
        # ⇒ 而本模块的 web 容器（2026-10-30 起为了给 Actuator 载体才引入）
        # 监听的是 **观测端口 16067**，**不是 gRPC 业务端口 8082**。
        # ⇒ 自动注册一旦生效 ⇒ Nacos 里会出现「message-rpc → 16067」这条**错端口**实例
        # ⇒ 调用方（message-api 等）按 Nacos 给出的地址连过来
        # ⇒ 连到一个**只提供 /actuator/** 的 HTTP 端口 ⇒ **gRPC 链路直接断**（业务码塌成 1015）。
        #
        # 【本模块的注册是手写的】`bootstrap/NacosRegistration.java` 用
        # `GrpcServerProperties.getPort()`（= gRPC 端口）注册 ⇒ 与 Go 侧
        # `zrpc.MustNewServer` 注册 `ListenOn` 的语义一致。
        # ⇒ 自动注册必须关掉，否则**同一个服务名下会有两个端口的实例**。
        #
        # 同款见 service/follow/follow-rpc/src/main/resources/application.yml:112。
        register-enabled: false

# =============================================================================
# HTTP 观测端口（Actuator 载体）
# =============================================================================
# 🔴 **这是本模块唯一的 HTTP 监听**（2026-10-30 · 指标抓取载体落地）。
#
# 【Go 出处（真源 · 消费点）】
#   service/message/rpc/etc/message.yaml:19-26  DevServer.Port: 16067
#   ⇒ go-zero@v1.10.2/zrpc/config.go:39  `RpcServerConf struct { service.ServiceConf ... }`
#      （rpc 侧内嵌 ⇒ 也有 DevServer）
#   ⇒ ⇒ go-zero@v1.10.2/zrpc/server.go:63  `if err = c.SetUp(); err != nil {`
#   ⇒ ⇒ go-zero@v1.10.2/core/service/serviceconf.go:77  `devserver.StartAgent(sc.DevServer)`
#   ⇒ ⇒ go-zero@v1.10.2/internal/devserver/server.go:73  **独立端口** `http.ListenAndServe`
# ⇒ ⇒ **Go 的观测端口就是 16067** ⇒ RAG 侧取同一个端口（默认 16067），
#      抓取配置只需改**路径**（Go `/metrics` → RAG `/actuator/prometheus`），
#      **端口一字不差**。
#
# ⚠️ **与 gRPC 业务端口严格分离**：本端口只承载 Actuator（**无任何业务路由**），
#    gRPC 仍是 `grpc.server.port`（8082）。
#    ⇒ 探针/部署可用 MESSAGE_RPC_MANAGEMENT_PORT 覆盖（并行起时换口）。
#
# ⚠️ **端口冲突登记**：Go 侧 `message-rpc` 的 16067 与 `hot-api` 的 16067 **撞**
#    （Go 自己就这样）⇒ 同机部署靠 env 覆盖 ⇒ 与 follow-rpc 同款做法。
server:
  port: ${MESSAGE_RPC_MANAGEMENT_PORT:16067}

# ============== 进程形态标记：rpc 侧（2026-10-30 · 合并收口执行者派工）==============
# 🔴 **本模块是 rpc 形态** ⇒ 观测口上**不许挂 api 侧那套 rest 中间件**
#
# Go 出处（逐字对照）：Go 的 rpc 侧**一个 rest 中间件都没挂** ——
#   service/message/rpc/message.go 走 zrpc.MustNewServer(...) ⇒ 全程 **zrpc** 栈
#   ⇒ zrpc 的服务端拦截器链（trace / recover / stat / prometheus / breaker / shedding）
#   是 **gRPC interceptor**，**不是** net/http 的 rest middleware。
#   ⇒ Go 的 rpc 进程上**不存在** maxConns / maxBytes / cpuShedding / breaker 这四层 HTTP 保护。
#
# 为什么需要这一行（本模块补 servlet 容器 ⇒ 共享层的 web 侧自动配置会在 rpc 进程**首次激活**）：
#   共享层 service/common/src/main/java/com/rag/common/http/GoStylePathNormalizingAutoConfiguration.java:52
#     与 GoStyleJsonContentTypeAdvice.java:95 都带
#     @ConditionalOnWebApplication(type = SERVLET) ⇒ **只要有 servlet 容器就会注册**。
#   共享层用 `rag.side` 区分形态（见 G4 的共享层落码）：
#     @ConditionalOnProperty(name = "rag.side", havingValue = "api", matchIfMissing = true)
#   ⇒ 默认（matchIfMissing=true）= **api 形态** ⇒ ⇒ **rpc 模块必须显式写 `rag.side: rpc`**，
#     否则观测口上会挂着 Go 侧根本不存在的 rest 中间件。
#
# ⚠️ 本行**不是**「配置里写了就算」：运行期绑定 + 「请求路径上的 api 侧中间件不在容器里」
#   由本模块的 MessageRpcMetricsCarrierGateTest 断言（真 fat jar + 真 /actuator/beans 清单）。
rag:
  side: rpc
  protection:
    outbound-deadline:
      # ==========================================================================
      # 🔴 出向 gRPC 客户端硬上界（P2-T04 · G2 lane · 2026-10-31）
      # Go 出处：go-zero@v1.10.2/zrpc/config.go:31 `Timeout int64 json:",default=2000"`
      #   ⇒ 默认 2000ms；本域 Go 侧 service/message/rpc/etc/message.yaml 的
      #     `UserRpc:` / `AdminRpc:` 段**无显式 Timeout** ⇒ ⇒ 恒 2000ms。
      # ⚠️ 本域**只配参数**：封顶逻辑由共享层 `GoStyleOutboundDeadlineInterceptor`
      #   （`@GrpcGlobalClientInterceptor` ⇒ 装在**每个**出向 devh 调用上）**唯一**承担
      #   ⇒ 域侧不得再造私有副本。**不要**改用空配的 `grpc.client.*.deadline`。
      # env 覆盖：MESSAGE_RPC_OUTBOUND_DEADLINE_CAP_MILLIS（Go 的 Timeout 也是域级字段）
      cap-millis: ${MESSAGE_RPC_OUTBOUND_DEADLINE_CAP_MILLIS:2000}

# ============== gRPC server（devh） ==============
# 对应 Go ListenOn: 0.0.0.0:8082
grpc:
  server:
    port: 8082
    address: 0.0.0.0
    # 🔴 DRIFT-MSG-V-015（2026-10-23 修）
    # ⚠️ 原来的注释写「Go 端 reflection 在 DevMode/TestMode 启用，Java 端由 devh starter
    #    默认注册 reflection」—— **这句是错的**：它把「devh 默认 true」写成了「与 Go 一致」。
    #
    # Go 出处（message.go:40-42）：
    #     if c.Mode == service.DevMode || c.Mode == service.TestMode { reflection.Register(grpcServer) }
    # 消费点判定：Config 内嵌 zrpc.RpcServerConf，其 Mode 字段带
    #   `json:",default=pro,options=dev|test|rt|pre|pro"`（go-zero@v1.10.2
    #   core/service/serviceconf.go:35），而 etc/message.yaml **没有配 Mode**
    #   ⇒ 取默认值 "pro" ⇒ 分支不成立 ⇒ **真源生产形态不暴露 reflection**。
    #
    # devh 的 GrpcServerProperties 默认 reflectionServiceEnabled = true
    # （spring-configuration-metadata.json 实测 defaultValue=True）
    # ⇒ 不显式关掉的话，RAG 会比真源多暴露一整个反射面：
    #    `grpcurl -plaintext localhost:8082 list` 能列出全部 9 个方法并下载 proto 描述符。
    # 本模块**不配** DevMode/TestMode 切换（Go 侧也没有对应配置项），
    # 因此生产等价物就是关掉；需要本地调试时用 profile 临时打开。
    reflection-service-enabled: false

  # ============== gRPC client：user-rpc / admin-rpc（被调） ==============
  # 对应 Go UserRpc: zrpc.RpcClientConf{ Etcd: { Hosts: [...], Key: "user.rpc" } }
  # 与 Go AdminRpc: zrpc.RpcClientConf{ Etcd: { Hosts: [...], Key: "admin.rpc" } }
  # Java 端 devh grpc-client-spring-boot-starter + Nacos discovery：用 service discovery
  # 解析 "user-rpc" / "admin-rpc"，跟 Go etcd Key 寻址等价。
  client:
    # 🔴 地址必须是**三斜杠**（`discovery:///user-rpc`），不是两斜杠。
    #
    # 判据出处（devh 3.1.0.RELEASE）：
    #   net/devh/boot/grpc/client/nameresolver/DiscoveryClientResolverFactory.java
    #   的 newNameResolver —— 它取 targetUri.getPath()，
    #   要求**非 null、长度 > 1、以 "/" 开头**。
    #   ⇒ `discovery://user-rpc` 解析出 path=""（长度 0）⇒ 不合格
    #   ⇒ 抛 IllegalArgumentException: Incorrectly formatted target uri;
    #      expected: 'discovery:[//]/<service-name>'
    #   ⇒ **这个检查发生在任何网络调用之前** ⇒ 与 Nacos 在不在线无关
    #   ⇒ grpcClientBeanPostProcessor 先炸 ⇒ **连 Flyway 都跑不到** ⇒ 真 fat jar 起不来。
    #
    # ⚠️ 三斜杠**不改变服务发现名**：devh 取 path.substring(1) = "user-rpc"
    #    ⇒ 仍是 Nacos 上的服务名 `user-rpc`（与 spring.application.name 对应）。
    #    ⚠️ 这不是「与 Go 对齐」—— 两侧注册中心本来就不同（Go 用 etcd key `user.rpc`，
    #       那是**已签字的有意偏离**）；本条修的是「RAG 侧写法非法导致起不来」。
    user-rpc:
      address: discovery:///user-rpc
      enable-keep-alive: true
      keep-alive-time: 30s
      negotiation-type: plaintext
    admin-rpc:
      # 🔴 同上：三斜杠。devh 取 path.substring(1) = "admin-rpc"
      #    ⇒ 服务名不变（users 域确有 admin-rpc 这个独立进程）。
      address: discovery:///admin-rpc
      enable-keep-alive: true
      keep-alive-time: 30s
      negotiation-type: plaintext

# ============== message 服务专属配置 ==============
# 对应 Go List { DefaultLimit: 20, MaxLimit: 100 } / Broadcast { PageSize: 200 }
message:
  list:
    default-limit: 20
    max-limit: 100
  broadcast:
    page-size: 200

# ============== Actuator / Metrics ==============
# ⚠️ **这一族配置在 2026-10-30 之前是死配置**（AGENTS.md §3.3 的典型形态）：
#    `spring-boot-starter-actuator` 只给 endpoint + 自动配置、**不给 servlet 容器**
#    ⇒ classpath 上没有 `jakarta.servlet.Servlet` ⇒ `WebApplicationType=NONE`
#    ⇒ 下面这一族**根本不加载**（**不报错，是静默无效**）
#    ⇒ **指标注册了、抓不到**。
#    ⇒ 2026-10-30 补 `spring-boot-starter-web`（pom 第 5 段）后才真正有载体。
management:
  endpoints:
    web:
      exposure:
        # ⚠️ **与 Go 的暴露面差异**（twoStage.md §10 定级 · 已登记为残余差异，不修）：
        #    Go  : DevServer 的 `MetricsPath: /metrics` + `HealthPath: /healthz`
        #          （service/message/rpc/etc/message.yaml:23-24）
        #    RAG : `/actuator/prometheus` + `/actuator/health`（Actuator 的固定前缀）
        #    ⇒ **路径不同、端口相同（都是 16067）** ⇒ 抓取配置**改路径不改端口**。
        #    ⇒ 照 follow-rpc 已登记的口径（docs/DRIFT/follow/rpc.md 的「残余差异登记」第 2 条）
        #       ⇒ **不新造一条偏离登记**。
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  # ⚠️ **刻意不加 `tags.application`**（2026-10-30 · 与 Go 对照后移除）。
  #
  # 【为什么原来的 `application: message-rpc` 是错的】
  #   原注释写「与 Go prometheus 子系统名对齐：message_rpc_*」—— **这句推理不成立**：
  #   指标名的前缀来自 **meter 名**，不是来自这个 tag。
  #   Go 侧 `service/message/rpc/internal/metrics/metrics.go:13-14`
  #     `prometheus.NewCounterVec(prometheus.CounterOpts{Subsystem: "message_rpc", Name: "request_total", ...})`
  #   ⇒ Prometheus 导出时 Subsystem **直接变成指标名前缀** ⇒ Go 的指标名本身就是
  #     `message_rpc_request_total`，**Go 侧没有任何 `application` 标签**。
  #   RAG 侧 meter 名**已经带同一个前缀**
  #   （`service/message/message-rpc/src/main/java/com/rag/message/message/rpc/metrics/MessageMetrics.java:45`
  #     = `"message_rpc_request_total"`）
  #   ⇒ 再挂 `application="message-rpc"` ⇒ **多一个 Go 没有的标签**
  #     ⇒ 同一份 PromQL 在两侧**聚合结果不同**。
  #
  # 【先例】follow 域同款已修（`DRIFT-FOLLOW-007`，用户 2026-10-27 拍板）
  #   ⇒ service/follow/follow-rpc/src/main/resources/application.yml:213-224 同款说明。
  #
  # 【本仓无任何消费方】`prometheus/settings.yml` 现有 job 只有 `user-api` / `prometheus`
  #   ⇒ 全仓零处引用 `application="message-rpc"` ⇒ 移除**不影响任何现有抓取配置**。
  prometheus:
    metrics:
      export:
        enabled: true

# ============== OpenTelemetry OTLP（与 Go Telemetry 字段对齐） ==============
otel:
  service:
    name: message-rpc           # 对应 Go Telemetry.Name: message-rpc
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:jaeger:4317}
  traces:
    exporter: otlp
    sampler: parentbased_always_on   # 对应 Go Sampler: 1.0

logging:
  level:
    root: INFO
    com.rag: INFO
    io.grpc: WARN
# ===== observability（对齐 Go service/message/message/rpc）=====
# 取值依据同 user-rpc：Go yaml 未配 Timeout → go-zero `zrpc/config.go:46` 默认 2000ms。
observability:
  rpc-timeout: 2s
