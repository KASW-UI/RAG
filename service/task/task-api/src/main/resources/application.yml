# =============================================================================
# task-api application.yml —— 对应 Go 端 service/task/api/etc/task.yaml
#
# 字段重映射：
#   Name: task-api / Host: 0.0.0.0 / Port: 18886 → spring.application.name / server.*
#   TaskRpc{Target, NonBlock}                      → grpc.client.task-rpc.*
#   Telemetry{Name, Endpoint, Sampler}             → otel.*
#   Auth{AccessSecret, AccessExpire}               → **不迁移**（见下方说明）
#
# ⚠️ task.yaml 有一段 Telemetry，而 internal/config/config.go 的 Config 结构体
#    **没有** Telemetry 字段（只有 RestConf + TaskRpc + Auth）。即该段在 Go 侧
#    没有任何消费点。Java 侧仍然落 otel.*，因为它是「观测配置」而非 wire 契约，
#    落它不改变任何客户端可见行为；不落则会丢掉 Go 想表达的采样意图。
# =============================================================================

spring:
  application:
    name: task-api

  # ============== multipart 关掉（本服务不支持 multipart）==============
  # ⚠️⚠️ 属性名是 `spring.servlet.multipart.enabled`，**没有 `mvc.`**。
  #    Boot 4 的 MultipartAutoConfiguration 上是
  #      @ConditionalOnBooleanProperty(name = "spring.servlet.multipart.enabled", matchIfMissing = true)
  #    （在 spring-boot-servlet-4.0.8.jar 里）⇒ 写成 `spring.mvc.servlet.multipart.enabled`
  #    是**静默失效**的：属性没人读，开关根本没关上。
  #    ⚠️ 上一轮台账（DRIFT-TASK-API-003）记的就是那个错名字 ⇒ 当时那句
  #    「已实测排除 Spring 侧」是**假阴性**（探针用的就是错名字，一直是通的）。
  #
  # 为什么关：Go 侧 task-api **没有 multipart 概念**——
  #   · service/task/api/internal/handler/routes.go:15-25 只有一条路由；
  #   · gettaskhandler.go:19-21 是裸 `json.NewDecoder(r.Body)`，
  #     **不读任何 form part**，multipart body 到它那儿就是一段 JSON 文本，
  #     解析失败 ⇒ 400。
  # ⇒ Spring 侧也不该让 multipart resolver 先把 body 吃掉
  #   （DispatcherServlet 的 multipart resolver 调 getParts() 消费 body），
  #   否则 body 到 handler 时已被消费 ⇒ 报「Required request body is missing」。
  # 关掉之后 multipart body 原样流给 Jackson ⇒ 与 Go 侧同样按 JSON 解析 ⇒ 同样的 400。
  servlet:
    multipart:
      enabled: false

  # ============== Nacos 服务发现 ==============
  # Go 侧 task-api **不走服务发现**（etc/task.yaml 用 Target 直连，见下方 grpc 段）。
  # 这里保留 Nacos 配置是为了「切到 discovery:///task-rpc 时不必改代码/依赖」。
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}

# =============================================================================
# HTTP server
# =============================================================================
# 端口：18886 = Go 的**真实取值**（两处一致）
#   · Go service/task/api/etc/task.yaml:3   Port: 18886
#   · Go manage.sh:842                      -p 18886:18886
#
# ⚠️ 本行 2026-10-23 从 18809 改为 18886（DRIFT-TASK-API-001）。原值 18809 来自
#    Infrastructure.md:89 的「端口号段预占表」，那份表自己写明
#    「Java 版只是先按这个号段预占，**等具体域实装时再校验**」（Infrastructure.md:91）
#    —— task 域现已实装，就是那个校验点。
#    且 Infrastructure.md 的 18809 与 Go 的真实值 18886 **对不上**，
#    同一份文档 §3 对 hot 写的 18897 同样与 Go 的 8893 对不上（该表是照 18889/18891/18893
#    的等差序列**推算**出来的，不是从 Go manage.sh 抄的）。
#    本仓已实装的域一律用 Go 原值，task 不应例外：
#       article-api 8889 = Go 8889   comment-api 8888 = Go 8888
#       message-api 8892 = Go 8892   like-api 18887 = Go 18887
#    （like-api 尤其关键：Infrastructure.md 给的是 18801，实装时采用了 Go 的 18887。）
#    原值仍可用环境变量传回：TASK_API_PORT=18809。
server:
  port: ${TASK_API_PORT:18886}
  address: 0.0.0.0
  servlet:
    context-path: /
  # ⚠️ 容器三旋钮：与 Go 对齐（Go 出处 + 实测 ⇒ docs/DRIFT/hot/api.md 的 DRIFT-HOTAPI-021/022/023；
  #    守门 ⇒ tools/difftest/check-tomcat-limits.py）
  #    ① relaxed-query-chars：Go 的 net/http 不校验 query 里的 [ ]，且 go-zero httpx.GetFormValues
  #       明确支持方括号数组记法；Tomcat 默认拒绝 ⇒ 400 + HTML 错误页（不是业务信封）
  #    ② max-parameter-count：Go = go-zero httpx/util.go:15 maxFormParamCount=2048（应用层判）；
  #       Boot 4 默认 1000 ⇒ Tomcat 先拒，RAG 自己实现的 2048 判据在 GET query 上不可达
  #    ③ max-http-request-header-size：Go 的**真实**上限 = DefaultMaxHeaderBytes(1<<20)
  #       + 4096（net/http/server.go:941 `return int64(s.maxHeaderBytes()) + 4096 // bufio slop`）
  #       ⇒ 1 MiB + 4 KiB = **1028KB**；Boot 4 默认 8KB
  tomcat:
    relaxed-query-chars: ["[", "]"]
    max-parameter-count: 2048
  max-http-request-header-size: 1028KB

# =============================================================================
# gRPC client（连 task-rpc）
# =============================================================================
# ⚠️⚠️ 下游寻址：**默认保持 Go 的直连**，这是与 hot/message/like/api 的唯一分歧点。
#    Go  etc/task.yaml:5-7   TaskRpc{Target: 127.0.0.1:9005, NonBlock: true}
#        —— 硬编码 localhost，**没有 Etcd 段**（对比 task/rpc/etc/task.yaml:3-6 有
#           Etcd.Key: task.rpc）。即 Go 的 api 与 rpc 是**同机部署 + 直连**。
#    本仓其余模块一律 discovery:///xxx-rpc，但那些模块的 Go 侧**也有 Etcd 段**
#    （寻址方式本来就不同），照搬过来反而是漂移。
#    ⇒ 这里默认 127.0.0.1:9005（对齐 Go），并保留环境变量口：
#         TASK_RPC_ADDRESS=discovery:///task-rpc   ← 切服务发现只改环境变量
#    ⚠️ NonBlock（L4）：go-zero 的「非阻塞拨号」是连接建立策略，grpc-java 无对应概念，
#       且不进入 wire 契约 ⇒ 不迁移。
#
# ⚠️ negotiation-type 不能省（hot-api 的 DRIFT-NEW-014）：devh 的
#    GrpcChannelProperties 默认值是 TLS，不写会静默发 TLS ClientHello，
#    而 Go 侧 zrpc.MustNewClient 是明文 gRPC。
# ⚠️ 这里**没有** default-deadline 是刻意的：devh starter 不提供默认 deadline，
#    Go 侧的 2s 来自 zrpc.RpcClientConf.Timeout 的 struct tag 默认值，
#    由 client/TaskRpcClient#withDeadline 显式施加（min(2s, 请求剩余预算)）。
grpc:
  client:
    task-rpc:
      address: ${TASK_RPC_ADDRESS:127.0.0.1:9005}
      negotiation-type: plaintext
      enable-keep-alive: true
      keep-alive-time: 30s
      permit-keep-alive-without-calls: true

# =============================================================================
# observability —— 对齐 Go observability.DisableNativeRestTimeout + NewHTTPMiddleware
# =============================================================================
# 取值依据：Go 侧 etc/task.yaml **没有** Timeout 字段，实际生效值来自 go-zero v1.10.2
#     rest/config.go:55  Timeout int64 `json:",default=3000"`
# ⇒ task-api 的 HTTP 超时是 3000ms，由 observability 中间件单独执行
#   （DisableNativeRestTimeout 已把 go-zero 原生超时中间件关掉，超时只有一个执行者）。
observability:
  http-timeout: 3s

# =============================================================================
# rag.protection —— Go「请求保护层」四道中间件
# =============================================================================
# ⚠️⚠️ 下面四项在 Go 的 etc/task.yaml 里**一个字都没写**，但它们**是开启的**。
#    照 yaml 逐字段对，永远看不见（依据在 go-zero 的 struct tag 里）：
#
#   rest/config.go:12-22   MiddlewaresConf 十个开关**全部** `json:",default=true"`
#                         （含 MaxConns / Breaker / Shedding / MaxBytes）
#   rest/config.go:52      MaxConns     int   `json:",default=10000"`
#   rest/config.go:53      MaxBytes     int64 `json:",default=1048576"`
#   rest/config.go:56      CpuThreshold int64 `json:",default=900,range=[0:1000)"`
#
# ⚠️ max-bytes 用 tag 默认的 **1 MiB**：task.yaml 没有覆盖它，routes.go 也没有
#    rest.WithMaxBytes ⇒ 本端点（POST，有 body）的正文上限就是 1 MiB。
#
# ⚠️ 四层的拒绝响应都是**裸状态码 + 空 body + 无 Content-Type**，不走 text/plain
#    （Go 侧是裸 w.WriteHeader）。这与「handler 内部错误 = 状态码 + text/plain」
#    刻意不同：保护层在到达业务逻辑之前就拒绝了。
rag:
  http:
    # =============================================================================
    # 🔴 Go 风格 form 值上限闸门（2026-10-25 第十四轮 · global 收口域 · X-6 / DRIFT-HOTAPI-030）
    # =============================================================================
    # Go 出处：go-zero rest/httpx/util.go:15  maxFormParamCount = 2048
    #          （数的是**非空值**；util.go:44-45 空值 continue 不计数）
    #          Go 1.25 net/url/url.go:1001  defaultMaxParams = 10000（数的是**段数**）
    #
    # mode = 本域的 form 超限时应该输出什么形状 —— 依据是「Go 侧该 api 有没有注册
    #        httpx.SetErrorHandler」（逐域取证）：
    #   · raw      ⇒ Go 未注册 SetErrorHandler ⇒ http.Error(w, err.Error(), 400)
    #                ⇒ **400 + text/plain; charset=utf-8 + nosniff + Go 原文**
    #   · envelope ⇒ Go 注册了 SetErrorHandler ⇒ 走业务信封
    #                ⇒ **200 + {"code":5001,"msg":"<该域自己的错误码表文案>","data":null}**
    #
    # ⚠️ 本属性决定两件事，**但只在 mode ≠ OFF 时**（共享层
    #    GoStyleTomcatParameterLimitCustomizer#customize 的 OFF 分支**直接 return**）：
    #   ① service/common 的 GoStyleTomcatParameterLimitCustomizer 把 Tomcat 的
    #      maxParameterCount 抬到 10001（= Go 段数上限 +1）⇒ 否则 Tomcat 会先于应用层拒绝，
    #      且拒绝形状是 400 + HTML 错误页（与 Go 不同）；
    #   ② service/common 的 GoStyleFormValueLimitInterceptor 按 Go 的语义判定。
    #
    # 🔴 **本域 mode = "off" ⇒ ① 不发生 ⇒ 运行期容器上限停在 yaml 的 2048**
    #    （而不是别的域的 10001）⇒ 即「**比 Go 更严**」—— 但**当前不可达**：
    #    · Go 侧本域 handler 走 `json.NewDecoder(r.Body)`（gettaskhandler.go:19）⇒
    #      `httpx.Parse` / `r.Form` **从不求值** ⇒ Go 的 2048 **应用层**判据不生效，
    #      Go 实际只有 `net/url` 的 `defaultMaxParams = 10000`（Go 1.25 net/url/url.go:1001）；
    #    · RAG 侧本域**从不调 `request.getParameter*`**（`@RequestParam` / `@RequestPart` 命中 = 0）
    #      ⇒ Tomcat **永不解析 query** ⇒ 2048 **够不着** ⇒ ⇒ **两侧都不可达 ⇒ 无可观察差异**。
    #    ✅ 守门已钉住这条不可达性：`TaskApiFormLimitReachabilityTest` 的
    #       「>2048 个非空 query 值 ⇒ 200」（真 Tomcat）⇒ **若哪天本域开始读 query 参数**，
    #       该守门会红 ⇒ ⇒ 届时须把容器上限提到 10001（对齐 Go 的 net/url 段数上限）。
    #
    # ⚠️ 各域 5001 的文案**不一样**（like/comment =「系统内部错误」，
    #    hot/follow/message = "internal server error"）⇒ 共享层**不硬编码文案**：
    #    envelope 模式下共享层只抛异常，由**本域自己的**兜底 handler 查本域的错误码表渲染。
    #
    # 🔴 favorite 域**故意没有这一项**（= off）⇒ global 对该域零影响：
    #    既不改它的容器上限、也不装闸门 ⇒ 行为逐字节不变。
    #    （favorite 不在 global 的写权范围内，AGENTS.md §5.3c）
    go-form-limit:
      # 🔴 2026-10-27 订正（阶段 2 · D-1）：本域改 **off**，理由**不是**「错误形状」，
      #    而是**语义可达性** —— Go 侧这个上限在本域**根本走不到**：
      #
      #    Go 出处：service/task/api/internal/handler/task/gettaskhandler.go:19
      #        decoder := json.NewDecoder(r.Body)      ← **裸 JSON 解码器**
      #    ⇒ 它**从不调 httpx.Parse / ParseForm / GetFormValues**
      #      （全仓 grep：task 域的 httpx.Parse/ParseForm/GetFormValues 命中数 = **0**）
      #    ⇒ **query / form 从不被解析** ⇒ go-zero 的 maxFormParamCount=2048
      #      （rest/httpx/util.go:15）在本域**不可达**
      #    ⇒ Go 侧：带 3000 个 query 参数的请求**正常处理（200）**
      #
      #    ⇒ RAG 侧若开闸门 ⇒ 会多出一道 Go 没有的拒绝 ⇒ **行为漂移** ⇒ 必须 off。
      #
      # ⚠️ off 的两个前提（已逐条核实）：
      #    ① GoStyleFormValueLimitInterceptor.preHandle 的 OFF 分支**直接 return true**
      #       （不判定、不拒绝）
      #    ② GoStyleTomcatParameterLimitCustomizer.customize 的 OFF 分支
      #       —— ⚠️ **两版本语义不同（容器上限的抬升与闸门的有无「解耦」了）**：
      #       · **本树现状**（共享层仍含 `if (mode == OFF) return;`）⇒ **不动**容器上限
      #         ⇒ Tomcat 保留 yaml 的 2048
      #       · **合并 G4 `cd893d1`（「容器上限抬升」与「闸门有无」解耦）之后** ⇒ OFF
      #         **只关应用层判定** ⇒ 容器上限**无条件**抬到 10001
      #         （`setMaxParameterCount(MAX_PARAMETER_COUNT)`）
      #       ⇒ ⇒ **两种状态下本域都不可达 ⇒ 行为无差异**：
      #         本域**从不调 getParameter***（控制器只有 @RequestBody，没有 @RequestParam）
      #         ⇒ Tomcat 的参数解析是**惰性**的 ⇒ 上限既不被触发、也不被越过
      #         ⇒ ⚠️ **反向残留**（不是「RAG 更严」，而是「若本域将来开始读 query 参数」）：
      #           RAG 会放行到 **10001**，而 Go 侧 `net/url` 在 **10000** 就拒 ⇒ 差 1
      #           ⇒ 届时才需处理 ⇒ 当前**不可达**
      #         ⇒ 守门 `TaskApiFormLimitReachabilityTest`（下面）负责钉住「当前不可达」
      #    ⇒ ⚠️ **合并清单**：本段的 ② 描述**依赖共享层版本** ⇒ 合并 G4 后请按上面对照一次
      #
      # ⇒ 守门：service/task/task-api/src/test/java/com/rag/task/task/api/
      #        TaskApiFormLimitReachabilityTest.java（真 Tomcat）
      #        ① >2048 个非空 query 值 ⇒ 200
      #        ② ?a=%zz（畸形转义）⇒ 200
      #        ③ ?a=1;b=2（分号）⇒ 200
      # ⚠️⚠️ **必须加引号**：YAML 1.1（SnakeYAML）把**未加引号的** `off` 解析成
      #    **布尔 false** ⇒ `@Value("${rag.http.go-form-limit.mode}")` 拿到的是
      #    字符串 **"false"**。
      #    📌 **订正（2026-10-28 · G4 告知 + 我域独立复核）**：**这段警告的后半段已过期**
      #    —— 共享层 `GoStyleFormLimitMode.parse` 现在**接受 `"false"`**
      #    （`service/common/src/main/java/com/rag/common/http/GoStyleFormLimitMode.java:342-345`
      #    ⇒ `case "false": return Mode.OFF;` ⇒ 该分支的注释明写「G2 反馈单 FB-05 的 L4 实测」）
      #    ⇒ ⇒ **未加引号的 `off` 现在取到 `"false"` ⇒ 语义仍是 OFF ⇒ 不会再抛异常**
      #    ⇒ ⇒ **原实测记录保留（2026-10-27 当时形态）：未加引号时 task-api 上下文直接起不来，
      #      报错 `非法的 rag.http.go-form-limit.mode 值：false`）** —— 那是 `parse` 尚不认
      #    `"false"` 时的行为 ⇒ **历史事实，不改写**。
      #    ⇒ **域内写法不变、且仍推荐显式写法**：`mode: "off"`（带引号 ⇒ 保持字符串）
      #    ⇒ ⇒ 理由从「不加引号会炸」换成「**显式更稳、不受 YAML 版本/解析器差异影响**」。
      #    ⚠️ 全仓此前**没有任何域**写字面量 `off` ⇒ favorite 域是靠
      #    **「整段不写」** 拿到 OFF（`@Value` 默认值 `:off`）⇒ 别把它的注释
      #    「故意没有这一项（= off）」误读成「写 off 也行」。
      mode: "off"
  protection:
    max-conns: 10000
    max-bytes: 1048576
    cpu-shedding:
      enabled: true
      cpu-threshold: 900      # 千分比，900 = 90% CPU
      cpu-source: SYSTEM      # Go core/load/adaptiveshedder.go:41-43 读整机 CPU（/proc/stat）
    breaker:
      enabled: true

# =============================================================================
# OpenTelemetry OTLP exporter（对齐 Go 端 Telemetry.*）
# =============================================================================
otel:
  exporter:
    otlp:
      endpoint: http://${OTEL_ADDR:jaeger}:${OTLP_PORT:4317}
      protocol: grpc
  resource:
    attributes:
      service.name: task-api
  traces:
    sampler: always_on          # 对齐 Go Sampler: 1.0

logging:
  level:
    root: INFO
    com.rag.task.task.api: INFO
    com.rag.common: INFO

# =============================================================================
# ⚠️ Auth 段刻意不存在
# =============================================================================
# Go etc/task.yaml:9-11 有
#     Auth: {AccessSecret: "replace-with-a-long-random-secret", AccessExpire: 1800}
# 但 internal/config/config.go:14-17 只把它声明进 Config 结构体，
# servicecontext.go / gettasklogic.go / routes.go **零消费点** ⇒ 死配置。
# 迁移它 = 新增一段没人读的配置，反而会让人误以为本端点受鉴权保护
# （它不受：routes.go 没有 rest.WithJwt，uid 来自请求体的 id）。
# 该端点存在水平越权面，是 Go 的既定行为，按原样保留；补鉴权属新增行为，需单独拍板。