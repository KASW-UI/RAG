# admin-rpc 启动配置 —— 对齐 Go 端 service/user/admin/rpc/etc/admin.yaml

spring:
  application:
    name: admin-rpc

  # ===== 1. Postgres（对齐 Go 端 DataSource）=====
  datasource:
    # POSTGRES_ADDR/POSTGRES_PORT 来自 docker-compose.yaml（默认 postgres:5432）
    url: jdbc:postgresql://${POSTGRES_ADDR:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:first_db}?sslmode=disable
    username: ${POSTGRES_USER:admin}
    # ⚠️ **本行无默认值（2026-10-30 按 Go 同形取消 fallback · `S1-USERS-002`）**
    #    Go 侧（`service/user/admin/rpc/etc/admin.yaml:14`）=
    #    `DataSource: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@…"` ⇒ **无默认值**：
    #    go-zero `core/conf/config.go:63` 用 `os.ExpandEnv` 展开 ⇒ 它**不认** `${VAR:default}` 语法
    #    ⇒ 未设 env 即展开成**空串** ⇒ 用空口令连库 ⇒ 认证失败 ⇒ **fail-fast**。
    #    RAG 侧此前给这个占位符挂了**明文默认口令** ⇒ 缺变量时**用那个公开口令连上**
    #    ⇒ 与 Go **不同形**（Go 连不上 / RAG 连得上）⇒ ⇒ 那是一条**真漂移** ⇒ 本轮取消。
    #    ⚠️ **残余差异（RAG 更严的一侧）**：Go = 启动成功、**连库时**失败；RAG = **启动即失败**
    #    （Spring 解析不到占位符 ⇒ DataSource bean 创建失败）⇒ ⇒ 失败时刻不同 ⇒ 属有意偏离候选。
    #    ⚠️ 注入侧一字不变：根级 `docker-compose.yaml` 用 `${POSTGRES_PASSWORD:?…}` 强制要求并透传、
    #    `manage.sh` 硬校验 `.env`、`tools/difftest/*` 对拍装置显式 export ⇒ **不打断任何现有流程**。
    #    ⚠️ 其余 7 处（article×2 / comment / favorite / like / message / task）属 G2/G3 面 ⇒ 口径尚未全仓统一。
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ===== 2. MyBatis-Plus + Flyway（Phase 3 重构：去 JPA，用 MyBatis-Plus + Flyway DDL）=====
  # ⚠️ 建表**不再用 Flyway**（2026-10-21，DRIFT-NEW-015）。
  #   flyway_schema_history 是 schema 级账本，而 admin-rpc 与 user-rpc 的迁移版本号撞车、
  #   内容不同，两个进程又必须连同一个库（admin-rpc 也读写 users_user）
  #   ⇒ admin-rpc 在生产拓扑下根本无法启动。
  #   现在的做法：bootstrap/AdminSchemaBootstrap 在 @PostConstruct 里用
  #   com.rag.users.common.ddl.SchemaInitializer 把 users-common 里的 4 份 db/*.sql
  #   幂等重放一遍（全部 CREATE ... IF NOT EXISTS），无账本、无版本号。
  #   时序：AdminSeederBootstrap 用 @DependsOn("adminSchemaBootstrap") 显式排在它之后 ——
  #   以前那条靠 Flyway + MyBatis-Plus detector 的传递链，去掉 Flyway 后已经不存在。
  #   详见 SchemaInitializer 与 AdminSeederBootstrap 的 javadoc。

  # MyBatis-Plus 配置：Map 字段 JSONB 序列化走 JacksonTypeHandler
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
      default-fetch-size: 100
    global-config:
      db-config:
        id-type: AUTO
        table-underline: true
        logic-not-delete-field: deleted
        logic-delete-value: 1
        logic-not-delete-value: 0
    # JacksonTypeHandler 自动注册（在 Phase 3 entity 上 @TableField(typeHandler = JacksonTypeHandler.class) 引用）
    type-handlers-package: com.baomidou.mybatisplus.extension.handlers

  # ===== 3. Redis（对齐 Go 端 BizRedis）=====
  data:
    redis:
      host: ${REDIS_ADDR:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # ⚠️ 取值出处（2026-10-23 补记，此前只有数值没有出处）：
      #   Go 的 admin.yaml **完全没有** BizRedis 超时配置
      #     → go-zero v1.10.2 core/stores/redis/redisclientmanager.go:32-39
      #       建 red.Options 时**三个 timeout 一个都没传**（只传 Addr/User/Pass/DB/…）
      #     → github.com/redis/go-redis/v9 **v9.20.0**（Sea 仓 go.mod:15 **直接 pin**）options.go 的 init() 填库默认值：
      #         DialTimeout = 5s          （options.go:338-339）
      #         ReadTimeout = 3 * time.Second（options.go:364-370 的 `switch opt.ReadTimeout { case 0: … }`）
      #         WriteTimeout = ReadTimeout（options.go:374-378）
      #   ⇒ **读命令超时 3s**。本值与 go-redis 的 ReadTimeout 默认逐字相同。
      #   ⚠️ 这是一致但**无回归网**的巧合：go-zero 升 go-redis、默认值一变即静默分叉。
      #      故在此写明出处（**连版本号一起钉**），并配 AdminRedisTimeoutConfigTest 守住这个值。
      #      🔴 2026-10-28 订正：上面那两处行号原写 `:329-330` ⇒ 那是 **v9.18.0** 的行号；
      #         真源实际解析到 **v9.20.0**（Sea 仓 go.mod:15 直接 pin）⇒ 实际是 `:338-339`。
      #         ⇒ **教训：引第三方源码的行号必须连版本号一起钉** ⇒ 否则版本一漂，行号即失效
      #         （与「共享层文件被挪长 ⇒ 引用集体过期」同族，但对象是**外部依赖**）。
      #   🔴 红鲱鱼提醒：go-zero core/stores/redis/redis.go:27 有一行
      #      `readWriteTimeout = 2 * time.Second` —— **它是死常量，全文件仅此一处、
      #      从未被使用**。只看它会错判成「Go 的 Redis 超时是 2s」。
      timeout: 3s
      # 连接（dial）超时：Go 侧 go-redis 的 DialTimeout 默认 **5s**。
      # 🔴 2026-10-27 订正：此处原写「上面那个 timeout 同时管命令与连接（Lettuce 在 connect-timeout 未设时
      #    回落到 timeout）⇒ 不显式配就变成 3s」——**那是错的**：
      #    Boot 4.0.8 LettuceConnectionConfiguration.createClientOptions 的字节码是
      #      `if (connectTimeout != null) { builder.socketOptions(…connectTimeout(…)); }`
      #    ⇒ null ⇒ 整段跳过 ⇒ 用 Lettuce 自己的默认 **10s**（SocketOptions.DEFAULT_CONNECT_TIMEOUT_DURATION）
      #    ⇒ 不显式配 = 10s（≠ Go 的 5s）；修法与结论不变。详见 DRIFT-ARPC-013 订正块。
      # Boot 4 里这是**独立属性**（DataRedisProperties.connectTimeout，
      # 模块 spring-boot-data-redis；注意 RedisProperties 已从 spring-boot-autoconfigure 拆出）。
      connect-timeout: 5s

  # ===== 4. Nacos 服务注册（修 DRIFT-NEW-001）=====
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:sea-rtw}
        group: ${NACOS_GROUP:USER_GROUP}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}

# ===== 5. gRPC server（对齐 Go 端 ListenOn: 0.0.0.0:8081）=====
# 选项 C：admin-rpc 严格保持纯 gRPC，不加 spring-boot-starter-web，
# 因此 application.yaml 里没有 server.port（Spring Web 也不会起）。
grpc:
  server:
    # ⚠️ 默认端口**一字不变**（8081）。
    #    加 env 覆盖是为了与其余 5 个组件的**可覆盖策略一致**（见
    #    `docs/DRIFT/users/stage1-admission.md` §4.3 `T8`），
    #    并解除「本机该口已被占 ⇒ 组件无法真启动」的死结。
    #    ⚠️ 改口时**必须同时确认 Nacos 注册地址跟着变** —— devh 用这个端口既监听又注册
    #    （已核：本模块 `spring.cloud.nacos.discovery` **没有独立 port 字段** ⇒ 注册端口随
    #     `grpc.server.port` 走 ⇒ env 覆盖时两边同步 ⇒ 不会脱钩）。
    port: ${ADMIN_RPC_PORT:8081}
    reflection-service-enabled: false
    enable-keep-alive: true
    keep-alive-time: 30s
    permit-keep-alive-without-calls: true

# ===== 6. 业务配置（对齐 Go 端 AdminAuth.* + System.*）=====
# 对应 Go: AdminAuth.AccessSecret / AdminAuth.AccessExpire + System.DefaultPassword
#
# 🔴 2026-10-29 · G1 阶段 1 · P0 #8：**默认明文值已去掉**（原为**带明文默认值**的 `${ADMIN_JWT_SECRET}`；
#    那个 15 字节口令明文已从本仓清除 ⇒ 本仓不再持有那把密钥）
#    ⇒ 理由：那串密码是**写在仓里的公开密钥** ⇒ 谁都能用它伪造 JWT ⇒ 而本密钥是 **admin 域的签发密钥**
#      （签发方 = admin-api / `AdminLoginService.java:84`；验签方 = admin-api）
#      ⇒ ⇒ 一旦部署时忘了覆盖 ⇒ **任何人都能签出任意 admin token**（P0 #8 · 越权）。
#    ⇒ 现在 **缺变量 ⇒ 启动失败**（Spring Boot 4 的 `SpringConfigurationPropertySource` 取**原始标量**
#      ⇒ 占位符**解析不出来时原样留下** ⇒ 绑上去的是字面量 `${ADMIN_JWT_SECRET}` ⇒
#      ⇒ 由 `AdminRpcProperties#verifyAccessSecret` 的 @PostConstruct **判掉** ⇒ **启动失败**）；
#      **变量存在但为空串 ⇒ 也启动失败**（同上：@PostConstruct 判空 ⇒ 抛 IllegalStateException）
#      ⇒ ⇒ **两条路都 fail-closed**。
#    ⚠️ **Go 侧对照（§3.1）**：Go `service/user/admin/rpc/etc/admin.yaml:28` 写的是**字面量**；
#      且 Go 的 admin-rpc **只消费 AccessExpire**（`internal/logic/logoutlogic.go:37`），
#      **不消费 AccessSecret** ⇒ ⇒ RAG 本侧属「**更严**」的一侧 ⇒ 登记为有意偏离（不是抄错 Go）。
#    ⚠️ 本地开发 / 测试：本模块测试用 `src/test/resources/application.properties` 提供同名变量
#      ⇒ ⇒ **测试不依赖环境变量**。
#    ⚠️ `system.default-password`（`${ADMIN_DEFAULT_PASSWORD:123456}`）**不在本次范围内**
#      ⇒ 那是「默认账号密码」，不是 JWT 密钥 ⇒ 已登记在别处 ⇒ 本次不动。
admin-rpc:
  admin-auth:
    access-secret: ${ADMIN_JWT_SECRET}
    access-expire: ${ADMIN_JWT_EXPIRE:2592000}    # 30 天
  system:
    # 用于 ensureDefaultAdmin bootstrap 时给默认账号加密
    # Go 端 etc/admin.yaml: System.DefaultPassword = "123456"
    default-password: ${ADMIN_DEFAULT_PASSWORD:123456}

# =============================================================================
# 进程形态：rpc 侧（`rag.side: rpc`）
# =============================================================================
# 🔴 **这一行是「共享层 api 侧中间件」的闸门**（2026-10-30 · G1 lane）
#
# 【Go 出处】Go 的 rpc 进程**一个 rest 中间件都没挂**（全部 `zrpc.MustNewServer`）
#   ⇒ ⇒ rpc 侧不存在任何 servlet 过滤器 ⇒ ⇒ RAG 的 rpc 域也**不得**挂 Go 侧没有的中间件。
#
# 【机制】共享层用 `@ConditionalOnApiSide`
#   （= `@ConditionalOnProperty(name="rag.side", havingValue="api", matchIfMissing=true)`）
#   挡住 api 侧那 **13 个类**（11 个带 `@ConditionalOnWebApplication(SERVLET)` ＋
#   `HttpMiddlewareFilter`（无条件 `@Component`）＋ `GoStyleJsonBodyConverterConfig`（`@Configuration`））：
#   `GoStyleCpuSheddingFilter` / `GoStyleMaxConnsFilter` / `GoStyleMaxBytesFilter`
#   / `GoStyleBreakerFilter` + 路由模板 / `GoStyleTraceparentFilter` / `HttpMiddlewareFilter`
#   / `GoStyleFormLimitWebMvcConfig` / `GoStyleFormValueLimitInterceptor`
#   / `GoStyleJsonBodyConverterConfig` / `GoStyleJsonContentTypeAdvice`
#   / `GoStylePathNormalizingAutoConfiguration` / `GoStyleTomcatParameterLimitCustomizer`
#   ⇒ ⇒ 其中**会「拒请求」的只有两个**：`GoStyleCpuSheddingFilter`（CPU 高负载）
#   与 `GoStyleMaxConnsFilter`（连接数超限）⇒ ⇒ 抓取请求可能被自己域的中间件挡掉。
#   ⚠️ **`matchIfMissing=true` ⇒ 默认就是 api 侧** ⇒ ⇒ rpc 域**必须显式写这一行**。
#
# 【本模块当前状态】下面的 `management.server.port: -1` ⇒ **本模块没有 servlet 容器**
#   ⇒ ⇒ 这一行当前是**防御性的**（没有载体 ⇒ 就没有 web 上下文）。
#   ⚠️ 但**一旦按 `S1-FOLLOW-001` 的裁定给本模块加观测载体**，这一行就是**必做项**：
#   ⇒ 载体 = servlet 上下文 ⇒ ⇒ 若不写这一行 ⇒ ⇒ 那 13 个 Bean 会挂到观测口上
#   ⇒ ⇒ 其中 `GoStyleCpuSheddingFilter` 在 CPU 高负载时**拒掉抓取请求**
#   ⇒ ⇒ 而 Go 侧 rpc 域一个中间件都没挂 ⇒ ⇒ **与 Go 不同形**。
#
# ✅ **现状（2026-10-30 · 合并主干后订正）**：共享层的 `ConditionalOnApiSide` **已落库**（`53bc05ec`）
#   ⇒ ⇒ **这一行现在真的被读了**（原写「本分支基线上尚未落库 ⇒ 死配置」是**分支相对**的说法 ⇒ 叠到主干后已不成立 ⇒ 原值保留备查）
#   ⇒ ⇒ **本行是必做项**：该注解默认值是 api（`matchIfMissing=true`）⇒ ⇒ rpc 域**必须显式写这一行**
#   ⇒ ⇒ 本模块**目前 `management.server.port: -1`（无 servlet 容器）⇒ 此刻是防御性的**
#   ⇒ ⇒ 但一旦按 `S1-FOLLOW-001` 的裁定加了观测载体 ⇒ ⇒ 不写它 ⇒ ⇒ 那 13 个 api 侧 web 类就挂到观测口上
#        （其中 `GoStyleCpuSheddingFilter` 在 CPU 高负载时会**拒掉抓取请求** ⇒ 而 Go 侧 rpc 域一个中间件都没挂 ⇒ ⇒ 与 Go 不同形）。
rag:
  side: rpc

# ===== 7. Spring Boot Actuator：禁掉 HTTP 端点，admin-rpc 保持纯 gRPC =====
# Go 端 admin-rpc 没有 HTTP endpoint，Java 侧必须 align。
# metrics 仍注册到 Micrometer（Metrics.java 显式 Counter.builder），只是无法通过 /actuator/prometheus 抓取。
management:
  server:
    port: -1
  endpoints:
    enabled-by-default: false
  endpoint:
    health:
      enabled: false
    prometheus:
      enabled: false
  metrics:
    enable:
      prometheus: true
    tags:
      application: ${spring.application.name}

# ===== 8. OpenTelemetry OTLP exporter（对齐 Go 端 Telemetry.*）=====
# Go: Endpoint=jaeger:4317, Batcher=otlpgrpc, Sampler=1.0, Name=admin-rpc
otel:
  exporter:
    otlp:
      endpoint: http://${OTEL_ADDR:jaeger}:${OTLP_PORT:4317}
      protocol: grpc
  resource:
    attributes:
      service.name: admin-rpc
  traces:
    sampler: always_on

# ===== 9. Snowflake worker ID =====
# 优先环境变量 SNOWFLAKE_NODE_ID；不设则 Snowflake.java 用 SHA-256(SERVICE_NAME + "-" + PID) 兜底
# 见 service/common/Snowflake.java

# ===== 10. 日志（Spring Boot 默认走 logback-classic，SLF4J）=====
# Logger.java 已显式调 Logger.init("admin-rpc")，MDC trace_id 会被自动填入
logging:
  level:
    root: INFO
    com.rag.users.admin.rpc: INFO
    com.rag.common: INFO
# ===== observability（对齐 Go service/user/admin/rpc 的 DisableNativeRpcTimeout + NewUnaryServerInterceptor）=====
# 取值依据：Go 侧 service/user/admin/rpc/etc/admin.yaml 未配置 Timeout，
# 实际生效值为 go-zero v1.10.2 `zrpc/config.go:46` 的 `Timeout int64 json:",default=2000"` → 2000ms。
observability:
  rpc-timeout: 2s
