#   ↳ Go 侧 package 行原文：package task;

syntax = "proto3";
package task;
message Task{
string name = 1;
string desc = 2;
int64 task_id = 3;
int64 completion_progress = 4;
int64 required_progress = 5;
}
message GetTaskReq{
int64 user_id = 1;
}
message GetTaskResp{
repeated Task task = 1;
}
service TaskService{
rpc GetTask(GetTaskReq) returns (GetTaskResp);
}
