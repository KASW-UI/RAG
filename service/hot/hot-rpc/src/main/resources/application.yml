# =============================================================================
# hot-rpc application.yml —— 对应 Go 端 service/hot/rpc/etc/hot.yaml
#
# Go 侧有 3 份配置（hot.yaml / hot2.yaml / hot3.yaml），它们是**同一个 consumer group 的
# 3 个副本**：共享同一个 etcd key(hot.rpc)、同一个 consumer group(article-hot-group)、
# 同一个 topic(article-hot-events)、同一份 HeavyKeeper/Interaction 参数，
# 只差 ListenOn(8083/8084/8085) 与 Prometheus.Port(19091/19092/19093)。
# ⇒ Java 侧收敂为「同一部署 × 3 副本」，端口走环境变量。
#
# hot2/hot3.yaml 相对 hot.yaml 的唯一结构差异：Weights 少了 Code 字段。
# 该字段在 Go 侧零读取（hot.go:47-50 只按 Name 建 map），但 Java 侧在
# HotRpcProperties.Weight 里保留 code，以免配置结构与真源脱节。
# =============================================================================

spring:
  application:
    name: hot-rpc

  # ============== Redis（对应 Go RedisConf{Host: redis:6379, Pass}）==============
  # ⚠️ Go 侧 RedisConf.Type 是**死配置**（service_context.go:17-20 只用 Addr + Password），
  #    所以这里不配 cluster 相关项：Lettuce 默认即单节点直连。
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
      # 🔴 connect-timeout（**TCP 连接**超时）必须显式写 5s：
      #   Go 出处（消费点）：service/hot/rpc/internal/svc/service_context.go:17-19
      #       rds := redis.NewClient(&redis.Options{Addr: c.RedisConf.Host, Password: c.RedisConf.Pass})
      #     ← **只设了 Addr + Password** ⇒ DialTimeout 未设
      #     ⇒ 走 go-redis v9.20.0 options.go:338-340 的默认 **5s**。
      #   RAG 侧：Boot 4.0.8 的 LettuceConnectionConfiguration.createClientOptions **只在**
      #       spring.data.redis.connect-timeout 非空时才设 SocketOptions.connectTimeout
      #     ⇒ 不配 ⇒ 走 Lettuce SocketOptions.DEFAULT_CONNECT_TIMEOUT = **10s**
      #   ⇒ 不配 ⇒ 连接超时 10s vs Go 5s ⇒ **漂移 2 倍**。
      # ⚠️ spring.data.redis.timeout 只管**命令**超时；Boot 4 起它**不再**兼管连接超时。
      connect-timeout: 5s
      # ⚠️ 连接池 = 与 Go 侧**形态**对齐（2026-10-27 G3 · `DRIFT-HOTRPC-011` 已修）：
      #    Go 侧 `service/hot/rpc/internal/svc/service_context.go:17-20`
      #    `redis.NewClient(&redis.Options{Addr: c.RedisConf.Host, Password: c.RedisConf.Pass})`
      #    ⇒ **只设 2 个字段** ⇒ `PoolSize` 未设 ⇒ 落 go-redis v9.20.0 库默认
      #      （`go-redis@v9.20.0/options.go:350-351` `PoolSize = 10 * runtime.GOMAXPROCS(0)`）⇒ **Go 侧是有池的**。
      #    ⚠️ 而本模块原先**无 pool 段 + pom 无 commons-pool2** ⇒ Boot 4 的判据
      #      `DataRedisConnectionConfiguration#isPoolEnabled`（`:195-198`，实测字节码）：
      #      `Boolean enabled = pool.getEnabled(); return (enabled != null) ? enabled : COMMONS_POOL2_AVAILABLE;`
      #      ⇒ enabled 为 null + classpath 里**没有** commons-pool2 ⇒ **池不启用**
      #      ⇒ Lettuce 走**共享单连接** ⇒ 并发下命令互相串行排队 ⇒ 可能撞 3s 命令超时
      #      ⇒ ⇒ 原状是**形态漂移**（Go 有池 / RAG 无池）⇒ 本项对齐「有池」这个形态。
      #    ⚠️ 池大小**无法逐值对齐**（Go 是 10 × 核数，**机器相关**：本机 10 核 ⇒ Go = 100）⇒ 按**数量级**对齐：
      #      · `max-active: 64` ↔ Go 的 `PoolSize`（本机 100）⇒ **性能面**数值差异（已登记）
      #        ⚠️ 另注：Go 的 `MaxActiveConns` **未设** ⇒ `options.go:230-235`「When zero, there is no limit
      #          on the number of connections in the pool」⇒ **Go 侧无总量硬上限** ⇒ RAG 的 64 是
      #          **表达层**的硬上限（残留差异属性能面，已登记）
      #      · `min-idle: 0` ↔ Go 的 `MinIdleConns`（`go-redis@v9.20.0/options.go:218-222`
      #        **无 default 赋值** ⇒ 保持 0）⇒ **精确对齐**（写成 4 会变成对 Go 的偏离）
      #      · `max-idle: 16` ↔ Go 的 `MaxIdleConns`（`options.go:224-228` **无 default 赋值** ⇒ 0
      #        ⇒ 消费点 `go-redis@v9.20.0/internal/pool/pool.go:1257`
      #           `if p.cfg.MaxIdleConns == 0 || p.idleConnsLen.Load() < p.cfg.MaxIdleConns`
      #        ⇒ **0 = 无上限**）⇒ RAG 的 16 是**表达层**取值：**比 Go 更严**（只影响空闲连接的保留/回收，
      #        **不影响命令结果**）⇒ 已登记为有意偏离项
      #    ⚠️ **不要拿 like-rpc / comment-rpc 的 64/16/4 当基准**（AGENTS.md §3.1：不得拿「现有 RAG 代码」
      #       当对照基准）：like 域的 Go 走 **go-zero 的 redis**
      #       （`go-zero@v1.10.2/core/stores/redis/redisclientmanager.go:15` `idleConns = 8`
      #         ⇒ `MinIdleConns = 8`），本域的 Go 走 **go-redis 直连**（`MinIdleConns = 0`）
      #       ⇒ 两个域的 Go 客户端本就不同 ⇒ 池参数**不必同族**。
      #    🔴 **`max-wait` 不可省**（2026-10-27 G3 实测）—— **光加池会引入比 Go 更糟的行为**：
      #      · Go 侧：`go-redis@v9.20.0/internal/pool/pool.go:1113`
      #          `err := p.semaphore.Acquire(ctx, p.cfg.PoolTimeout, ErrPoolTimeout)`
      #        ⇒ 池耗尽 ⇒ 等 **`PoolTimeout`** ⇒ `options.go:380-386`
      #          `if opt.PoolTimeout == 0 { if opt.ReadTimeout > 0 { opt.PoolTimeout = opt.ReadTimeout + time.Second } }`
      #          ⇒ ReadTimeout = 3s（本模块 `timeout: 3s` 对齐的就是它）⇒ **`PoolTimeout` = 4s**
      #          ⇒ 池耗尽 ⇒ **4s 后**报 `redis: connection pool timeout`。
      #      · RAG 侧若**不配** `max-wait` ⇒ commons-pool2 的 `BaseObjectPoolConfig:59,68`
      #          `DEFAULT_MAX_WAIT = Duration.ofMillis(-1L)` ⇒ **-1 = 无限等**
      #          ⇒ 消费点 `GenericObjectPool.java:306`
      #            `p = negativeDuration ? idleObjects.takeFirst() : idleObjects.pollFirst(remainingWaitDuration)`
      #          ⇒ **阻塞到有人还连接为止**（无上限）。
      #      · 🔴 **Lettuce 的 3s 命令超时救不了场**：`CommandExpiryWriter.write(command)` 才起算计时器
      #        （实测 lettuce-core 6.8.2 字节码），而**借连接发生在写命令之前**
      #        （`RedisTemplate.execute` → `getConnection()` → `borrowObject()` → 之后才 `write`）
      #        ⇒ ⇒ 池耗尽时 **3s 命令超时根本没开始** ⇒ ⇒ **无限挂起**。
      #      · ⇒ 本项对齐 Go 的 **4s**（`max-wait: 4s`）⇒ 池耗尽 ⇒ 4s 后失败（异常类型不同、
      #        耗时口径一致）。
      #      · ⚠️ Boot 4 的装配点：`LettuceConnectionConfiguration$PoolBuilderFactory.getPoolConfig`
      #        ⇒ `setMaxWait(pool.getMaxWait())`（**只在 `maxWait != null` 时才设**）
      #        ⇒ 不配 ⇒ 落 commons-pool2 自己的 -1。
      lettuce:
        pool:
          enabled: true
          max-active: 64
          max-idle: 16
          min-idle: 0
          max-wait: 4s

  # ============== Kafka（对应 Go KqConsumerConf + sarama Config）==============
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:kafka:9092}

    consumer:
      group-id: article-hot-group        # Go KqConsumerConf.Group
      # ⚠️ L1 语义：Go 是 sarama.OffsetNewest —— 新 group **从最新位点开始，不回放历史**。
      #    Spring 对应项就是 latest（默认也是 latest，这里显式写出以锁定契约）。
      auto-offset-reset: latest
      # ⚠️ 关掉自动提交，改由容器在 listener 正常返回后提交（ack-mode: record）。
      #    这与 Go 的「消费完就 MarkMessage」一致。
      enable-auto-commit: false
      # ⚠️ payload 用 String 接收：让 JSON 解析失败发生在 HotEventConsumer 内部（被吞），
      #    而不是发生在 Kafka 反序列化器里（会触发容器重试，改变 Go 的 drop 语义）。
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        # ⚠️ L1 语义：Go 是 sarama.NewBalanceStrategyRoundRobin()。
        #    Spring 默认是 RangeAssignor —— 会改变分区归属，进而改变 hkMap 布局与热榜分布。
        partition.assignment.strategy: org.apache.kafka.clients.consumer.RoundRobinAssignor

    listener:
      # RECORD = listener 正常返回后提交位点。这是 drop 契约的实现载体
      # （HotEventConsumer 保证永不外抛 ⇒ 任何坏消息的位点都照常推进）。
      ack-mode: record

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # 🔴 **必须显式关掉自动注册**（2026-10-30 · 补 Actuator 载体时**实测**补上）。
        #
        # 【为什么】`spring-cloud-starter-alibaba-nacos-discovery` 的**自动注册**
        # （NacosAutoServiceRegistration）注册的是 **web 容器端口** ——
        # 而本模块的 web 容器（2026-10-30 起为了给 Actuator 载体才引入）
        # 监听的是 **观测端口 19091**，**不是 gRPC 业务端口 8083**。
        # ⇒ 自动注册一旦生效 ⇒ Nacos 里会出现「hot-rpc → 19091」这条**错端口**实例
        # ⇒ hot-api 按 Nacos 给出的地址连过来 ⇒ 连到一个**只提供 /actuator/** 的 HTTP 端口
        # ⇒ **gRPC 链路直接断**（业务码塌成 1015）。
        # ⇒ 而且实测更狠：Nacos 不可达时自动注册**抛异常**（`failFast=true`）
        #   ⇒ 直接把**启动**打断（`Failed to start bean 'webServerStartStop'`）⇒ **进程起不来**
        #   ⇒ **这正是本轮真启动实测撞到的那一条**（2026-10-30 · hot-rpc）。
        #
        # 【本模块的注册是手写的】`bootstrap/NacosRegistration.java` 用
        # `GrpcServerProperties.getPort()`（= gRPC 端口 8083）注册 ⇒ 与 Go 侧
        # `zrpc.MustNewServer` 注册 `ListenOn` 的语义一致。
        # ⇒ 自动注册必须关掉，否则**同一个服务名下会有两个端口的实例**。
        register-enabled: false

  # ============== 定时任务调度器（对齐 Go 的两条独立 goroutine）==============
  # ⚠️ Boot 4 的调度器默认是**单线程**：TaskSchedulingProperties$Pool 的默认值是 1
  #    （Boot 4.0.8 字节码：TaskSchedulingProperties$Pool.<init> → iconst_1; putfield size）。
  #    消费点已核对：TaskSchedulingConfigurations$ThreadPoolTaskSchedulerBuilderConfiguration
  #    → TaskSchedulingProperties.getPool().getSize() → ThreadPoolTaskSchedulerBuilder.poolSize(int)。
  #    ⇒ 不配这一项，hot 的两条 @Scheduled 会**共用一个线程、互相排队**：
  #      30s 快照（HotRedisSnapshotStore.periodicSync）与 10s 合并（HotMergeScheduler.periodicMerge），
  #      合并一次要 pipeline 读 N 个分片 + 写 shadow + 跑 Lua，Redis 命令超时 3s
  #      ⇒ 最坏情况合并会占住调度线程数秒，把 30s 快照推迟。
  # Go 侧是两条**独立 goroutine**（hot_handler.go:76-77 `go h.periodicSync(...)` + `go h.periodicMerge(...)`），
  # 各自的 ticker 互不影响 ⇒ 这里给 2 个线程，把「两条周期任务互不阻塞」这个语义位钉住。
  task:
    scheduling:
      pool:
        size: 2

# =============================================================================
# 观测端口（Actuator 的 servlet 载体）
# =============================================================================
# 对应 Go service/hot/rpc/etc/hot.yaml:8-11
#     Prometheus: {Host: 0.0.0.0, Port: 19091, Path: /metrics}
# ⇒ go-zero@v1.10.2/zrpc/config.go:39   RpcServerConf **内嵌** service.ServiceConf
# ⇒ go-zero@v1.10.2/core/service/serviceconf.go:38   ServiceConf.Prometheus 字段
# ⇒ ⇒ **消费点** go-zero@v1.10.2/zrpc/server.go:63  `c.SetUp()`
#      ⇒ ⇒ core/service/serviceconf.go:62  `prometheus.StartAgent(sc.Prometheus)`
#      ⇒ ⇒ core/prometheus/agent.go:31（Host 为空 ⇒ 直接 return，不启动）
#      ⇒ ⇒ core/prometheus/agent.go:38 `http.Handle(c.Path, promhttp.Handler())`
#      ⇒ ⇒ core/prometheus/agent.go:39-41 **独立端口** `http.ListenAndServe(addr, nil)`
# ⇒ ⇒ Go 侧 hot-rpc **真的**在 0.0.0.0:19091 起了一个 HTTP 服务（路径 /metrics）
#
# ⚠️ **端口一字不差**（19091）⇒ 抓取配置只需改**路径**
#    （Go `/metrics` → RAG `/actuator/prometheus`，Actuator 的固定前缀）
#
# ⚠️ **与 gRPC 业务端口严格分离**：本端口只承载 Actuator（**无任何业务 HTTP 路由**），
#    gRPC 仍是 `grpc.server.port`（8083）。
#    ⇒ 探针/部署可用 HOT_RPC_MANAGEMENT_PORT 覆盖（探针会自动挑空闲端口）。
server:
  port: ${HOT_RPC_MANAGEMENT_PORT:19091}

# =============================================================================
# 角色标记：rpc 侧（**不是** api 侧）
# =============================================================================
# 🔴 **这一行是「共享层 api 侧 web 能力的边界声明」**（2026-10-30 · 合并收口执行者要求）
#
# 【为什么必须写】—— 共享层那批 **api 侧**的 web 能力（`GoStyleCpuSheddingFilter` ·
#   `GoStyleMaxConnsFilter` · `GoStyleMaxBytesFilter` · `GoStyleBreakerFilter` +
#   `GoStyleTomcatParameterLimitCustomizer` 等）是**按 `rag.side` 分边**的
#   ⇒ G4 侧把门扩成 `@ConditionalOnProperty(prefix="rag", name="side", havingValue="api",
#   matchIfMissing=true)` ⇒ ⇒ **不写这一行 = 默认落在 api 侧** ⇒ ⇒ 那些 Bean 会照常活。
#
# 【为什么 rpc 侧必须落在 rpc 侧】—— Go 侧 rpc **一个 rest 中间件都没挂**
#   （全部走 `zrpc.MustNewServer` ⇒ 不起 servlet 容器 ⇒ 没有 filter 链）
#   ⇒ ⇒ 观测端口上**不该**挂着 Go 侧不存在的中间件 ⇒ 其中 **CPU 降载会拒请求**
#   ⇒ ⇒ 直接威胁「载体存在的目的」（抓取请求被拒 ⇒ 载体装了但抓不到）。
#
# ⚠️ **当前状态（2026-10-30 实测 · 如实标注）**：
#   共享层**当前还没有**消费 `rag.side` 的条件（`grep -rn "rag.side" service/common/src/main/java/`
#   **零命中**）⇒ ⇒ **这一行现在还没有消费点** ⇒ ⇒ 它是**为 G4 正在扩的那道门预留的对侧**。
#   ⇒ ⇒ 门落地前，它**不生效**；落地后，它**必须**已经在位（否则 rpc 域会挂上 api 侧的中间件）。
#   ⇒ ⇒ 域侧的运行期断言见本域的 `*RpcSharedLayerWebBeanGateTest`（它断言「那些 Bean 不在容器里」）。

rag:
  # 🔴 **必须显式写 `rpc`**（2026-10-30 · 合并收口执行者要求）—— 见上方注释：
  #   `matchIfMissing=true` ⇒ **不写 = 默认 api 侧** ⇒ 共享层的 api 侧 web Bean 会挂上来。
  side: rpc

# ============== gRPC server（devh）（对应 Go ListenOn: 0.0.0.0:8083）==============
grpc:
  server:
    # Go 三副本是 8083/8084/8085；Java 侧收敂为同一部署 × 副本，端口走环境变量。
    # ⚠️ Infrastructure.md §3 目前只给 hot 预占了 18897(HTTP)，**gRPC 端口未分配**。
    #    这里先沿用 Go 的 8083（8081=admin-rpc / 8082=message-rpc / 8083 空闲）。
    port: ${HOT_RPC_GRPC_PORT:8084}
    address: 0.0.0.0
    # ⚠️ Go 端 reflection 仅在 DevMode/TestMode 注册（hot.go:38-40），
    #    三份 yaml 均未写 Mode（默认 pro）⇒ **生产不暴露 reflection**。
    #    与 user-rpc 同款显式关闭；本地调试改 true 或用环境变量覆盖。
    reflection-service-enabled: false

# ============== 业务配置（对应 Go config.Config 的 HeavyKeeper / Interaction）==============
hot-rpc:
  kafka:
    # Go KqConsumerConf.Topic（三份 yaml 一致）。消费侧的 group 在 spring.kafka.consumer.group-id。
    topic: article-hot-events

  heavy-keeper:
    # Go HeavyKeeper{Width:1000, Depth:5, Decay:0.9, TopK:100}
    width: 1000
    depth: 5
    decay: 0.9
    top-k: 100

  interaction:
    # Go Interaction{SyncEvery:100, TTL:3600, PartitionCount:3}
    # ⚠️ sync-every 是**全局**事件计数器阈值（Go hot_handler.go:179），不是每分区计数
    #    ⇒ 分区越多，单分区的快照越稀疏。
    sync-every: 100
    # ⚠️ ttl-seconds 只作用于合并后的大 key hot:articles；
    #    分片 key hot:articles:p{i} 的 EXPIRE 是**硬编码 300s**（Go hot_handler.go:232），
    #    两个过期时间不同，切勿统一。
    ttl-seconds: 3600
    # ⚠️ 必须等于 topic 的实际分区数：merge 只读 p0..p{N-1}（Go hot_handler.go:361-363）。
    #    分区数 > 该值时，多出的分片快照照写不合并，那些文章永远不出现在 hot:articles。
    #    Go 侧同样如此，此处按「不擅自修复 Go 行为」原样保留。
    partition-count: 3
    weights:
      - code: 1          # ⚠️ Go 侧零读取，仅为保留配置结构而存在
        name: like
        weight: 1
      - code: 2
        name: comment
        weight: 2
      - code: 3
        name: coin
        weight: 3
      - code: 4
        name: share
        weight: 4

# ============== observability（对齐 Go observability.DisableNativeRpcTimeout）==============
# 取值依据：Go hot.yaml 未配置 Timeout ⇒ 生效值来自 go-zero zrpc/config.go:46
# `Timeout int64 `json:",default=2000"`` ⇒ **2000ms**。
# ⚠️ 漏掉这一项 ⇒ 无 gRPC deadline，且**不报任何错**（RpcServerInterceptorFactory 收到 null
#    会静默回退 Duration.ZERO = 不限时）。
observability:
  rpc-timeout: 2s

# ============== Actuator：观测端口 = Go 的 Prometheus 块端口（19091） ==============
# 【Go 出处（真源 · 消费点）】
#   service/hot/rpc/etc/hot.yaml:8-11
#       Prometheus: {Host: 0.0.0.0, Port: 19091, Path: /metrics}
#   ⇒ go-zero@v1.10.2/zrpc/config.go:39   RpcServerConf **内嵌** service.ServiceConf
#   ⇒ go-zero@v1.10.2/core/service/serviceconf.go:38   ServiceConf.Prometheus 字段
#   ⇒ ⇒ **消费点** go-zero@v1.10.2/zrpc/server.go:63  `c.SetUp()`
#        ⇒ ⇒ core/service/serviceconf.go:62  `prometheus.StartAgent(sc.Prometheus)`
#        ⇒ ⇒ core/prometheus/agent.go:38 `http.Handle(c.Path, promhttp.Handler())`
#        ⇒ ⇒ core/prometheus/agent.go:39-41 **独立端口** `http.ListenAndServe(addr, nil)`
#   ⇒ ⇒ Go 侧 hot-rpc **真的**在 0.0.0.0:19091 起了一个 HTTP 服务（路径 /metrics）
#
# ⚠️ **2026-10-30：原先把观测面整个关死的三处，已全部反转**（本轮补载体）：
#   ① `management.server.port: -1`（显式禁用 management HTTP server）⇒ **删掉**
#      —— 现在观测面走**主** server 端口（顶层 `server.port` = 19091）⇒
#      与 Go 一样只有**一个** HTTP 端口 ⇒ 不多开第二个面（Go 侧也只有一个）。
#   ② `management.endpoints.enabled-by-default: false` ⇒ **删掉**
#      —— 否则 `health` / `prometheus` 端点**压根不注册** ⇒ 载体有了也没出口。
#   ③ `management.prometheus.enabled: false` ⇒ **删掉**
#      —— ⚠️ 这一项**本来就不是 Boot 的属性名**（Boot 里是
#         `management.endpoint.prometheus.enabled` 与
#         `management.prometheus.metrics.export.enabled`）⇒ 它**从来没起过作用**
#         ⇒ 真要关只能关 ①② ⇒ 现在反过来要**开**。
#   ⇒ 真正起作用的开关是下面的 `endpoint.prometheus.enabled` 与
#     `prometheus.metrics.export.enabled`（两者都显式写成 true）。
#
# ⚠️ **别被一个「长得像」的文件带偏**：`service/hot/rpc/internal/metrics/metrics.go`
#    里那段起 metrics HTTP 服务的代码（硬编码 `:9091`）是**死代码**
#    （`service/hot/rpc/hot.go` 全文没调用它）⇒ hot-rpc 的观测端口是 **19091**。
management:
  endpoints:
    web:
      exposure:
        # ⚠️ **这行以前是死配置**（2026-10-30 补 `spring-boot-starter-web` 后才真正生效）：
        #    `spring-boot-starter-actuator` 只给 endpoint 与自动配置，**不给 servlet 容器**
        #    ⇒ WebApplicationType 推导出 NONE ⇒ 没有 web server
        #    ⇒ 这一族配置**不加载**（不是报错，是静默无效）。
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    enable:
      # ℹ️ 这一项**不是**「开 Prometheus 导出」的开关（Boot 的有效开关是上面的
      #    `endpoint.prometheus.enabled` 与下面的 `prometheus.metrics.export.enabled`），
      #    留着无害，保留以免动到与本轮无关的行。
      prometheus: true
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  # Go hot.yaml: Telemetry{Name: hot-rpc, Endpoint: jaeger:4317, Sampler: 1.0, Batcher: otlpgrpc}
  # ⚠️ 必须挂在同一个 management: 下 —— YAML 重复键后者会覆盖前者。
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://jaeger:4317}

# ============== 日志 ==============
logging:
  level:
    root: INFO
    com.rag: INFO
    io.grpc: WARN