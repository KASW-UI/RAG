# =============================================================================
# article-rpc application.yml —— 对应 Go 端 service/article/rpc/etc/article.yaml
# =============================================================================
# 1:1 迁移原则：保留 Go yaml 同名字段；Java 端用 Spring / devh starter /
# Spring Cloud Alibaba / Spring Kafka 自身字段名表达相同语义。
# =============================================================================

spring:
  application:
    # 对应 Go Name: article.rpc —— 服务发现 / Nacos / OTEL 都按这个名注册
    name: article-rpc

  # ============== Postgres ==============
  # 对应 Go Postgres.*：Host / Port / User / Password / DBName
  # ⚠️ Go 的 DSN 带 `TimeZone=Asia/Shanghai`（model/db.go:31），Java 侧用 JVM 参数表达：
  #    见下方 `time-zone`。这是 DRIFT-MSG-V-007 同类问题的显式落点，不是默认值。
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:first_db}
    username: ${POSTGRES_USER:admin}
    # 🔴 **口令占位符必须是「裸」写法**（2026-10-30 · 合并收口执行者派工 · 与 Go **逐字同形**）
    #   【Go 出处】service/article/rpc/etc/article.yaml:13
    #   【Go 的展开语义】go-zero 的加载 = `core/conf/config.go:63`
    #       `loader([]byte(os.ExpandEnv(string(content))), v)` ⇒ ⇒ **`os.ExpandEnv` 不认
    #       `${VAR:default}` 语法** ⇒ 缺变量时它把**整串当变量名**去查 ⇒ ⇒ **空串**
    #       ⇒ ⇒ Go 侧缺 `POSTGRES_PASSWORD` = **空口令** ⇒ 连库失败 = fail-fast
    #   【为什么取消原先的兜底】原先这里是 `${POSTGRES_PASSWORD:password}` ⇒ 走 **Spring 的
    #       `:default` 语义** ⇒ **缺变量时会用那个默认值连上去** ⇒ ⇒ **RAG 比 Go 松**
    #       （Go 必然失败、RAG 照样起）⇒ ⇒ 属**真漂移**，**不是**「更严的有意偏离」
    #       ⇒ ⇒ 不需要为「保留兜底」签字 ⇒ ⇒ 本轮取消。
    #   ⚠️ **残余差异（失败时刻不同）**：Go = **启动成功、连库时**失败；
    #      RAG = **启动即失败**（Spring 解析不到占位符 ⇒ DataSource bean 创建失败）
    #      ⇒ ⇒ 属「**RAG 更严**的一侧」⇒ ⇒ 由**合并收口执行者**在合并窗口统一登记
    #      ⇒ ⇒ **不是**「保留兜底」的理由。
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 对应 Go sqlDB.SetMaxOpenConns(20) / SetMaxIdleConns(5)
      # Go 注释写明「保守是为了让 outbox poller 不打爆共享 PG 实例」
      maximum-pool-size: 20
      minimum-idle: 5
      # 对应 Go sqlDB.SetConnMaxIdleTime(5 * time.Minute)
      idle-timeout: 300000
      # 对应 Go sqlDB.SetConnMaxLifetime(30 * time.Minute)
      max-lifetime: 1800000

  # ============== MyBatis-Plus ==============
  mybatis-plus:
    configuration:
      map-underscore-to-camel-case: true
      default-fetch-size: 100
    global-config:
      db-config:
        # 主键策略在 Entity @TableId 上显式钉死（article / outbox 都是业务侧生成的字符串 ID）
        id-type: INPUT
      banner: false

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  # ============== Flyway ==============
  # ⚠️ 缺 spring-boot-flyway 依赖时（Boot 4 拆模块），这里配了也不会执行，
  #    且**启动日志里连一行 Flyway 都没有**（不是报错，是根本没加载）。
  #    依赖已在 pom 里显式引入。表版本从 V8 起（§6.3 定的全局唯一号段：
  #    message-rpc 占 V1-V3、users 占 V1-V4）。
  flyway:
    enabled: true
    baseline-on-migrate: true
    # 🔴 **baseline-version 必须显式钉 0**（2026-10-27 G3 域侧自修 · 与 comment/like/task/follow/message 同款）
    #
    # 【现象】本模块与其它 rpc 模块**连同一个库**（first_db / rag_db），
    #         各自用**独立的账本表**（article-rpc 用默认表名 `flyway_schema_history`，
    #         favorite-rpc 用 `flyway_schema_history_favorite`）⇒ **先启动的模块已经把 public schema 弄非空**
    #         ⇒ 本模块启动时 Flyway 看到「非空 schema + 没有自己的账本」
    #         ⇒ 因 baseline-on-migrate=true ⇒ **在 V1 处打 baseline 标记**（默认 baseline-version=1）
    #         ⇒ **V1 的 SQL 从未执行** ⇒ 本域的 V1 建表脚本永远跑不出来
    #         ⇒ 后续依赖它的迁移报 `relation "…" does not exist` ⇒ **服务起不来**。
    #
    # 【为什么 0 而不是关掉 baseline-on-migrate】
    #         baseline-on-migrate=false 时，非空 schema 且无账本 ⇒ Flyway **直接抛异常退出**
    #         （"Found non-empty schema(s) … but no schema history table"）⇒ 更糟（起不来且无修复路径）。
    #         baseline-version=0 ⇒ baseline 标记打在 version 0 ⇒ **V1 之后全部迁移照常执行**
    #         ⇒ 既能在共享库里安全启动，又不丢任何迁移。
    #
    # 【为什么「全新空库」的测试测不出来】
    #         多数单测用**全新空库** + 只有本模块一个进程 ⇒ schema 是空的 ⇒ baseline 根本不触发
    #         ⇒ V1 正常执行 ⇒ 「测试全绿」与「生产拓扑下起不来」同时成立（§3.3 的经典形态）。
    #         ⇒ 必须显式把 schema 弄成非空 ⇒ 守门见各域 *FlywaySharedSchemaGateTest（真 PG + 真 Flyway 引擎）。
    baseline-version: 0
    locations: classpath:db/migration
    schemas: public

  # ============== Kafka ==============
  # 对应 Go 的 4 个 kq 配置（2 pusher + 2 consumer）。
  # ⚠️ Go 是「每条通道一个 consumer group」，Java 侧同一 topic 的多个用途必须用不同
  #    group-id；Spring Kafka 的 group-id 是 listener 级别的，不能全局唯一，
  #    因此各 listener 在 @KafkaListener 上显式声明 groupId。
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:kafka:9092}
    consumer:
      # 对应 Go KqConsumerConf.Offset: first（审核消费者与同步结果消费者都是 first）
      # ⚠️ Spring 的语义是"无已提交位点时从哪里开始"，与 Go 的 Offset: first 等价
      auto-offset-reset: earliest
      # Go `Consumers: 1` —— 单消费者；Spring 默认 concurrency=1，行为一致
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # ⚠️ Go 的 kq.Pusher 是**同步** PushWithKey：返回 error 时 logic 直接返回错误。
      #    Spring Kafka 的 send() 是异步的，"成功"只代表交给客户端。
      #    这个差异在 ArticleSyncOutboxRelay 的类级注释里有显式留痕，不是悄悄改掉。
      acks: all

  # ============== Nacos Discovery ==============
  cloud:
    nacos:
      discovery:
        # ⚠️ **必须是 `host` 与 `port` 分开两个变量**（R1-ENV-001 · 2026-11-01 收口轮）
        #    `${NACOS_ADDR:nacos:8848}` 把端口**硬编码进默认值** ⇒ `NACOS_PORT` 被完全忽略
        #    ⇒ 与 `.env.example` / `docker-compose.yaml` 的契约（NACOS_ADDR=host + NACOS_PORT=port）冲突
        server-addr: ${NACOS_ADDR:nacos}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        # 🔴 **必须显式关掉自动注册**（2026-10-30 · 补 Actuator 载体时**实测**补上）。
        #
        # 【为什么】`spring-cloud-starter-alibaba-nacos-discovery` 的**自动注册**
        # （NacosAutoServiceRegistration）注册的是 **web 容器端口** ——
        # 而本模块的 web 容器（2026-10-30 起为了给 Actuator 载体才引入）
        # 监听的是 **观测端口 9092**，**不是 gRPC 业务端口 9001**。
        # ⇒ 自动注册一旦生效 ⇒ Nacos 里会出现「article-rpc → 9092」这条**错端口**实例
        # ⇒ article-api 按 Nacos 给出的地址连过来 ⇒ 连到一个**只提供 /actuator/** 的 HTTP 端口
        # ⇒ **gRPC 链路直接断**（业务码塌成 1015）。
        # ⇒ 而且实测更狠：Nacos 不可达时自动注册**抛异常**（`failFast=true`）
        #   ⇒ 直接把**启动**打断（`Failed to start bean 'webServerStartStop'`）⇒ **进程起不来**。
        #
        # 【本模块的注册是手写的】`bootstrap/NacosRegistration.java` 用
        # `GrpcServerProperties.getPort()`（= gRPC 端口 9001）注册 ⇒ 与 Go 侧
        # `zrpc.MustNewServer` 注册 `ListenOn` 的语义一致。
        # ⇒ 自动注册必须关掉，否则**同一个服务名下会有两个端口的实例**。
        register-enabled: false

# =============================================================================
# 观测端口（Actuator 的 servlet 载体）
# =============================================================================
# 对应 Go service/article/rpc/etc/article.yaml:21-24
#     Prometheus: {Host: 0.0.0.0, Port: 9092, Path: /metrics}
# ⇒ go-zero@v1.10.2/zrpc/config.go:39   RpcServerConf **内嵌** service.ServiceConf
# ⇒ go-zero@v1.10.2/core/service/serviceconf.go:38   ServiceConf.Prometheus 字段
# ⇒ ⇒ **消费点** go-zero@v1.10.2/zrpc/server.go:63  `c.SetUp()`
#      ⇒ ⇒ core/service/serviceconf.go:62  `prometheus.StartAgent(sc.Prometheus)`
#      ⇒ ⇒ core/prometheus/agent.go:31（Host 为空 ⇒ 直接 return，不启动）
#      ⇒ ⇒ core/prometheus/agent.go:38 `http.Handle(c.Path, promhttp.Handler())`
#      ⇒ ⇒ core/prometheus/agent.go:39-41 **独立端口** `http.ListenAndServe(addr, nil)`
# ⇒ ⇒ Go 侧 article-rpc **真的**在 0.0.0.0:9092 起了一个 HTTP 服务（路径 /metrics）
#
# ⚠️ **端口一字不差**（9092）⇒ 抓取配置只需改**路径**
#    （Go `/metrics` → RAG `/actuator/prometheus`，Actuator 的固定前缀）
#
# ⚠️ **与 gRPC 业务端口严格分离**：本端口只承载 Actuator（**无任何业务 HTTP 路由**），
#    gRPC 仍是 `grpc.server.port`（9001）。
#    ⇒ 探针/部署可用 ARTICLE_RPC_MANAGEMENT_PORT 覆盖（探针会自动挑空闲端口）。
server:
  port: ${ARTICLE_RPC_MANAGEMENT_PORT:9092}

# =============================================================================
# 角色标记：rpc 侧（**不是** api 侧）
# =============================================================================
# 🔴 **这一行是「共享层 api 侧 web 能力的边界声明」**（2026-10-30 · 合并收口执行者要求）
#
# 【为什么必须写】—— 共享层那批 **api 侧**的 web 能力（`GoStyleCpuSheddingFilter` ·
#   `GoStyleMaxConnsFilter` · `GoStyleMaxBytesFilter` · `GoStyleBreakerFilter` +
#   `GoStyleTomcatParameterLimitCustomizer` 等）是**按 `rag.side` 分边**的
#   ⇒ G4 侧把门扩成 `@ConditionalOnProperty(prefix="rag", name="side", havingValue="api",
#   matchIfMissing=true)` ⇒ ⇒ **不写这一行 = 默认落在 api 侧** ⇒ ⇒ 那些 Bean 会照常活。
#
# 【为什么 rpc 侧必须落在 rpc 侧】—— Go 侧 rpc **一个 rest 中间件都没挂**
#   （全部走 `zrpc.MustNewServer` ⇒ 不起 servlet 容器 ⇒ 没有 filter 链）
#   ⇒ ⇒ 观测端口上**不该**挂着 Go 侧不存在的中间件 ⇒ 其中 **CPU 降载会拒请求**
#   ⇒ ⇒ 直接威胁「载体存在的目的」（抓取请求被拒 ⇒ 载体装了但抓不到）。
#
# ⚠️ **当前状态（2026-10-30 实测 · 如实标注）**：
#   共享层**当前还没有**消费 `rag.side` 的条件（`grep -rn "rag.side" service/common/src/main/java/`
#   **零命中**）⇒ ⇒ **这一行现在还没有消费点** ⇒ ⇒ 它是**为 G4 正在扩的那道门预留的对侧**。
#   ⇒ ⇒ 门落地前，它**不生效**；落地后，它**必须**已经在位（否则 rpc 域会挂上 api 侧的中间件）。
#   ⇒ ⇒ 域侧的运行期断言见本域的 `*RpcSharedLayerWebBeanGateTest`（它断言「那些 Bean 不在容器里」）。

rag:
  # 🔴 **必须显式写 `rpc`**（2026-10-30 · 合并收口执行者要求）—— 见上方注释：
  #   `matchIfMissing=true` ⇒ **不写 = 默认 api 侧** ⇒ 共享层的 api 侧 web Bean 会挂上来。
  side: rpc

  # 🔴 **客户端硬上界（Go 侧 zrpc client 的 `Timeout`）** —— 2026-10-31 · G3 第十一轮
  #   ⇒ ⇒ **第十二轮复核了取值依据**（Go 的 `Timeout` 是**按 client** 生效 ⇒ 本域两个方向真值不同）
  #   Go 出处（消费点，不是声明点）：
  #     go-zero@v1.10.2/zrpc/config.go:31          `Timeout int64 \`json:",default=2000"\``
  #     go-zero@v1.10.2/zrpc/internal/config.go:15 `Timeout bool \`json:",default=true"\``
  #     go-zero@v1.10.2/zrpc/internal/client.go:113-117（**无条件**装 TimeoutInterceptor）
  #     go-zero@v1.10.2/zrpc/client.go:70-71        `if c.Timeout > 0 { WithTimeout(...) }`
  #        ⇒ ⚠️ **`Timeout` 挂在 `zrpc.RpcClientConf` 上 ⇒ 每个 client 一份 ⇒ 按 client 生效**
  #
  #   【🔴 本域 yaml 的两个出向客户端超时**不同**（第十二轮实测）】
  #     service/article/rpc/etc/article.yaml
  #       :92-96  MessageRpc:   { … }                  ← **没写 Timeout** ⇒ 走 default **2000**
  #                                            （Go: svc/service_context.go:74 ⇒ **本域唯一活着的出向出口**）
  #       :85-90  SecurityConf: { …, Timeout: 10000 }  ← 显式 10000
  #                                            （Go: svc/service_context.go:60）
  #       :3      Timeout: 70000                      ← **服务端**方法超时（顶层挨着 ListenOn）⇒ **不是**客户端值
  #
  #   【⚠️ 为什么这里取 2000（而不是 10000）—— 判据 =「可观察行为」】
  #     共享层这个 `cap-millis` 是**模块级一个数** ⇒ 装哪个值都会有一侧与 Go 不同 ⇒
  #       装 **2000** ⇒ message 方向 = Go **精确同形**（本域唯一活着的出向出口）
  #                    ⇒ security 方向会比 Go **严 5 倍** —— ⚠️ 但该方向**当前没有任何真实调用**
  #                       （`SecurityRpcClient` / `ImageSecurityRpcClient` 全仓零引用，实际生效的是
  #                        骨架 `UnavailableContentSecurityClient`）⇒ ⇒ **不可观测 ⇒ 不是行为漂移**
  #       装 **10000** ⇒ security 方向 = Go 同形；**但** message 方向会被**放宽 5 倍**
  #                    ⇒ ⇒ 那是**活路径上的可观察漂移**（Go 2s 放弃 / RAG 10s 才放弃；
  #                        且该出口**吞掉异常** ⇒ 只表现为「消费变慢」⇒ **更难被发现**）
  #     ⇒ ⇒ **取 2000**（可观察行为优先：活路径精确 > 死路径潜在偏差）
  #     ⇒ ⇒ ⚠️ **这不是「模块级一个数能表达 Go 的 per-client 语义」** —— 它表达不了
  #         ⇒ ⇒ **共享层的模型缺口**（多 client 域需要 per-client 上界）⇒ ⇒ 归 **G4 写权**
  #         ⇒ ⇒ 本域**不擅自**用内联 cap 绕开（共享层棘轮
  #         `GoStyleClientCallTimeoutSingleSourceGateTest` 判据 ④ **明令禁止**域侧自带 cap）
  #         ⇒ ⇒ 等共享层支持 per-client 上界后，本行再按 Go 逐方向拆开
  #
  #   ⚠️ 共享层 `GoStyleProtectionProperties.OutboundDeadline#capMillis` **默认 0 = 不启用**
  #     ⇒ ⇒ **不配这一行 = 出向零期限 = 比 Go 松** ⇒ ⇒ 域侧副本已于第十一轮删除（改由共享层统一施加）
  protection:
    outbound-deadline:
      cap-millis: 2000

# =============================================================================
# gRPC server（devh）
# =============================================================================
grpc:
  server:
    # 对应 Go ListenOn: 0.0.0.0:9001
    port: ${ARTICLE_RPC_PORT:9001}
    address: 0.0.0.0
    # ⚠️ Go 的 Timeout: 70000 **不在这里**。
    #    Go 的 RpcServerConf.Timeout 由 go-zero 的 UnaryServerInterceptor 强制执行，
    #    Java 侧的等价物是 observability.rpc-timeout（见本文件末尾）+ 必须真正挂到
    #    server 上的 RpcServerInterceptor（见 ArticleRpcApplication#rpcInterceptorConfigurer）。
    #    devh 的 grpc.server.timeout 是 channel 级，语义不同，不要拿来顶替。
    # Go 端 reflection 在 DevMode/TestMode 启用，Java 端由 devh starter 默认注册 reflection

  # ============== gRPC client ==============
  # 对应 Go SecurityConf.Etcd.Key: security.rpc / MessageRpc.Etcd.Key: message.rpc
  # Java 端用 service discovery 解析，与 Go 等价寻址。
  # ⚠️ **下面两个地址必须是三斜杠 `discovery:///<service-name>`**（2026-10-26 真启动实测修正）。
  #    devh 的 `net.devh.boot.grpc.client.nameresolver.DiscoveryClientResolverFactory#newNameResolver`
  #    判定的是 `uri.getPath()`：**必须非空、长度 > 1、且以 "/" 开头**。
  #      discovery:///security-rpc → authority="" 、path="/security-rpc"  ✅
  #      discovery://security-rpc  → authority="security-rpc"、path=""     ❌ 长度 0，直接抛
  #        IllegalArgumentException: Incorrectly formatted target uri;
  #        expected: 'discovery:[//]/<service-name>'; but was 'discovery://security-rpc'
  #    ⇒ 两斜杠写法**不是「少写一个斜杠」**，它把服务名解析成了 authority、path 留空
  #    ⇒ 校验发生在任何网络调用之前 ⇒ **与 Nacos 在不在线无关**
  #    ⇒ `grpcClientBeanPostProcessor` 先炸 ⇒ **连 Flyway 都跑不到** ⇒ 真 fat jar 起不来。
  #    ⚠️ 之所以没人发现：**测试把地址覆盖成了 static://127.0.0.1:1**，
  #    生产地址从未被任何测试跑过 ⇒「跑绿」与「能启动」无关。
  #    守门：ArticleRpcProductionAddressTest（直接调 devh 真正的消费点）。
  client:
    # ⚠️⚠️ **下面两个 `deadline:` 键在本仓是「死配置」（2026-10-31 第十二轮实测）**
    #   【实测】`grep -rn 'spring\.grpc\.client' --include=*.java service/` ⇒ **零命中**
    #     ⇒ 全仓**没有任何** `@ConfigurationProperties("spring.grpc.client")`
    #   【实测】devh `grpc-client-spring-boot-starter 3.1.0.RELEASE` 的客户端属性只有
    #     `net.devh.boot.grpc.client.channels.*`（keepalive / negotiation / shutdown）
    #     ⇒ **它根本没有 per-client deadline 这个旋钮** ⇒ ⇒ 这两个键**不生效**
    #   ⇒ ⇒ **别把「yml 里写了 deadline」读成「出向调用有了 deadline」**（AGENTS.md §3.3.1）
    #   ⇒ ⇒ **真正生效的上界** = 共享层的 `rag.protection.outbound-deadline.cap-millis`（模块级一个数）
    security-rpc:
      address: discovery:///security-rpc
      enable-keep-alive: true
      keep-alive-time: 30s
      # ⚠️ 对应 Go SecurityConf.Timeout: 10000（yaml 里显式配了，不是框架默认值）
      #    ⚠️ **本键不生效**（见上方「死配置」实测）⇒ 该方向当前**无真实调用**
      deadline: 10s
    message-rpc:
      address: discovery:///message-rpc
      enable-keep-alive: true
      keep-alive-time: 30s
      # ⚠️ Go 的 MessageRpc **没有**配 Timeout ⇒ 走 go-zero 的默认值 **2000ms（2s）**。
      #    证据（消费点，不是声明点）：
      #      声明点：go-zero@v1.10.2/zrpc/config.go:31 —— `Timeout int64 `json:",default=2000"``
      #      消费点：go-zero@v1.10.2/zrpc/client.go:70-71 —— `if c.Timeout > 0 { WithTimeout(...) }`
      #    ⚠️ 之前这里引的是 `zrpc/internal/config.go:14`，那一行在 `ClientMiddlewaresConf` 里，
      #    是**中间件开关**（`Timeout bool `json:",default=true"``）而非超时值；3s 实际是
      #    `rest/config.go:55` 的 `RestConf.Timeout`（HTTP 侧），被串到了 RPC 侧。
      #    同类错误：等不到去读标签的 default，就把别的类型的默认值当成本类型的默认值（AGENTS.md §3.3.1）。
      #    ⚠️ 另：版本号此前误写 `v1.10.3` ⇒ 本域 `service/article/rpc/go.mod:17` 钉的是 **v1.10.2**
      #    （与共享层 `GoStyleOutboundDeadlineInterceptor` 的 javadoc 同版本）⇒ 本轮据实订正。
      #    ⚠️ **本键不生效**（见上方「死配置」实测）⇒ 真实上界 = 模块 cap 2000
      deadline: 2s

# =============================================================================
# article-rpc 业务配置 —— 对应 Go etc/article.yaml 的非基础设施段
# =============================================================================
article-rpc:
  postgres:
    host: ${POSTGRES_HOST:postgres}
    port: ${POSTGRES_PORT:5432}
    user: ${POSTGRES_USER:admin}
    # 🔴 **口令占位符必须是「裸」写法**（2026-10-30 · 合并收口执行者派工 · 与 Go **逐字同形**）
    #   【Go 出处】service/article/rpc/etc/article.yaml:13
    #   【Go 的展开语义】go-zero 的加载 = `core/conf/config.go:63`
    #       `loader([]byte(os.ExpandEnv(string(content))), v)` ⇒ ⇒ **`os.ExpandEnv` 不认
    #       `${VAR:default}` 语法** ⇒ 缺变量时它把**整串当变量名**去查 ⇒ ⇒ **空串**
    #       ⇒ ⇒ Go 侧缺 `POSTGRES_PASSWORD` = **空口令** ⇒ 连库失败 = fail-fast
    #   【为什么取消原先的兜底】原先这里是 `${POSTGRES_PASSWORD:password}` ⇒ 走 **Spring 的
    #       `:default` 语义** ⇒ **缺变量时会用那个默认值连上去** ⇒ ⇒ **RAG 比 Go 松**
    #       （Go 必然失败、RAG 照样起）⇒ ⇒ 属**真漂移**，**不是**「更严的有意偏离」
    #       ⇒ ⇒ 不需要为「保留兜底」签字 ⇒ ⇒ 本轮取消。
    #   ⚠️ **残余差异（失败时刻不同）**：Go = **启动成功、连库时**失败；
    #      RAG = **启动即失败**（Spring 解析不到占位符 ⇒ DataSource bean 创建失败）
    #      ⇒ ⇒ 属「**RAG 更严**的一侧」⇒ ⇒ 由**合并收口执行者**在合并窗口统一登记
    #      ⇒ ⇒ **不是**「保留兜底」的理由。
    password: ${POSTGRES_PASSWORD}
    dbname: ${POSTGRES_DB:first_db}

  # Go KqPusherConf：审核事件 push（create / update 入队审核）
  kq-pusher-conf:
    name: article-mq-pusher
    group: article-creation-group
    brokers: "${KAFKA_BROKERS:kafka:9092}"
    topic: article-creation-topic

  # Go KqConsumerConf：审核消费者
  kq-consumer-conf:
    name: dataclean-consumer
    brokers: "${KAFKA_BROKERS:kafka:9092}"
    group: dataclean
    topic: article-creation-topic
    offset: first

  # Go ArticleSyncPusherConf
  article-sync-pusher-conf:
    name: article-sync-pusher
    group: article-sync-pusher
    brokers: "${KAFKA_BROKERS:kafka:9092}"
    topic: article-sync-events

  # Go ArticleSyncResultConsumerConf
  article-sync-result-consumer-conf:
    name: article-sync-result-consumer
    brokers: "${KAFKA_BROKERS:kafka:9092}"
    group: article-sync-result
    topic: article-sync-results
    offset: first

  security:
    key: security.rpc
    # ⚠️ **本字段当前没有消费点**（2026-10-31 第十二轮实测）—— 保留它只为让配置面与 Go 一一对应
    #    （Go: `article.yaml:85-90` 的 `SecurityConf.Timeout: 10000`）
    #    ⇒ 共享层的 `cap-millis` 是**模块级一个数** ⇒ ⇒ 装不下「按 client 各一个」⇒ ⇒ 详见 `rag.protection` 段注释
    timeout: 10000
  message-rpc:
    key: message.rpc
    # 对应 Go 的未配超时 ⇒ zrpc 默认 2000ms（与上方 `grpc.client.message-rpc.deadline` 同一个值）
    # ⚠️ **本字段当前也没有消费点**（同上）⇒ 真正生效的是 `rag.protection.outbound-deadline.cap-millis=2000`
    #    ⇒ ⇒ 等共享层支持 per-client 上界后，本字段就是该方向的落点（值已与 Go 同源）
    timeout: 2000

  article-sync-outbox:
    poll-interval-ms: 1000
    batch-size: 100
    max-retry: 10

  minio:
    endpoint: ${MINIO_ENDPOINT:minio:9000}
    # 部署环境建议填写对外可访问的静态资源基址；留空时回退到 Endpoint（Go upload_file_logic.go:94-101）
    public-base-url: ${MINIO_PUBLIC_BASE_URL:http://localhost:39000}
    access-key-id: ${MINIO_ACCESS_KEY:minioadmin}
    secret-access-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: articles
    use-ssl: false
    # ⚠️ 两个 path 都**带尾斜杠**，Go 是纯字符串拼接，不做规范化
    image-path: "articles/images/"
    article-path: "articles/content/"

# =============================================================================
# Actuator / Metrics
# =============================================================================
management:
  endpoints:
    web:
      exposure:
        # ⚠️ **这行以前是死配置**（2026-10-30 补 `spring-boot-starter-web` 后才真正生效）：
        #    `spring-boot-starter-actuator` 只给 endpoint 与自动配置，**不给 servlet 容器**
        #    ⇒ classpath 上没有 jakarta.servlet.Servlet / ConfigurableWebApplicationContext
        #    ⇒ WebApplicationType 推导出 NONE ⇒ 没有 web server
        #    ⇒ 这一族配置**不加载**（不是报错，是静默无效）。
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      # ℹ️ 这是一条**公共标签**（common tag）=「这份指标属于哪个服务」，
      #    **不是**指标名前缀 ⇒ Go 侧**没有**对应物（Go 的指标名里不含服务名）。
      #
      #    Go 侧的**指标名前缀**是 Namespace: "article_service"
      #    （service/article/rpc/metrics/metrics.go:6），
      #    对应 RAG 侧 ArticleRpcMetrics.NAMESPACE（metrics/ArticleRpcMetrics.java:59）
      #    ⇒ 两侧的指标名一致（`article_service_*`）。
      #    ⚠️ 原注释写「Subsystem: article_rpc」是**写错了**（Go 侧用的是 Namespace，
      #    没有 Subsystem 这一层）⇒ 本轮据实订正。
      application: article-rpc
  prometheus:
    metrics:
      export:
        enabled: true

# =============================================================================
# OpenTelemetry OTLP
# =============================================================================
otel:
  service:
    name: article-rpc           # 对应 Go Telemetry.Name: article-rpc
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:jaeger:4317}
  traces:
    exporter: otlp
    # 对应 Go Sampler: 1.0
    sampler: parentbased_always_on

# =============================================================================
# observability —— 对齐 Go RpcServerConf.Timeout: 70000
# =============================================================================
# ⚠️ Go yaml 配的是 70000ms（不是 message 域那个"未配 ⇒ 默认 2000"）。
#    这里必须配 70s，配成 2s 会把正常的长审核链路判成超时 —— 那是行为漂移。
observability:
  rpc-timeout: 70s

# =============================================================================
# JVM 时区 —— 对应 Go DSN 里的 TimeZone=Asia/Shanghai
# =============================================================================
# ⚠️ Go 的 GORM DSN 显式带 `TimeZone=Asia/Shanghai`（model/db.go:31）。
#    PostgreSQL 的 timestamptz 本身按 UTC 存储，但**读写时按会话时区转换**；
#    若 JVM 时区不同，`created_at`/`updated_at`/`published_at` 的 Instant 换算会差一个时区。
#    这里显式对齐（DRIFT-MSG-V-007 同款问题的预防措施）。
spring.jackson.time-zone: Asia/Shanghai