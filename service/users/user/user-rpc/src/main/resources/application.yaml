# user-rpc 启动配置 —— 对齐 Go 端 service/user/user/rpc/etc/user.yaml
# 这份文件只覆盖"最小可跑"项；后续业务配置（TLS / 限流 / 熔断 / etc.）按需扩展。

spring:
  application:
    name: user-rpc

  # ===== 1. Postgres（对齐 Go 端 Postgres.*）=====
  datasource:
    # POSTGRES_ADDR/POSTGRES_PORT 来自 docker-compose.yaml（默认 postgres:5432）
    # 当 CONTAINER_PREFIX=Sea + 复用现有基础设施时，host 实际是 Sea-postgres；
    # compose 会通过 POSTGRES_ADDR 注入正确值
    url: jdbc:postgresql://${POSTGRES_ADDR:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:first_db}?sslmode=disable
    username: ${POSTGRES_USER:admin}
    # ⚠️ **本行无默认值（2026-10-30 按 Go 同形取消 fallback · `S1-USERS-002`）**
    #    Go 侧（`service/user/user/rpc/etc/user.yaml:13`）= `Password: "${POSTGRES_PASSWORD}"` ⇒ **无默认值**：
    #    go-zero `core/conf/config.go:63` 用 `os.ExpandEnv` 展开 ⇒ 它**不认** `${VAR:default}` 语法
    #    ⇒ 未设 env 即展开成**空串** ⇒ 用空口令连库 ⇒ 认证失败 ⇒ **fail-fast**。
    #    RAG 侧此前给这个占位符挂了**明文默认口令** ⇒ 缺变量时**用那个公开口令连上**
    #    ⇒ 与 Go **不同形**（Go 连不上 / RAG 连得上）⇒ ⇒ 那是一条**真漂移** ⇒ 本轮取消。
    #    ⚠️ **残余差异（RAG 更严的一侧）**：Go = 启动成功、**连库时**失败；RAG = **启动即失败**
    #    （Spring 解析不到占位符 ⇒ DataSource bean 创建失败）⇒ ⇒ 失败时刻不同 ⇒ 属有意偏离候选。
    #    ⚠️ 注入侧一字不变：根级 `docker-compose.yaml` 用 `${POSTGRES_PASSWORD:?…}` 强制要求并透传、
    #    `manage.sh` 硬校验 `.env`、`tools/difftest/*` 对拍装置显式 export ⇒ **不打断任何现有流程**。
    #    ⚠️ 其余 7 处（article×2 / comment / favorite / like / message / task）属 G2/G3 面 ⇒ 口径尚未全仓统一。
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # ===== 2. MyBatis-Plus + 建表（取代 JPA/Hibernate；对齐 Go 端 GORM + AutoMigrate）=====
  # ⚠️ 建表**不再用 Flyway**（2026-10-21，DRIFT-NEW-015）。
  #   原因：flyway_schema_history 是 schema 级账本，一个 schema 只能有一本账；
  #   而 user-rpc 与 admin-rpc 的迁移版本号撞车、内容不同，两个进程又必须连同一个库
  #   （admin-rpc 也读写 users_user）⇒ 后启动的那个要么静默跳过自己的迁移、
  #   要么 checksum mismatch 直接启动失败。
  #   「加 validate-on-migrate=false + out-of-order=true 糊过去」也已实测证伪，
  #   见 tools/difftest/exp-drift015-flyway-flags.sh。
  #
  #   现在的做法：由 bootstrap/UserSchemaBootstrap 在 @PostConstruct 里用
  #   com.rag.users.common.ddl.SchemaInitializer 把 users-common 里的 4 份
  #   db/*.sql 幂等重放一遍（全部 CREATE ... IF NOT EXISTS）。
  #   ⇒ 无账本、无版本号、无跨进程状态，谁先启动都行 —— 这正是 Go 侧
  #     GORM AutoMigrate 的无状态语义（user/rpc/internal/model/db.go:33）。
  #
  #   已知代价：第一次 ALTER 之前可以无视；之后必须重新引入版本化机制，
  #   因为脚本要同时承担「建表」与「升级」两件事。详见 SchemaInitializer 的 javadoc。

  # ===== 3. Redis（对齐 Go 端 BizRedis）=====
  # ⚠️ 必须挂在 spring: 下。放错块（如 mybatis-plus:）Spring Boot 完全读不到，
  #    StringRedisTemplate 会静默退回 localhost:6379，导致 logout 写错 Redis 实例。
  data:
    redis:
      # REDIS_ADDR/REDIS_PORT 来自 docker-compose.yaml
      host: ${REDIS_ADDR:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # ⚠️ 取值出处（2026-10-27 补记，此前只有数值没有出处）：
      #   Go 的 user.yaml 的 BizRedis 段**没有**任何 timeout 字段
      #     （service/user/user/rpc/etc/user.yaml:17-20 = Host/Type/Pass 三项）
      #     → go-zero v1.10.2 core/stores/redis/redisclientmanager.go:32-39
      #       建 red.Options 时只传 Addr/User/Pass/DB/MaxRetries/MinIdleConns/TLSConfig
      #       —— **三个 timeout 一个都没传**
      #     → go-redis/v9 **v9.20.0**（Sea 仓 go.mod:15 **直接 pin**）options.go 的 init() 默认：
      #        ReadTimeout = 3s（options.go:364-370）· DialTimeout = 5s（options.go:338-339）· WriteTimeout = ReadTimeout（:374-378）
      #   ⇒ 读命令超时 3s，与 go-redis 默认逐字相同。
      #   🔴 go-zero redis.go:27 的 `readWriteTimeout = 2s` 是**死常量**（全文件只有 BLPop 用），
      #      对这里的 SETEX 不适用，别被它误导。
      timeout: 3s
      # 连接超时：Go 的 go-redis DialTimeout 默认 **5s**（service/user/user/rpc 只写黑名单，
      # 见 logoutlogic.go:35 的 SetexCtx ⇒ 连接超时在这一条路径上是生效的）。
      # ⚠️ **不配这行会变成 10s，不是 3s**：
      #   Boot 4.0.8 LettuceConnectionConfiguration.createClientOptions 的字节码是
      #     Duration connectTimeout = getProperties().getConnectTimeout();
      #     if (connectTimeout != null) { builder.socketOptions(SocketOptions.builder().connectTimeout(...)); }
      #   ⇒ **null ⇒ 整段不执行** ⇒ 用 Lettuce 自己的默认
      #     （io.lettuce.core.SocketOptions.DEFAULT_CONNECT_TIMEOUT = 10s）
      #   ⇒ 与 Go 的 5s 不一致 ⇒ 必须显式配。
      # ⚠️ 此前本仓多处写成「不配会回落到 timeout=3s」——**那是错的**（Boot 4 无此回落），
      #    正确说法是「不配 ⇒ Lettuce 默认 10s」。详见 DRIFT-USERRPC-V-014。
      connect-timeout: 5s

  # ===== 3.5. Nacos 服务注册（修 DRIFT-NEW-001）=====
  # user-rpc 启动时自动注册到 Nacos，user-api 通过 discovery://user-rpc 发现本服务。
  # 服务名 user-rpc 与 user-api 端 grpc.client.user-rpc.address 中的 discovery name 对齐。
  # ⚠️ 同上：必须挂在 spring: 下，否则 NacosRegistration 会用默认的 127.0.0.1:8848 + public
  #    namespace 注册，与 user-api 的 NACOS_NAMESPACE=sea-rtw 对不上，服务发现必然断链。
  cloud:
    nacos:
      discovery:
        # NACOS_ADDR/NACOS_PORT 来自 docker-compose.yaml
        server-addr: ${NACOS_ADDR:localhost}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:sea-rtw}
        group: ${NACOS_GROUP:USER_GROUP}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}

# ===== 2.5. MyBatis-Plus 配置 =====
# HUMAN_ONLY.MD 要求 @MapperScan 自动发现 mapper interface（com.rag.users.user.rpc.mapper 包）
mybatis-plus:
  # entity 扫描包（用于 typeAlias 注册）
  type-aliases-package: com.rag.users.user.rpc.domain
  # mapper.xml 位置（Phase 1 填肉阶段如有自定义查询 XML 放这里）
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # 下划线 → 驼峰自动转换（user_name → userName）—— Phase 1 填肉阶段视需求开启
    map-underscore-to-camel-case: true
    # 日志实现（默认 NONE；填肉阶段可改 stdout 调试）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

# ===== 4. gRPC server（对齐 Go 端 ListenOn: 0.0.0.0:9004）=====
# 选项 C：user-rpc 严格保持纯 gRPC，不加 spring-boot-starter-web，
# 因此 application.yaml 里没有 server.port（Spring Web 也不会起）。
# Go 端 user-rpc 是纯 gRPC 进程，行为 1:1。
grpc:
  server:
    # ⚠️ 默认端口**一字不变**（修 INFRA-001：9004 → 49210，Infrastructure.md §3 锁定）。
    #    加 env 覆盖是为了与同域 `user-api` / `follow-api` / `follow-rpc` 的**可覆盖策略一致**，
    #    并解除「本机该口已被占 ⇒ 组件无法真启动 / 无法并行起」的死结
    #    （2026-10-28 实测：49210 被 `Sea-user-rpc` 容器占着）。
    #    ⚠️ 改口时**必须同时确认 Nacos 注册地址跟着变** —— devh 用这个端口既监听又注册。
    port: ${USER_RPC_PORT:49210}
    # DRIFT-003 修正：Go 端 user.go:39-41 仅当 c.Mode == service.DevMode/service.TestMode 时注册 reflection，
    # 而 user.yaml 默认 Log.Mode=file（生产），所以生产环境 reflection 是关闭的。
    # Java 侧默认 false 与 Go 端 1:1；本地调试改 true 或用 GRPC_SERVER_REFLECTION_SERVICE_ENABLED=true 覆盖。
    reflection-service-enabled: false
    enable-keep-alive: true
    keep-alive-time: 30s
    permit-keep-alive-without-calls: true

# ===== 5. 业务配置（对齐 Go 端 UserAuth.*）=====
# 对应 Go: UserAuth.AccessSecret / UserAuth.AccessExpire
#
# 🔴 2026-10-29 · G1 阶段 1 · P0 #8：**默认明文值已去掉**（原为**带明文默认值**的 `${USER_JWT_SECRET}`；
#    那个 36 字节 UUID 明文已从本仓清除 ⇒ 本仓不再持有那把密钥）
#    ⇒ 理由：那把 UUID 是**写在仓里的公开密钥** ⇒ 谁都能用它伪造 JWT ⇒ 而本密钥是 **user 域的签发密钥**
#      （签发方 = user-api / `UserLoginService.java:127`；验签方 = user-api / user-rpc）
#      ⇒ ⇒ 一旦部署时忘了覆盖 ⇒ **任何人都能签出任意 user token**（P0 #8 · token 伪造）。
#    ⇒ 现在 **缺变量 ⇒ 启动失败**（Spring Boot 4 的 `SpringConfigurationPropertySource` 取**原始标量**
#      ⇒ 占位符**解析不出来时原样留下** ⇒ 绑上去的是字面量 `${USER_JWT_SECRET}` ⇒
#      ⇒ 由 `UserRpcProperties#verifyAccessSecret` 的 @PostConstruct **判掉** ⇒ **启动失败**）；
#      **变量存在但为空串 ⇒ 也启动失败**（同上：@PostConstruct 判空 ⇒ 抛 IllegalStateException）
#      ⇒ ⇒ **两条路都 fail-closed**。
#    ⚠️ **Go 侧对照（§3.1）**：Go `service/user/user/rpc/etc/user.yaml:34` 写的是**字面量**；
#      且 Go 的 user-rpc **只消费 AccessExpire**（`internal/logic/logoutlogic.go:36`），
#      **不消费 AccessSecret** ⇒ ⇒ RAG 本侧属「**更严**」的一侧 ⇒ 登记为有意偏离（不是抄错 Go）。
#    ⚠️ 本地开发 / 测试：本模块测试用 `src/test/resources/application.properties` 提供同名变量
#      ⇒ ⇒ **测试不依赖环境变量**。
#    ⚠️ 部署侧：根级 `docker-compose.yaml` 已按 `USER_JWT_SECRET: ${USER_JWT_SECRET}`（**无默认**）注入。
user-rpc:
  user-auth:
    access-secret: ${USER_JWT_SECRET}
    access-expire: ${USER_JWT_EXPIRE:2592000}    # 30 天，与 Go 端 etc/user.yaml 一致

# =============================================================================
# 进程形态：rpc 侧（`rag.side: rpc`）
# =============================================================================
# 🔴 **这一行是「共享层 api 侧中间件」的闸门**（2026-10-30 · G1 lane）
#
# 【Go 出处】Go 的 rpc 进程**一个 rest 中间件都没挂**（全部 `zrpc.MustNewServer`）
#   ⇒ ⇒ rpc 侧不存在任何 servlet 过滤器 ⇒ ⇒ RAG 的 rpc 域也**不得**挂 Go 侧没有的中间件。
#
# 【机制】共享层用 `@ConditionalOnApiSide`
#   （= `@ConditionalOnProperty(name="rag.side", havingValue="api", matchIfMissing=true)`）
#   挡住 api 侧那 **13 个类**（11 个带 `@ConditionalOnWebApplication(SERVLET)` ＋
#   `HttpMiddlewareFilter`（无条件 `@Component`）＋ `GoStyleJsonBodyConverterConfig`（`@Configuration`））：
#   `GoStyleCpuSheddingFilter` / `GoStyleMaxConnsFilter` / `GoStyleMaxBytesFilter`
#   / `GoStyleBreakerFilter` + 路由模板 / `GoStyleTraceparentFilter` / `HttpMiddlewareFilter`
#   / `GoStyleFormLimitWebMvcConfig` / `GoStyleFormValueLimitInterceptor`
#   / `GoStyleJsonBodyConverterConfig` / `GoStyleJsonContentTypeAdvice`
#   / `GoStylePathNormalizingAutoConfiguration` / `GoStyleTomcatParameterLimitCustomizer`
#   ⇒ ⇒ 其中**会「拒请求」的只有两个**：`GoStyleCpuSheddingFilter`（CPU 高负载）
#   与 `GoStyleMaxConnsFilter`（连接数超限）⇒ ⇒ 抓取请求可能被自己域的中间件挡掉。
#   ⚠️ **`matchIfMissing=true` ⇒ 默认就是 api 侧** ⇒ ⇒ rpc 域**必须显式写这一行**。
#
# 【本模块当前状态】下面的 `management.server.port: -1` ⇒ **本模块没有 servlet 容器**
#   ⇒ ⇒ 这一行当前是**防御性的**（没有载体 ⇒ 就没有 web 上下文）。
#   ⚠️ 但**一旦按 `S1-FOLLOW-001` 的裁定给本模块加观测载体**，这一行就是**必做项**：
#   ⇒ 载体 = servlet 上下文 ⇒ ⇒ 若不写这一行 ⇒ ⇒ 那 13 个 Bean 会挂到观测口上
#   ⇒ ⇒ 其中 `GoStyleCpuSheddingFilter` 在 CPU 高负载时**拒掉抓取请求**
#   ⇒ ⇒ 而 Go 侧 rpc 域一个中间件都没挂 ⇒ ⇒ **与 Go 不同形**。
#
# ✅ **现状（2026-10-30 · 合并主干后订正）**：共享层的 `ConditionalOnApiSide` **已落库**（`53bc05ec`）
#   ⇒ ⇒ **这一行现在真的被读了**（原写「本分支基线上尚未落库 ⇒ 死配置」是**分支相对**的说法 ⇒ 叠到主干后已不成立 ⇒ 原值保留备查）
#   ⇒ ⇒ **本行是必做项**：该注解默认值是 api（`matchIfMissing=true`）⇒ ⇒ rpc 域**必须显式写这一行**
#   ⇒ ⇒ 本模块**目前 `management.server.port: -1`（无 servlet 容器）⇒ 此刻是防御性的**
#   ⇒ ⇒ 但一旦按 `S1-FOLLOW-001` 的裁定加了观测载体 ⇒ ⇒ 不写它 ⇒ ⇒ 那 13 个 api 侧 web 类就挂到观测口上
#        （其中 `GoStyleCpuSheddingFilter` 在 CPU 高负载时会**拒掉抓取请求** ⇒ 而 Go 侧 rpc 域一个中间件都没挂 ⇒ ⇒ 与 Go 不同形）。
rag:
  side: rpc

# ===== 6. Spring Boot Actuator：禁掉 HTTP 端点，user-rpc 保持纯 gRPC =====
# Go 端 user-rpc 没有 HTTP endpoint，Java 侧必须 align。
# ⚠️ 注意：metrics 仍注册到 Micrometer（Metrics.java 显式 Counter.builder），
# 只是无法通过 /actuator/prometheus 抓取。如未来想 scrape 需先加 spring-boot-starter-web。
management:
  server:
    port: -1                       # 关键：禁用 management HTTP server
  endpoints:
    enabled-by-default: false      # 不自动开任何 endpoint
  endpoint:
    health:
      enabled: false
    prometheus:
      enabled: false               # 显式禁掉 prometheus HTTP endpoint
  metrics:
    enable:
      prometheus: true             # 但 Counter 注册流程保留（Micrometer 内存里仍可读到）
    tags:
      application: ${spring.application.name}

# ===== 7. OpenTelemetry OTLP exporter（对齐 Go 端 Telemetry.*）=====
# Go: Endpoint=jaeger:4317, Batcher=otlpgrpc, Sampler=1.0, Name=user-rpc
# Java 侧 opentelemetry-exporter-otlp 默认按 OTLP/gRPC 协议发到 otel.exporter.otlp.endpoint
# OTEL_ADDR/OTLP_PORT 来自 docker-compose.yaml
otel:
  exporter:
    otlp:
      endpoint: http://${OTEL_ADDR:jaeger}:${OTLP_PORT:4317}
      protocol: grpc
  resource:
    attributes:
      service.name: user-rpc
  traces:
    sampler: always_on          # 对齐 Go Sampler: 1.0

# ===== 8. Snowflake worker ID（通过环境变量注入）=====
# 对应 Go 端 bwmarrin/snowflake 的 NodeId。Snowflake.java 已经支持从环境变量读：
#   export SNOWFLAKE_NODE_ID=0     # 本地开发默认 0
#   export SNOWFLAKE_NODE_ID=42    # 生产环境按节点编号指定（0~1023）
# 如果不设置，Snowflake.java 会用 SHA-256(SERVICE_NAME + "-" + PID) 兜底，自动生成一个
# 0~1023 之间的 ID（同一进程多次重启会变）。
#
# Spring Boot 不直接从 application.yaml 注入到 System.getenv；需要在启动脚本里 export。
# 例：docker run -e SNOWFLAKE_NODE_ID=1 user-rpc:latest
#
# 如需在 application.yaml 覆盖，需要改 service/common 的 Snowflake.java 增加 System property fallback。

# ===== 9. 日志（Spring Boot 默认走 logback-classic，SLF4J）=====
# Logger.java 已显式调 Logger.init("user-rpc")，MDC trace_id 会被自动填入。
logging:
  level:
    root: INFO
    com.rag.users.user.rpc: INFO
    com.rag.common: INFO
# ===== observability（对齐 Go service/user/user/rpc 的 DisableNativeRpcTimeout + NewUnaryServerInterceptor）=====
# 取值依据：Go 侧 service/user/user/rpc/etc/user.yaml 未配置 Timeout，
# 实际生效值为 go-zero v1.10.2 `zrpc/config.go:46` 的 `Timeout int64 json:",default=2000"` → 2000ms。
observability:
  rpc-timeout: 2s
